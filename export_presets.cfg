; Export all runtime resources because startup and gameplay load scenes, scripts and shaders dynamically.
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray()
include_filter="assets/production/ui/*,assets/vfx/third_party/*,installer/updater_bootstrap.ps1,installer/updater_v4.ps1"
exclude_filter="assets/staging/*,assets/source_packs/*,tests/*"
export_path="build/windows/ImPuls.exe"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/branding/impuls_icon.png"
application/console_wrapper_icon="res://assets/branding/impuls_icon.png"
application/icon_interpolation=4
application/file_version="0.10.7.0"
application/product_version="0.10.7.0"
application/company_name="Treninem"
application/product_name="ImPuls"
application/file_description="ImPuls PC offline survival RPG"
application/copyright="Copyright 2026 Treninem"
application/trademarks=""
