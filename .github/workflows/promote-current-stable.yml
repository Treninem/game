name: Promote Accepted ImPuls Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful Build ImPuls Release Candidate workflow run ID"
        required: true
        type: string
      candidate_sha:
        description: "Exact candidate commit SHA used by that run"
        required: true
        type: string
      installed_acceptance:
        description: "Type INSTALLED_ACCEPTED only after installed-package playability acceptance"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: impuls-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicit acceptance and exact candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INSTALLED_ACCEPTANCE: ${{ inputs.installed_acceptance }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INSTALLED_ACCEPTANCE" != "INSTALLED_ACCEPTED" ]]; then
            echo "::error title=Installed acceptance missing::Promotion requires the exact INSTALLED_ACCEPTED acknowledgement"
            exit 1
          fi
          META="$(gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID")"
          NAME="$(jq -r '.name' <<<"$META")"
          STATUS="$(jq -r '.status' <<<"$META")"
          CONCLUSION="$(jq -r '.conclusion' <<<"$META")"
          HEAD_SHA="$(jq -r '.head_sha' <<<"$META")"
          RUN_NUMBER="$(jq -r '.run_number' <<<"$META")"
          if [[ "$NAME" != "Build ImPuls Release Candidate" ]]; then
            echo "::error title=Wrong candidate workflow::Expected Build ImPuls Release Candidate, got $NAME"
            exit 1
          fi
          if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
            echo "::error title=Candidate run not accepted::Run $CANDIDATE_RUN_ID is $STATUS/$CONCLUSION"
            exit 1
          fi
          if [[ "$HEAD_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "::error title=Candidate SHA mismatch::Run used $HEAD_SHA but requested promotion of $CANDIDATE_SHA"
            exit 1
          fi
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate run $CANDIDATE_RUN_ID / build-$RUN_NUMBER / $HEAD_SHA accepted for exact-artifact promotion"

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          filter: blob:none
          sparse-checkout: |
            tools
            installer
            assets/branding

      - uses: actions/download-artifact@v4
        with:
          name: game-windows
          path: game
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: ImPuls-Setup
          path: installer-artifact
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact candidate artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          test -s game/ImPuls-PC-Windows-x64.zip
          test -s game/build/windows/ImPuls.exe
          test -s game/build/windows/ImPuls.pck
          test -s installer-artifact/ImPuls-Setup.exe

      - name: Capture previous stable build
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous/windows
          OLD_BUILD=""
          if gh release view stable --repo "${{ github.repository }}" >/dev/null 2>&1; then
            OLD_BUILD="$(gh release view stable --repo "${{ github.repository }}" --json name --jq .name)"
            if [[ "$OLD_BUILD" =~ ^build-[0-9]+$ ]]; then
              gh release download stable --repo "${{ github.repository }}" --pattern "ImPuls-PC-Windows-x64.zip" --dir previous || true
              if [[ -f previous/ImPuls-PC-Windows-x64.zip ]]; then
                unzip -q previous/ImPuls-PC-Windows-x64.zip -d previous/windows
              else
                OLD_BUILD=""
              fi
            else
              OLD_BUILD=""
            fi
          fi
          echo "old_build=$OLD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Prepare stable files from accepted candidate artifacts
        id: delta
        env:
          CANDIDATE_RUN_NUMBER: ${{ steps.candidate.outputs.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD="build-$CANDIDATE_RUN_NUMBER"
          OLD_BUILD="${{ steps.previous.outputs.old_build }}"
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/make_icon.py installer/impuls.ico
          cp game/ImPuls-PC-Windows-x64.zip .
          cp game/build/windows/ImPuls.exe ./ImPuls.exe
          cp game/build/windows/ImPuls.pck ./ImPuls.pck
          cp installer-artifact/ImPuls-Setup.exe ./ImPuls-Setup.exe

          mkdir -p updater-runtime
          cp installer/updater_bootstrap.ps1 installer/updater_v4.ps1 installer/repair_sync.ps1 installer/updater.ps1 installer/launcher.vbs installer/install_update_task.ps1 installer/refresh_shortcuts.ps1 installer/impuls.ico updater-runtime/
          (cd updater-runtime && zip -9 -r ../ImPuls-Updater-Runtime.zip .)

          FROM_BUILD="${OLD_BUILD:-bootstrap}"
          DELTA_NAME="ImPuls-Delta-${FROM_BUILD}-to-${BUILD}.zip"
          python3 tools/build_delta.py \
            --old-dir previous/windows \
            --new-dir game/build/windows \
            --from-build "$FROM_BUILD" \
            --to-build "$BUILD" \
            --output "$DELTA_NAME" \
            --manifest ImPuls-File-Manifest.json

          sha256sum ImPuls-PC-Windows-x64.zip ImPuls.exe ImPuls.pck ImPuls-Setup.exe ImPuls-Updater-Runtime.zip ImPuls-File-Manifest.json > SHA256SUMS.txt
          if [[ -n "$OLD_BUILD" ]]; then
            sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
            echo "delta_name=$DELTA_NAME" >> "$GITHUB_OUTPUT"
            echo "delta_sum=$DELTA_NAME.sha256" >> "$GITHUB_OUTPUT"
          else
            rm -f "$DELTA_NAME"
            echo "delta_name=" >> "$GITHUB_OUTPUT"
            echo "delta_sum=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish accepted artifacts to rolling stable
        env:
          GH_TOKEN: ${{ github.token }}
          DELTA_NAME: ${{ steps.delta.outputs.delta_name }}
          DELTA_SUM: ${{ steps.delta.outputs.delta_sum }}
          CANDIDATE_RUN_NUMBER: ${{ steps.candidate.outputs.run_number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.head_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD="build-$CANDIDATE_RUN_NUMBER"
          ASSETS=(ImPuls-PC-Windows-x64.zip ImPuls.exe ImPuls.pck ImPuls-Setup.exe ImPuls-Updater-Runtime.zip ImPuls-File-Manifest.json SHA256SUMS.txt)
          if [[ -n "$DELTA_NAME" && -f "$DELTA_NAME" ]]; then
            ASSETS+=("$DELTA_NAME" "$DELTA_SUM")
          fi
          NOTES="ImPuls stable channel. Promoted from accepted candidate run $CANDIDATE_RUN_ID at exact SHA $CANDIDATE_SHA after installed-package acceptance. Normal installed builds update through retained content-aware delta chains; missing core files are repaired individually from manifest data. The full archive is for first installation/manual recovery only."
          if gh release view stable --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload stable "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"
            gh release edit stable --title "$BUILD" --notes "$NOTES" --repo "${{ github.repository }}"
          else
            gh release create stable "${ASSETS[@]}" --title "$BUILD" --notes "$NOTES" --repo "${{ github.repository }}"
          fi
