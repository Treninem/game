name: Verify Rendered Household Doorway

on:
  push:
    branches: [codex/editor-handoff-validation-2026-10-24]
    paths:
      - tests/capture_streamed_home_door.gd
      - tests/visual_citizen_support.gd
      - scripts/humanoid_arm_clearance_modifier.gd
      - scripts/enterable_building.gd
      - scripts/box_surface_projection.gd
      - .github/workflows/validate-home-door-render.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impuls-home-door-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rendered-household:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            assets/audio
            assets/branding
            assets/production
            assets/registry
            assets/shaders
            assets/staging/nature/kenney_nature_kit
            assets/ui
            assets/vfx
            scenes
            scripts
            story
            tests
            tools/run_godot_smoke.sh
      - name: Install Godot and a software rendering display
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Parse actual project and rendered diagnostic
        run: timeout --signal=TERM --kill-after=15s 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Verify metric box geometry and retained texture objects
        run: env XDG_DATA_HOME="${RUNNER_TEMP}/impuls-metric-unit" bash tools/run_godot_smoke.sh tests/check_box_surface_projection.gd 30
      - name: Verify grounded citizen work and locomotion with actual GPU vertices
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="${RUNNER_TEMP}/impuls-citizen-support" GODOT_SMOKE_GRAPHICAL=1 bash tools/run_godot_smoke.sh tests/visual_citizen_support.gd 180
      - name: Render actual entry exit and full saved household lifecycle
        if: success() || failure()
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="${RUNNER_TEMP}/impuls-home-render" GODOT_SMOKE_GRAPHICAL=1 IMPULS_DOOR_HEIGHT_MODE=default bash tools/run_godot_smoke.sh tests/capture_streamed_home_door.gd 240
      - name: Upload actual rendered doorway and disk restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-home-door-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/impuls-home-render/godot/app_userdata/ImPuls/door-entry.png
            ${{ runner.temp }}/impuls-home-render/godot/app_userdata/ImPuls/door-exit.png
            ${{ runner.temp }}/impuls-home-render/godot/app_userdata/ImPuls/home-door-rendered.json
            ${{ runner.temp }}/impuls-home-render/godot/app_userdata/ImPuls/streamed-home-door.json
            ${{ runner.temp }}/impuls-citizen-support/godot/app_userdata/ImPuls/npc-support-*.png
            ${{ runner.temp }}/impuls-citizen-support/godot/app_userdata/ImPuls/npc-support-surfaces.json
