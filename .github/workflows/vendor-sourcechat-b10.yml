name: Vendor source-chat B10 real CC0 surface footsteps

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b10.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b10
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 surface footsteps
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b10/audio"
          TMP=".sourcechat_b10_tmp"
          rm -rf "$TMP"; mkdir -p "$ROOT" "$TMP"
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null

          meta() {
            local target="$1" key="$2" source="$3" author="$4" download="$5" notes="$6"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Author/source: $author
          Source page: $source
          Download used: $download
          License: CC0 1.0 Universal / public-domain dedication as stated on source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          Source page marks this staged asset as CC0/public domain.
          License: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          zip_audio() {
            local key="$1" url="$2" source="$3" author="$4" notes="$5"
            local target="$ROOT/$key" work="$TMP/$key"
            rm -rf "$target" "$work"; mkdir -p "$target" "$work/archive"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 -A 'ImPuls-CC0-SourceChat-B10/1.0' "$url" -o "$work/pack.zip"
            unzip -q "$work/pack.zip" -d "$work/archive"
            rsync -a --prune-empty-dirs --include='*/' --include='*.wav' --include='*.WAV' --include='*.ogg' --include='*.OGG' --include='*.mp3' --include='*.MP3' --include='*.flac' --include='*.FLAC' --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' --exclude='*' "$work/archive/" "$target/"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          seven_audio() {
            local key="$1" url="$2" source="$3" author="$4" notes="$5"
            local target="$ROOT/$key" work="$TMP/$key"
            rm -rf "$target" "$work"; mkdir -p "$target" "$work/archive"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 -A 'ImPuls-CC0-SourceChat-B10/1.0' "$url" -o "$work/pack.7z"
            7z x -y "$work/pack.7z" -o"$work/archive" >/dev/null
            rsync -a --prune-empty-dirs --include='*/' --include='*.wav' --include='*.WAV' --include='*.ogg' --include='*.OGG' --include='*.mp3' --include='*.MP3' --include='*.flac' --include='*.FLAC' --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' --exclude='*' "$work/archive/" "$target/"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          one() {
            local key="$1" filename="$2" url="$3" source="$4" author="$5" notes="$6"
            local target="$ROOT/$key"; mkdir -p "$target"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'ImPuls-CC0-SourceChat-B10/1.0' "$url" -o "$target/$filename"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          zip_audio "oga_different_steps_surfaces" \
            "https://opengameart.org/sites/default/files/%5Bkdd%5DDifferentSteps_0.zip" \
            "https://opengameart.org/content/different-steps-on-wood-stone-leaves-gravel-and-mud" \
            "TinyWorlds / OpenGameArt" \
            "Eight CC0 surface sounds for wood, stone, leaves, gravel, mud/dirt; useful as footsteps or building/contact sounds."

          seven_audio "oga_fantozzi_footsteps" \
            "https://opengameart.org/sites/default/files/Fantozzi-footsteps.7z" \
            "https://opengameart.org/content/fantozzis-footsteps-grasssand-stone" \
            "Fantozzi; submitted by qubodup / OpenGameArt" \
            "Twelve CC0 single-step samples with FLAC/OGG variants for grass/sand and hard/stone surfaces."

          one "oga_steps_wood_floor" "steps in wood floor.wav" \
            "https://opengameart.org/sites/default/files/steps%20in%20wood%20floor.wav" \
            "https://opengameart.org/content/steps-in-wood-floor" \
            "mikeask / OpenGameArt" \
            "CC0 recording of someone walking on a wooden floor."

          rm -rf "$TMP"
          cat > "assets/staging/sourcechat_b10/README.md" <<'EOF'
          # Source chat B10 — real CC0 surface footsteps

          Physically staged only; no game integration.
          Coverage: wood, stone/hard surface, leaves, gravel, mud/dirt, grass/sand, and a longer wooden-floor walking recording.
          Main chat should combine these with B04 snow and B03 mud/water assets, then classify by footwear/speed/surface.
          EOF
          find assets/staging/sourcechat_b10 -type f | wc -l
          du -sh assets/staging/sourcechat_b10

      - name: Commit only B10 staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b10
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(staging): vendor real CC0 surface footsteps B10"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
