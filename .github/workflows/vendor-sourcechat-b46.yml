name: Vendor source-chat B46 real CC0 fantasy props megakit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b46.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b46
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 Fantasy Props MegaKit Standard
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b46/models/quaternius_fantasy_props_megakit_standard"
          TMP=".sourcechat_b46_tmp"
          rm -rf "assets/staging/sourcechat_b46" "$TMP"
          mkdir -p "$ROOT" "$TMP/extracted"
          URL="https://opengameart.org/sites/default/files/fantasy_props_megakitstandard.zip"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1800 -A 'ImPuls-CC0-B46/1.0' "$URL" -o "$TMP/pack.zip"
          unzip -q "$TMP/pack.zip" -d "$TMP/extracted"
          chmod -R u+rwX "$TMP/extracted" || true
          rsync -a "$TMP/extracted/" "$ROOT/"
          chmod -R u+rwX "$ROOT" || true
          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
          cat > "$ROOT/SOURCE.md" <<'EOF'
          # Source
          Pack: Quaternius Fantasy Props MegaKit — Standard
          Source page: https://opengameart.org/content/fantasy-props-megakit
          Download: https://opengameart.org/sites/default/files/fantasy_props_megakitstandard.zip
          License: CC0 as stated on the source page.
          Standard edition: 94 models. Source page describes weapons, tools, vegetables, potions, market stalls, chests, furniture and related medieval/fantasy props, optimized around a small texture-set count.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
          cat > "$ROOT/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          cat > "assets/staging/sourcechat_b46/README.md" <<'EOF'
          # Source chat B46 — real CC0 Fantasy Props MegaKit Standard

          Source-only staging. Nothing in this batch is connected to gameplay.

          Main integration chat should deduplicate against B22/B29/B36/B38, normalize scale/material import, classify market/food/tool/furniture/weapon subsets, and promote only coherent production-ready groups.
          EOF
          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B46 files:"; find "assets/staging/sourcechat_b46" -type f | wc -l
          du -sh "assets/staging/sourcechat_b46"

      - name: Commit B46 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b46
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 fantasy props megakit B46"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
