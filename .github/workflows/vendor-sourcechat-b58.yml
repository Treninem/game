name: Vendor source-chat B58 real CC0 deer elephant ankylosaurus

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b58.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b58
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 deer elephant ankylosaurus
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b58"
          TMP=".sourcechat_b58_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          meta() {
            local name="$1" page="$2" title="$3" download="$4" notes="$5"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $download
          License: CC0 as stated on the source page.
          Notes: $notes
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          mkdir -p "$ROOT/models/oga_old_deer_male_animated"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B58/1.0' "https://opengameart.org/sites/default/files/deer1.blend" -o "$ROOT/models/oga_old_deer_male_animated/deer1.blend"
          meta "oga_old_deer_male_animated" "https://opengameart.org/content/old-deer-male" "Old Deer Male" "https://opengameart.org/sites/default/files/deer1.blend" "Rigged and animated male deer with diffuse texture and normal map packed into the Blend file; source page describes it as ready to use ingame."

          mkdir -p "$ROOT/models/oga_elephant_lowpoly_animated"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B58/1.0' "https://opengameart.org/sites/default/files/elephant-lowpoly.blend" -o "$ROOT/models/oga_elephant_lowpoly_animated/elephant-lowpoly.blend"
          meta "oga_elephant_lowpoly_animated" "https://opengameart.org/content/low-poly-elephant-model" "Low poly elephant model" "https://opengameart.org/sites/default/files/elephant-lowpoly.blend" "Rigged elephant with simple material colors and animations including eating, sitting, getting up, idle and angry."

          mkdir -p "$TMP/ank" "$ROOT/models/oga_anklyosaurus_static"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B58/1.0' "https://opengameart.org/sites/default/files/Anklyosaurus.zip" -o "$TMP/ank.zip"
          unzip -q "$TMP/ank.zip" -d "$TMP/ank"
          chmod -R u+rwX "$TMP/ank" || true
          rsync -a "$TMP/ank/" "$ROOT/models/oga_anklyosaurus_static/"
          meta "oga_anklyosaurus_static" "https://opengameart.org/content/anklyosaurus" "Anklyosaurus" "https://opengameart.org/sites/default/files/Anklyosaurus.zip" "Static/not-rigged dinosaur source. Page lists FBX, Blend, UV layout and quick texture; 911 verts / 1128 faces / 1812 tris."

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B58 — real CC0 male deer, elephant and Anklyosaurus

          Source-only staging. Nothing is connected to gameplay.

          Male deer and elephant are rigged/animated source candidates. Anklyosaurus is intentionally staged as a static source model and must be rigged/animated later if selected for production. Main integration chat should normalize scale/material import and compare male deer with the already staged female deer before promotion.
          EOF
          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B58 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B58 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b58
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 deer elephant ankylosaurus B58"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
