name: Vendor environment CC0 VFX staging

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-environment-vfx-staging.yml'

permissions:
  contents: write

concurrency:
  group: vendor-environment-vfx-staging
  cancel-in-progress: false

jobs:
  vendor-environment-vfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified CC0 environment VFX packs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/vfx_nonmagic"
          TMP=".environment_vfx_tmp"
          rm -rf "$TMP"
          mkdir -p "$ROOT" "$TMP"

          write_meta() {
            local target="$1"
            local key="$2"
            local source_url="$3"
            local author="$4"
            local download_url="$5"
            local notes="$6"
            mkdir -p "$target"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Author/source: $author
          Source page: $source_url
          Download used by staging workflow: $download_url
          License: CC0 1.0 Universal / public-domain dedication as stated by the source page.
          Status: SOURCE-ONLY STAGING — not gameplay-integrated by this workflow.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal

          This staged asset pack is recorded by its source page as CC0. The original author has waived copyright and related rights to the extent permitted by law under the Creative Commons CC0 1.0 Universal public-domain dedication.

          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          Preserve SOURCE.md beside the staged files.
          EOF
          }

          import_zip() {
            local key="$1"
            local url="$2"
            local source_url="$3"
            local author="$4"
            local notes="$5"
            local target="$ROOT/$key"
            local work="$TMP/$key"
            rm -rf "$target" "$work"
            mkdir -p "$target" "$work/archive"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
              -A 'ImPuls-CC0-Staging/1.0' "$url" -o "$work/pack.zip"
            unzip -q "$work/pack.zip" -d "$work/archive"
            rsync -a --prune-empty-dirs \
              --include='*/' \
              --include='*.png' --include='*.PNG' \
              --include='*.jpg' --include='*.JPG' \
              --include='*.jpeg' --include='*.JPEG' \
              --include='*.webp' --include='*.WEBP' \
              --include='*.gif' --include='*.GIF' \
              --include='*.txt' --include='*.TXT' \
              --include='*.md' --include='*.MD' \
              --exclude='*' "$work/archive/" "$target/"
            write_meta "$target" "$key" "$source_url" "$author" "$url" "$notes"
          }

          import_file() {
            local key="$1"
            local filename="$2"
            local url="$3"
            local source_url="$4"
            local author="$5"
            local notes="$6"
            local target="$ROOT/$key"
            rm -rf "$target"
            mkdir -p "$target"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
              -A 'ImPuls-CC0-Staging/1.0' "$url" -o "$target/$filename"
            write_meta "$target" "$key" "$source_url" "$author" "$url" "$notes"
          }

          import_zip "oga_burning_fire_40f" \
            "https://opengameart.org/sites/default/files/FIRE.zip" \
            "https://opengameart.org/content/fire-fx-burning-fire-animation" \
            "Mikodrak / OpenGameArt" \
            "40-frame transparent looping fire animation for campfires, fireplaces, torches, furnaces and burning-object impostors."

          import_zip "oga_fire_smoke_animations" \
            "https://opengameart.org/sites/default/files/rc_art_-_fire_smoke_animations.zip" \
            "https://opengameart.org/content/fire-smoke-animations" \
            "Reactorcore / OpenGameArt" \
            "Multiple CC0 fire, flame and smoke animation variants with transparent PNG sheets and individual frames."

          import_file "oga_fog_animation" "fog.png" \
            "https://opengameart.org/sites/default/files/fog_1.png" \
            "https://opengameart.org/content/fog-animation" \
            "AntumDeluge / OpenGameArt" \
            "Tileable 640x480 CC0 fog/cloud texture; source page demonstrates a scrolling animated fog sequence."

          import_file "oga_thick_fog" "fog01.png" \
            "https://opengameart.org/sites/default/files/fog01.png" \
            "https://opengameart.org/content/thick-fog" \
            "LFA / OpenGameArt" \
            "1024x512 horizontally tileable CC0 fog/smoke texture for rolling fog banks, haze and distant smoke."

          rm -rf "$TMP"

      - name: Commit staged assets back to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/vfx_nonmagic/oga_burning_fire_40f \
                  assets/staging/vfx_nonmagic/oga_fire_smoke_animations \
                  assets/staging/vfx_nonmagic/oga_fog_animation \
                  assets/staging/vfx_nonmagic/oga_thick_fog
          if git diff --cached --quiet; then
            echo "No staging changes to commit."
            exit 0
          fi
          git commit -m "assets(staging): add CC0 fire smoke and fog packs"
          git pull --rebase origin main
          git push origin HEAD:main
