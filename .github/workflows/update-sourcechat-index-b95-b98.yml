name: Update source-chat staging index through B98

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-sourcechat-index-b95-b98.yml'

permissions:
  contents: write

concurrency:
  group: update-sourcechat-index-b95-b98
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify B95-B98 physical directories and append index
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/staging/sourcechat_b95/models/oga_chainlink_fence_modular_60
            assets/staging/sourcechat_b95/models/oga_unfinished_buildings_206plus10
            assets/staging/sourcechat_b95/models/oga_lamppost_bench_trashcan
            assets/staging/sourcechat_b96/models/oga_toilets_33
            assets/staging/sourcechat_b96/models/oga_balloons_53_godot
            assets/staging/sourcechat_b96/models/oga_room_filler_objects_30
            assets/staging/sourcechat_b96/models/oga_halloween_props_128
            assets/staging/sourcechat_b97/models/oga_canyon_terrain_161
            assets/staging/sourcechat_b97/models/oga_foliage_1
            assets/staging/sourcechat_b98/models/oga_six_houses_textures
          )
          for d in "${required[@]}"; do
            test -d "$d" || { echo "Missing physical staging directory: $d" >&2; exit 1; }
            test -n "$(find "$d" -type f -print -quit)" || { echo "Empty staging directory: $d" >&2; exit 1; }
          done
          INDEX=assets/staging/SOURCECHAT_INDEX.md
          if ! grep -q '^## B95 —' "$INDEX"; then
            printf '\n' >> "$INDEX"
            echo '' | base64 -d >> "$INDEX"
          fi

      - name: Commit index update with retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/SOURCECHAT_INDEX.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(staging): index physical source batches B95-B98"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
