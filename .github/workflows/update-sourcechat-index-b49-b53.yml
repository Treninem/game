name: Update source-chat staging index through B53

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-sourcechat-index-b49-b53.yml'

permissions:
  contents: write

concurrency:
  group: sourcechat-index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify B49-B53 physical directories and append index
        shell: bash
        run: |
          set -euo pipefail
          INDEX="assets/staging/SOURCECHAT_INDEX.md"
          required=(
            assets/staging/sourcechat_b49/models/oga_medieval_crafting_stations
            assets/staging/sourcechat_b49/models/oga_medieval_survival_props
            assets/staging/sourcechat_b49/models/oga_medieval_tents
            assets/staging/sourcechat_b50/models/oga_medieval_blacksmith_interior
            assets/staging/sourcechat_b50/models/oga_medieval_candles
            assets/staging/sourcechat_b50/models/oga_medieval_church_interior
            assets/staging/sourcechat_b50/models/oga_medieval_signs
            assets/staging/sourcechat_b51/models/oga_cemetery_gravestones
            assets/staging/sourcechat_b51/models/oga_medieval_benches
            assets/staging/sourcechat_b51/models/oga_medieval_boat
            assets/staging/sourcechat_b51/models/oga_medieval_cage
            assets/staging/sourcechat_b51/models/oga_open_books
            assets/staging/sourcechat_b52/models/oga_medieval_doors_interiors
            assets/staging/sourcechat_b52/models/oga_medieval_medium_house_interior
            assets/staging/sourcechat_b52/models/oga_medieval_shack
            assets/staging/sourcechat_b52/models/oga_medieval_small_house_interior
            assets/staging/sourcechat_b52/models/oga_medieval_windows_interiors
            assets/staging/sourcechat_b53/models/oga_crystal_mine
            assets/staging/sourcechat_b53/models/oga_inventory_items_60plus
            assets/staging/sourcechat_b53/models/oga_magic_staff_set
          )
          for p in "${required[@]}"; do
            test -d "$p" || { echo "Missing physical staging directory: $p"; exit 1; }
          done
          test -f "$INDEX"
          if grep -q '^## B49 —' "$INDEX"; then
            echo "B49 already indexed; nothing to append."
            exit 0
          fi
          cat >> "$INDEX" <<'EOF'

          ## B49 — tents / crafting stations / survival props

          Status: **READY / PHYSICAL**
          Path: `assets/staging/sourcechat_b49/models/`

          - `oga_medieval_tents/`
          - `oga_medieval_crafting_stations/`
          - `oga_medieval_survival_props/`

          Recommended use: camps, crafting areas and temporary/rural settlements after material, pivot, collision and scale review.

          ## B50 — church / blacksmith interiors / candles / signs

          Status: **READY / PHYSICAL**
          Path: `assets/staging/sourcechat_b50/models/`

          - `oga_medieval_church_interior/`
          - `oga_medieval_blacksmith_interior/`
          - `oga_medieval_candles/`
          - `oga_medieval_signs/`

          Recommended use: authored enterable church/temple and blacksmith interiors plus selective interior/street detail props. Compare building shells with B47/B52 before promotion.

          ## B51 — medieval detail props

          Status: **READY / PHYSICAL**
          Path: `assets/staging/sourcechat_b51/models/`

          - `oga_medieval_benches/`
          - `oga_medieval_cage/`
          - `oga_medieval_boat/`
          - `oga_cemetery_gravestones/`
          - `oga_open_books/`

          Recommended use: squares/churches, quest/prison dressing, shore props, cemetery locations and libraries/interiors after scale/material/collision review.

          ## B52 — modular explorable house interiors

          Status: **READY / PHYSICAL**
          Path: `assets/staging/sourcechat_b52/models/`

          - `oga_medieval_doors_interiors/`
          - `oga_medieval_windows_interiors/`
          - `oga_medieval_small_house_interior/`
          - `oga_medieval_medium_house_interior/`
          - `oga_medieval_shack/`

          Recommended use: genuinely enterable homes and reusable double-sided doors/windows. Establish one production building grid/scale with B47 rather than mixing incompatible modules blindly.

          ## B53 — inventory / mine / magic staff sources

          Status: **READY / PHYSICAL**
          Path: `assets/staging/sourcechat_b53/models/`

          - `oga_inventory_items_60plus/` — broad food/tool/weapon/crafting/quest/resource inventory source library.
          - `oga_crystal_mine/` — authored crystal-mine source.
          - `oga_magic_staff_set/` — elemental staff source family.

          Recommended use: classify and deduplicate inventory meshes against B36/B38/B46; promote only the strongest production candidates. Treat mine/staff assets as separate location/equipment sources.
          EOF

      - name: Commit index update with retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/SOURCECHAT_INDEX.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(staging): index verified physical batches B49-B53"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
