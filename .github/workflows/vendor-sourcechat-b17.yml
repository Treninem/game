name: Vendor source-chat B17 real CC0 forest ambience

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b17.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b17
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 forest ambience sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b17/audio"
          TMP=".sourcechat_b17_tmp"
          rm -rf "$TMP"; mkdir -p "$ROOT" "$TMP"
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null

          meta() {
            local target="$1" key="$2" source="$3" author="$4" download="$5" notes="$6"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Author/source: $author
          Source page: $source
          Download used: $download
          License: CC0 1.0 Universal / public-domain dedication as stated on source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          Source page marks this staged asset as CC0/public domain.
          License: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          one() {
            local key="$1" filename="$2" url="$3" source="$4" author="$5" notes="$6"
            local target="$ROOT/$key"; mkdir -p "$target"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'ImPuls-CC0-SourceChat-B17/1.0' "$url" -o "$target/$filename"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          seven_audio() {
            local key="$1" url="$2" source="$3" author="$4" notes="$5"
            local target="$ROOT/$key" work="$TMP/$key"
            rm -rf "$target" "$work"; mkdir -p "$target" "$work/archive"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 -A 'ImPuls-CC0-SourceChat-B17/1.0' "$url" -o "$work/pack.7z"
            7z x -y "$work/pack.7z" -o"$work/archive" >/dev/null
            rsync -a --prune-empty-dirs --include='*/' --include='*.wav' --include='*.WAV' --include='*.ogg' --include='*.OGG' --include='*.mp3' --include='*.MP3' --include='*.flac' --include='*.FLAC' --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' --exclude='*' "$work/archive/" "$target/"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          one "oga_forest_ambience_tinyworlds" "Forest_Ambience.mp3" \
            "https://opengameart.org/sites/default/files/Forest_Ambience.mp3" \
            "https://opengameart.org/content/forest-ambience" \
            "TinyWorlds / OpenGameArt" \
            "Seamlessly looping CC0 forest/woods ambience created for The Woods. Useful as a calm background layer; main chat should decide whether its musical tone fits each biome."

          seven_audio "oga_forest_birds_pauliuw" \
            "https://opengameart.org/sites/default/files/forest_birds.7z" \
            "https://opengameart.org/content/forest-bird-sounds" \
            "pauliuw / OpenGameArt" \
            "Ten CC0 forest bird sounds including raw recorded files. Source comments note background noise, so main chat should clean/select the best takes before production use."

          rm -rf "$TMP"
          cat > "assets/staging/sourcechat_b17/README.md" <<'EOF'
          # Source chat B17 — real CC0 forest ambience

          Physically staged source files only; no runtime integration.
          Includes a seamless forest ambience loop and ten forest-bird source recordings.
          Main integration chat should combine selectively with B06 birds/swamp/crickets and B15 wind/rain, cleaning noisy bird takes where useful.
          EOF
          find assets/staging/sourcechat_b17 -type f | wc -l
          du -sh assets/staging/sourcechat_b17

      - name: Commit only B17 staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b17
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(staging): vendor real CC0 forest ambience B17"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
