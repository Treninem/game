name: Apply TZ Runtime Patches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-tz-runtime-patches.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 10
      - name: Connect interactive minigames
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/gameplay_panels.gd')
          s = p.read_text(encoding='utf-8')
          old = '''func _play_minigame(minigame_id: String, target: int) -> void:\n    var state := ProgressionSystem.snapshot()\n    var seed := int(state.get("xp", 0)) + int(state.get("tasks_completed", 0)) * 97 + int(Time.get_ticks_msec() / 250)\n    var score := maxi(1, target - 180 + posmod(seed, 361))\n    var result := ProgressionSystem.finish_minigame(minigame_id, score)\n    GameState.notify("Результат: %d очков • награда %d монет." % [score, int(result.get("reward", 0))])\n    _rebuild_content()\n'''
          new = '''func _play_minigame(minigame_id: String, _target: int) -> void:\n    var runtime := get_tree().get_first_node_in_group("minigame_runtime")\n    if runtime == null or not runtime.has_method("start_minigame"):\n        GameState.notify("Испытание временно недоступно.")\n        return\n    close_panel()\n    if not bool(runtime.call("start_minigame", minigame_id)):\n        GameState.notify("Сейчас нельзя начать это испытание.")\n'''
          if old not in s:
              raise SystemExit('minigame callback changed; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit integration fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gameplay_panels.gd
          git diff --cached --check
          git commit -m "feat: route minigames through interactive runtime [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
