name: Vendor source-chat B49 real CC0 tents crafting survival

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b49.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b49
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 tents crafting survival sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b49"
          TMP=".sourcechat_b49_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          stage_file() {
            local name="$1" url="$2" page="$3" title="$4" filename="$5" notes="$6"
            mkdir -p "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B49/1.0' "$url" -o "$ROOT/models/$name/$filename"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on the source page.
          Notes: $notes
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_file "oga_medieval_tents" "https://opengameart.org/sites/default/files/medievaltents.blend" "https://opengameart.org/content/medieval-tents" "Medieval Tents" "medievaltents.blend" "AnyRPG tent source; source page lists 2966 verts / 5572 tris."
          stage_file "oga_medieval_survival_props" "https://opengameart.org/sites/default/files/medievalsurvivalprops.blend" "https://opengameart.org/content/medieval-survival-props" "Medieval Survival Props" "medievalsurvivalprops.blend" "Rough wood cabin/shack/hut/log structures; source page lists 6982 verts / 12922 tris."

          mkdir -p "$TMP/crafting" "$ROOT/models/oga_medieval_crafting_stations"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B49/1.0' "https://opengameart.org/sites/default/files/medieval_crafting_stations_pack.7z" -o "$TMP/crafting.7z"
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          7z x -y -o"$TMP/crafting" "$TMP/crafting.7z" >/dev/null
          chmod -R u+rwX "$TMP/crafting" || true
          rsync -a "$TMP/crafting/" "$ROOT/models/oga_medieval_crafting_stations/"
          cat > "$ROOT/models/oga_medieval_crafting_stations/SOURCE.md" <<'EOF'
          # Source
          Pack: Medieval Crafting Stations Pack
          Source page: https://opengameart.org/content/medieval-crafting-stations-pack
          Download: https://opengameart.org/sites/default/files/medieval_crafting_stations_pack.7z
          License: CC0 as stated on the source page.
          Notes: Three crafting stations in one Blend source; source page lists 278-1548 tris and 512x512 PNG textures.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
          cat > "$ROOT/models/oga_medieval_crafting_stations/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B49 — real CC0 tents, crafting stations and survival props

          Source-only staging. Nothing is connected to gameplay.

          Main integration chat should use these as camp/crafting/temporary-settlement sources, inspect materials and pivots, add collision/LOD only for selected production objects, and deduplicate against broader medieval prop packs.
          EOF
          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B49 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B49 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b49
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 tents crafting survival B49"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
