name: Validate Delta Updater

on:
  push:
    branches: [main]
    paths:
      - "installer/updater_bootstrap.ps1"
      - "installer/updater_v4.ps1"
      - "installer/repair_sync.ps1"
      - "installer/updater.ps1"
      - "tools/build_delta.py"
      - "tools/verify_delta_roundtrip.py"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/validate-updater.yml"
  pull_request:
    paths:
      - "installer/updater_bootstrap.ps1"
      - "installer/updater_v4.ps1"
      - "installer/repair_sync.ps1"
      - "installer/updater.ps1"
      - "tools/build_delta.py"
      - "tools/verify_delta_roundtrip.py"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/validate-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delta-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
      - name: Build and reconstruct synthetic content delta
        run: python3 tools/verify_delta_roundtrip.py


  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            installer
      - name: Parse updater runtimes as explicit UTF-8
        shell: powershell
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          foreach ($file in @("installer/updater_bootstrap.ps1", "installer/updater_v4.ps1", "installer/repair_sync.ps1", "installer/updater.ps1")) {
            $tokens = $null
            $errors = $null
            $source = [System.IO.File]::ReadAllText((Resolve-Path $file), $utf8)
            [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              exit 1
            }
            Write-Host "$file syntax OK"
          }
      - name: Prove localized delta bootstrap and file repair policy
        shell: powershell
        run: |
          $bootstrap = Get-Content installer/updater_bootstrap.ps1 -Raw
          if ($bootstrap -notmatch 'ReadAllText' -or $bootstrap -notmatch 'UTF8Encoding' -or $bootstrap -notmatch 'updater_v4.ps1') {
            throw "Bootstrap does not enforce UTF-8 implementation loading"
          }
          $impl = [System.IO.File]::ReadAllText((Resolve-Path "installer/updater_v4.ps1"), (New-Object System.Text.UTF8Encoding($false)))
          foreach ($marker in @('Initialize-ProgressUi','Set-ProgressUi','Download-File','Get-DeltaChain','Apply-Delta','Verify-Manifest','RangeHeaderValue','InfiniteTimeSpan','update-cache','.part')) {
            if ($impl -notmatch [regex]::Escape($marker)) { throw "Missing updater marker: $marker" }
          }
          if ($impl -match 'ImPuls-PC-Windows-x64\.zip.*Download-File' -or $impl -match 'ImPuls-Setup\.exe.*Download-File') {
            throw "Delta updater contains forbidden full-package/installer fallback"
          }

          $repair = [System.IO.File]::ReadAllText((Resolve-Path "installer/repair_sync.ps1"), (New-Object System.Text.UTF8Encoding($false)))
          foreach ($marker in @('ImPuls-File-Manifest.json','ImPuls.exe','ImPuls.pck','File-Matches','Verify-Hash','Download-File','RangeHeaderValue','InfiniteTimeSpan','repair-cache','.part','Game did not exit before timeout')) {
            if ($repair -notmatch [regex]::Escape($marker)) { throw "Missing repair marker: $marker" }
          }
          if ($repair -match 'ImPuls-PC-Windows-x64\.zip') { throw "Repair runtime must not download the full game archive" }

          $router = Get-Content installer/updater.ps1 -Raw
          foreach ($marker in @('repair_sync.ps1','updater_bootstrap.ps1','ImPuls.exe','ImPuls.pck')) {
            if ($router -notmatch [regex]::Escape($marker)) { throw "Updater router missing marker: $marker" }
          }
          $hasNonAscii = $false
          foreach ($ch in $impl.ToCharArray()) {
            if ([int]$ch -gt 127) { $hasNonAscii = $true; break }
          }
          if (-not $hasNonAscii) { throw "Localized updater text is missing" }
          Write-Host "Delta + individual file repair policy proof OK"
