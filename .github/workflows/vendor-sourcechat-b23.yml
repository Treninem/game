name: Vendor source-chat B23 real CC0 cave pack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b23.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b23
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 3TD Cave Pack Pro
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b23/models/oga_3td_cave_pack_pro"
          TMP=".sourcechat_b23_tmp"
          rm -rf "assets/staging/sourcechat_b23" "$TMP"
          mkdir -p "$ROOT" "$TMP/extract"
          URL="https://opengameart.org/sites/default/files/CAVE_PACK_PRO%20v.1.0.zip"
          PAGE="https://opengameart.org/content/3td-cave-pack-pro-v10"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-SourceChat-B23/1.0' "$URL" -o "$TMP/cave.zip"
          unzip -q "$TMP/cave.zip" -d "$TMP/extract"
          rsync -a "$TMP/extract/" "$ROOT/"
          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
          cat > "$ROOT/SOURCE.md" <<EOF
          # Source
          Pack: 3TD Cave Pack Pro v1.0
          Author: Ron Kapaun / 3TD Studios, OpenGameArt mirror
          Source page: $PAGE
          Download: $URL
          License: CC0 1.0 / Public Domain as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.

          Source page contents: two main cave chambers, Y and T junctions, elbow section, 22 rock/cliff/boulder/stalagmite/stalactite objects, four cave plants and bonus material, with textures.
          EOF
          cat > "$ROOT/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          Source page explicitly marks this pack CC0 / Public Domain.
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          cat > "assets/staging/sourcechat_b23/README.md" <<'EOF'
          # Source chat B23 — real CC0 cave environment source pack

          The full 3TD Cave Pack Pro v1.0 has been downloaded and extracted as source assets only.
          Main chat should inspect scale, topology, textures and collision strategy, then promote selected cave modules/rocks/plants to production paths.
          EOF
          rm -rf "$TMP"
          echo "B23 files:"; find assets/staging/sourcechat_b23 -type f | wc -l
          du -sh assets/staging/sourcechat_b23

      - name: Commit B23 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b23
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 cave pack B23"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
