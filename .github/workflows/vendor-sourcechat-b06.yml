name: Vendor source-chat B06 real CC0 biome ambience

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b06.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b06
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 biome ambience sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b06/audio"
          TMP=".sourcechat_b06_tmp"
          rm -rf "$TMP"; mkdir -p "$ROOT" "$TMP"

          meta() {
            local target="$1" key="$2" source="$3" author="$4" download="$5" notes="$6"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Author/source: $author
          Source page: $source
          Download used: $download
          License: CC0 1.0 Universal / public-domain dedication as stated on source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          Source page marks this staged asset as CC0/public domain.
          License: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          one() {
            local key="$1" filename="$2" url="$3" source="$4" author="$5" notes="$6"
            local target="$ROOT/$key"; mkdir -p "$target"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
              -A 'ImPuls-CC0-SourceChat-B06/1.0' "$url" -o "$target/$filename"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          zip_audio() {
            local key="$1" url="$2" source="$3" author="$4" notes="$5"
            local target="$ROOT/$key" work="$TMP/$key"
            rm -rf "$target" "$work"; mkdir -p "$target" "$work/archive"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
              -A 'ImPuls-CC0-SourceChat-B06/1.0' "$url" -o "$work/pack.zip"
            unzip -q "$work/pack.zip" -d "$work/archive"
            rsync -a --prune-empty-dirs --include='*/' \
              --include='*.wav' --include='*.WAV' --include='*.ogg' --include='*.OGG' \
              --include='*.mp3' --include='*.MP3' --include='*.flac' --include='*.FLAC' \
              --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' \
              --exclude='*' "$work/archive/" "$target/"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          one "oga_ambient_birds" "birds-isaiah658.ogg" \
            "https://opengameart.org/sites/default/files/birds-isaiah658.ogg" \
            "https://opengameart.org/content/ambient-bird-sounds" \
            "isaiah658 / OpenGameArt" \
            "CC0 outdoor bird ambience; source author recorded and cleaned the audio."

          zip_audio "oga_swamp_environment" \
            "https://opengameart.org/sites/default/files/swamp_sounds.zip" \
            "https://opengameart.org/content/swamp-environment-audio" \
            "LokiF / OpenGameArt" \
            "CC0 swamp/marsh ambience source with insects, bubbling/gurgling and atmosphere layers."

          one "oga_night_crickets" "crickets.mp3" \
            "https://opengameart.org/sites/default/files/crickets.mp3" \
            "https://opengameart.org/content/crickets-ambient-noise-loopable" \
            "Wolfgang_ / OpenGameArt" \
            "CC0 11-second loopable night cricket ambience."

          OCEAN_SOURCE="https://opengameart.org/content/beach-ocean-waves"
          OCEAN_AUTHOR="jasinski; submitted/extracted by qubodup / OpenGameArt"
          for n in 01 02 03 04; do
            case "$n" in
              01) file="wave_01_cc0-18363__jasinski__alkaibeach.flac" ;;
              02) file="wave_02_cc0-18363__jasinski__alkaibeach.flac" ;;
              03) file="wave_03_cc0-18363__jasinski__alkaibeach.flac" ;;
              04) file="wave_04_cc0-18363__jasinski__alkaibeach.flac" ;;
            esac
            one "oga_beach_ocean_waves" "$file" \
              "https://opengameart.org/sites/default/files/$file" \
              "$OCEAN_SOURCE" "$OCEAN_AUTHOR" \
              "One of four CC0 extracted beach/ocean wave recordings for coast and sea ambience."
          done

          rm -rf "$TMP"
          cat > "assets/staging/sourcechat_b06/README.md" <<'EOF'
          # Source chat B06 — real CC0 biome ambience

          Physically staged source audio only; no runtime integration.
          Coverage: birds, swamp/marsh, loopable night crickets, and four ocean/beach wave recordings.
          Main chat should normalize/layer/cull and promote selected files to production audio paths.
          EOF
          find assets/staging/sourcechat_b06 -type f | wc -l
          du -sh assets/staging/sourcechat_b06

      - name: Commit only B06 staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b06
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(staging): vendor real CC0 biome ambience B06"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
