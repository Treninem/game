name: Vendor coherent CC0 city interiors factory staging

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-city-interiors-factory-staging.yml'

permissions:
  contents: write

concurrency:
  group: vendor-city-interiors-factory-staging
  cancel-in-progress: false

jobs:
  vendor-city-interiors-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging areas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows
            assets/staging/city
            assets/staging/interiors
          sparse-checkout-cone-mode: true

      - name: Download verified CC0 source packs
        shell: bash
        run: |
          set -u
          TMP=".city_interiors_factory_tmp"
          FAILS="$TMP/FAILED.txt"
          rm -rf "$TMP"
          mkdir -p "$TMP" assets/staging/city assets/staging/interiors
          : > "$FAILS"

          write_meta() {
            local target="$1" key="$2" source="$3" download="$4" notes="$5" format="$6"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Source page: $source
          Download used: $download
          License: CC0 1.0 Universal as stated by the source page.
          Status: SOURCE-ONLY STAGING — not gameplay-integrated by this workflow.
          Canonical staged format: $format.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          Preserve SOURCE.md with staged files.
          EOF
          }

          import_zip_canonical() {
            local key="$1" url="$2" source="$3" target="$4" notes="$5"
            local work="$TMP/$key"
            rm -rf "$target" "$work"
            mkdir -p "$target" "$work/archive"
            if ! curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-Staging/1.0' "$url" -o "$work/pack.zip"; then
              echo "$key | download failed | $url" >> "$FAILS"
              rm -rf "$target" "$work"
              return 0
            fi
            if ! unzip -q "$work/pack.zip" -d "$work/archive"; then
              echo "$key | unzip failed | $url" >> "$FAILS"
              rm -rf "$target" "$work"
              return 0
            fi

            local format=""
            if find "$work/archive" -type f \( -iname '*.glb' -o -iname '*.gltf' \) -print -quit | grep -q .; then
              format="glTF/GLB"
              rsync -a --prune-empty-dirs \
                --include='*/' \
                --include='*.glb' --include='*.GLB' --include='*.gltf' --include='*.GLTF' --include='*.bin' --include='*.BIN' \
                --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' \
                --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' --include='*.json' --include='*.JSON' \
                --exclude='*' "$work/archive/" "$target/"
            elif find "$work/archive" -type f -iname '*.fbx' -print -quit | grep -q .; then
              format="FBX"
              rsync -a --prune-empty-dirs \
                --include='*/' \
                --include='*.fbx' --include='*.FBX' \
                --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' \
                --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' --include='*.json' --include='*.JSON' \
                --exclude='*' "$work/archive/" "$target/"
            elif find "$work/archive" -type f -iname '*.obj' -print -quit | grep -q .; then
              format="OBJ"
              rsync -a --prune-empty-dirs \
                --include='*/' \
                --include='*.obj' --include='*.OBJ' --include='*.mtl' --include='*.MTL' \
                --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' \
                --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' --include='*.json' --include='*.JSON' \
                --exclude='*' "$work/archive/" "$target/"
            else
              echo "$key | archive had no supported 3D files | $url" >> "$FAILS"
              rm -rf "$target"
              return 0
            fi
            write_meta "$target" "$key" "$source" "$url" "$notes" "$format"
          }

          import_zip_canonical "kenney_city_kit_industrial" \
            "https://kenney.nl/media/pages/assets/city-kit-industrial/5fcb837741-1750838303/kenney_city-kit-industrial_1.0.zip" \
            "https://kenney.nl/assets/city-kit-industrial" \
            "assets/staging/city/kenney_city_kit_industrial" \
            "25-piece industrial city set for factories, warehouses and industrial districts."

          import_zip_canonical "kenney_city_kit_commercial" \
            "https://kenney.nl/media/pages/assets/city-kit-commercial/a742d900eb-1753115042/kenney_city-kit-commercial_2.1.zip" \
            "https://kenney.nl/assets/city-kit-commercial" \
            "assets/staging/city/kenney_city_kit_commercial" \
            "50-piece commercial city set for downtown and skyscraper districts."

          import_zip_canonical "kenney_city_kit_suburban" \
            "https://kenney.nl/media/pages/assets/city-kit-suburban/2c871b7af2-1745479373/kenney_city-kit-suburban_20.zip" \
            "https://kenney.nl/assets/city-kit-suburban" \
            "assets/staging/city/kenney_city_kit_suburban" \
            "40-piece suburban city set for residential districts."

          import_zip_canonical "kenney_city_kit_roads" \
            "https://www.kenney.nl/media/pages/assets/city-kit-roads/74288c9459-1741864740/kenney_city-kit-roads.zip" \
            "https://www.kenney.nl/assets/city-kit-roads" \
            "assets/staging/city/kenney_city_kit_roads" \
            "70-piece road set for coherent streets, intersections and city layout."

          import_zip_canonical "kenney_modular_buildings" \
            "https://www.kenney.nl/media/pages/assets/modular-buildings/3253b4219a-1707397411/kenney_modular-buildings.zip" \
            "https://www.kenney.nl/assets/modular-buildings" \
            "assets/staging/city/kenney_modular_buildings" \
            "100 modular building pieces for custom enterable building shells and varied blocks."

          import_zip_canonical "kenney_factory_kit" \
            "https://www.kenney.nl/media/pages/assets/factory-kit/edaac9d4f6-1777639602/kenney_factory-kit_3.0.zip" \
            "https://www.kenney.nl/assets/factory-kit" \
            "assets/staging/interiors/kenney_factory_kit" \
            "140 industrial factory/warehouse models including animated and variant pieces."

          import_zip_canonical "quaternius_house_interior_120plus" \
            "https://opengameart.org/sites/default/files/ultimate_house_interior_pack_-_june_2020.zip" \
            "https://opengameart.org/content/lowpoly-house-interior-pack" \
            "assets/staging/interiors/quaternius_house_interior_120plus" \
            "120+ interior models spanning doors, windows, kitchen, bathroom, furniture, lamps and plants."

          import_zip_canonical "quaternius_furniture_pack" \
            "https://opengameart.org/sites/default/files/Furniture%20Pack%20by%20%40Quaternius.zip" \
            "https://opengameart.org/content/furniture-low-poly" \
            "assets/staging/interiors/quaternius_furniture_pack" \
            "Additional CC0 furniture variants including tables, chairs, sofas and lamps."

          cp "$FAILS" assets/staging/city/CITY_INTERIORS_DOWNLOAD_FAILURES.txt
          cat > assets/staging/city/CITY_STAGING_MANIFEST.md <<'EOF'
          # Coherent city source-only staging

          Complete compatible CC0 city kits are staged here for the main integration chat: industrial, commercial, suburban, roads and modular building pieces. Only one canonical 3D format per pack is retained to limit repository growth.
          EOF
          cat > assets/staging/interiors/INTERIORS_STAGING_MANIFEST.md <<'EOF'
          # Interior and factory source-only staging

          CC0 house interiors, furniture and factory/warehouse props are staged here. No gameplay scenes, scripts or project settings are modified.
          EOF
          rm -rf "$TMP"

      - name: Commit with concurrent-push retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/city assets/staging/interiors
          if git diff --cached --quiet; then
            echo "No staging changes to commit."
            exit 0
          fi
          git commit -m "assets(staging): add coherent CC0 city interiors and factory packs"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push after retries" >&2
          exit 1
