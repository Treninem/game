name: Diagnose Household Rendering Cost
on:
  push:
    branches: [codex/editor-handoff-validation-2026-10-24]
    paths:
      - tests/profile_house_render_cost.gd
      - scripts/capital_square_life.gd
      - scripts/wall_lantern_light.gd
      - scripts/enterable_building.gd
      - scripts/house_living_details.gd
      - tests/visual_wall_lighting.gd
      - .github/workflows/verify-house-render-cost.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: impuls-house-cost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  house-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            assets/audio
            assets/branding
            assets/production
            assets/registry
            assets/shaders
            assets/staging/nature/kenney_nature_kit
            assets/ui
            assets/vfx
            scenes
            scripts
            story
            tests
            tools/run_godot_smoke.sh
      - name: Install Godot and a software rendering display
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Parse actual project and rendered diagnostic
        run: timeout --signal=TERM --kill-after=15s 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Measure reversible diagnostic ablations without changing production settings
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="${RUNNER_TEMP}/impuls-house-cost" GODOT_SMOKE_GRAPHICAL=1 bash tools/run_godot_smoke.sh tests/profile_house_render_cost.gd 180
      - name: Verify live shadow quality switching
        run: env XDG_DATA_HOME="${RUNNER_TEMP}/impuls-house-quality" bash tools/run_godot_smoke.sh tests/smoke_household_quality.tscn 90
      - name: Render furnished rooms with a grounded player and all cloth quality modes
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="${RUNNER_TEMP}/impuls-house-rooms" GODOT_SMOKE_GRAPHICAL=1 bash tools/run_godot_smoke.sh tests/visual_wall_lighting.gd 180
      - name: Render the unchanged full household lifecycle
        if: success() || failure()
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="${RUNNER_TEMP}/impuls-house-complete" GODOT_SMOKE_GRAPHICAL=1 bash tools/run_godot_smoke.sh tests/profile_continuous_home_door.gd 240
      - name: Upload measured and acceptance evidence separately including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-render-cost-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/impuls-house-cost/godot/app_userdata/ImPuls/home-cost-*.png
            ${{ runner.temp }}/impuls-house-cost/godot/app_userdata/ImPuls/home-cost-profile.json
            ${{ runner.temp }}/impuls-house-complete/godot/app_userdata/ImPuls/household-render-profile.json
            ${{ runner.temp }}/impuls-house-complete/godot/app_userdata/ImPuls/door-*.png
            ${{ runner.temp }}/impuls-house-complete/godot/app_userdata/ImPuls/home-door-rendered.json
            ${{ runner.temp }}/impuls-house-complete/godot/app_userdata/ImPuls/streamed-home-door.json
            ${{ runner.temp }}/impuls-house-rooms/godot/app_userdata/ImPuls/wall-light-*.png
            ${{ runner.temp }}/impuls-house-rooms/godot/app_userdata/ImPuls/wall-light-rooms.json
