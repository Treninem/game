name: Vendor source-chat B40 real CC0 pigeon chicken rooster

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b40.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b40
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 bird models
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b40/models"
          TMP=".sourcechat_b40_tmp"
          rm -rf "assets/staging/sourcechat_b40" "$TMP"
          mkdir -p "$ROOT" "$TMP"

          stage_zip() {
            local name="$1" url="$2" page="$3" title="$4"
            mkdir -p "$TMP/$name" "$ROOT/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-B40/1.0' "$url" -o "$TMP/$name.zip"
            unzip -q "$TMP/$name.zip" -d "$TMP/$name"
            rsync -a "$TMP/$name/" "$ROOT/$name/"
            cat > "$ROOT/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_single() {
            local name="$1" url="$2" page="$3" title="$4" filename="$5"
            mkdir -p "$ROOT/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-B40/1.0' "$url" -o "$ROOT/$name/$filename"
            cat > "$ROOT/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_single "oga_pigeon_rigged_animated" "https://opengameart.org/sites/default/files/genuinely-my-pigeon-extended-furthur.blend" "https://opengameart.org/content/low-poly-3d-pigeon-model-rigged-animated-untextured" "Low poly 3D Pigeon" "pigeon.blend"
          stage_zip "oga_chicken_rigged_animated" "https://opengameart.org/sites/default/files/chicken.zip" "https://opengameart.org/content/chicken-animated" "Chicken (animated)"
          stage_zip "oga_rooster_rigged_animated" "https://opengameart.org/sites/default/files/rooster.zip" "https://opengameart.org/content/rooster-animated" "Rooster (animated)"

          cat > "assets/staging/sourcechat_b40/README.md" <<'EOF'
          # Source chat B40 — real CC0 pigeon, chicken and rooster 3D sources

          Real species-specific 3D source assets only; nothing is connected to gameplay.

          - Pigeon: low-poly rigged and animated Blender source (untextured).
          - Chicken: rigged/animated game-ready source with diffuse texture and normal map.
          - Rooster: matching rigged/animated male chicken source with diffuse texture and normal map.

          Main chat should normalize scale/orientation, create/choose pigeon materials, verify Godot animation import and build flock/farm AI separately.
          EOF
          rm -rf "$TMP"
          echo "B40 files:"; find assets/staging/sourcechat_b40 -type f | wc -l
          du -sh assets/staging/sourcechat_b40
      - name: Commit B40 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b40
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 pigeon chicken rooster B40"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
