name: Vendor source-chat B31 real CC0 prototype and pirate kits

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b31.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b31
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 prototype and pirate kits
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b31/models"
          TMP=".sourcechat_b31_tmp"
          rm -rf "assets/staging/sourcechat_b31" "$TMP"
          mkdir -p "$ROOT" "$TMP"
          stage_zip() {
            local name="$1" file="$2" page="$3" title="$4"
            local url="https://opengameart.org/sites/default/files/$file"
            mkdir -p "$TMP/$name" "$ROOT/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-B31/1.0' "$url" -o "$TMP/$name.zip"
            unzip -q "$TMP/$name.zip" -d "$TMP/$name"
            rsync -a "$TMP/$name/" "$ROOT/$name/"
            find "$ROOT/$name" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
            cat > "$ROOT/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }
          stage_zip "kenney_prototype_kit" "kenney_prototype-kit.zip" "https://opengameart.org/content/prototype-kit" "Kenney Prototype Kit"
          stage_zip "kenney_pirate_kit" "kenney_pirate-kit_2.1.zip" "https://opengameart.org/content/pirate-kit" "Kenney Pirate Kit"
          cat > "assets/staging/sourcechat_b31/README.md" <<'EOF'
          # Source chat B31 — real CC0 prototype/animation and pirate libraries

          Real source assets only; nothing is connected to gameplay.

          Prototype Kit provides a broad fallback library for characters/animations, animals, wheelchair, vehicles, structures, buttons/levers and general objects. Pirate Kit provides ships, treasure, island/nature and themed props.

          Main chat should treat Prototype Kit primarily as an animation/prototyping/fallback source and only promote art-direction-compatible assets to production. Pirate assets should be selected for ports/coasts/islands where they fit the world.
          EOF
          rm -rf "$TMP"
          echo "B31 files:"; find assets/staging/sourcechat_b31 -type f | wc -l
          du -sh assets/staging/sourcechat_b31
      - name: Commit B31 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b31
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 prototype pirate kits B31"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
