name: Vendor CC0 snow staging

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-snow-staging.yml'

permissions:
  contents: write

concurrency:
  group: vendor-snow-staging
  cancel-in-progress: false

jobs:
  vendor-snow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified CC0 snow assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/weather/snow"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          write_meta() {
            local target="$1"
            local key="$2"
            local source_url="$3"
            local author="$4"
            local download_url="$5"
            local notes="$6"
            mkdir -p "$target"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Author/source: $author
          Source page: $source_url
          Download used by staging workflow: $download_url
          License: CC0 1.0 Universal / public-domain dedication as stated by the source page.
          Status: SOURCE-ONLY STAGING — not gameplay-integrated by this workflow.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal

          This staged asset is recorded by its source page as CC0. The original author has waived copyright and related rights to the extent permitted by law under the Creative Commons CC0 1.0 Universal public-domain dedication.

          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          Preserve SOURCE.md beside the staged files.
          EOF
          }

          FLAKE="$ROOT/oga_snowflake_128"
          mkdir -p "$FLAKE"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/snowflake.png" \
            -o "$FLAKE/snowflake.png"
          write_meta "$FLAKE" "oga_snowflake_128" \
            "https://opengameart.org/content/snow-flake" \
            "mkwong98 / OpenGameArt" \
            "https://opengameart.org/sites/default/files/snowflake.png" \
            "128x128 transparent CC0 snowflake for snowfall particles, close snowflakes and winter UI/VFX masks."

          SURFACE="$ROOT/oga_seamless_snow_1024"
          mkdir -p "$SURFACE"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/snow01.png" \
            -o "$SURFACE/snow01.png"
          write_meta "$SURFACE" "oga_seamless_snow_1024" \
            "https://opengameart.org/content/seamless-snow-texture-0" \
            "GGBotNet / OpenGameArt" \
            "https://opengameart.org/sites/default/files/snow01.png" \
            "1024x1024 seamless CC0 diffuse snow texture for terrain/material source work."

          SURFACE2="$ROOT/oga_snow_texture_verts"
          mkdir -p "$SURFACE2"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/snow_10.png" \
            -o "$SURFACE2/snow.png"
          write_meta "$SURFACE2" "oga_snow_texture_verts" \
            "https://opengameart.org/content/snow-texture-2" \
            "Verts, uploaded with permission by snowman / OpenGameArt" \
            "https://opengameart.org/sites/default/files/snow_10.png" \
            "Second seamless CC0 snow surface candidate; main chat should visually compare and keep the better production material or biome variant."

      - name: Commit staged snow assets back to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/weather/snow
          if git diff --cached --quiet; then
            echo "No staging changes to commit."
            exit 0
          fi
          git commit -m "assets(staging): add verified CC0 snow sources"
          git pull --rebase origin main
          git push origin HEAD:main
