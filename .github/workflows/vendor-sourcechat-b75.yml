name: Vendor source-chat B75 real CC0 crocodile birds wasp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b75.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b75
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 crocodile bird wasp sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b75"
          TMP=".sourcechat_b75_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          meta() {
            local name="$1" page="$2" title="$3" download="$4" notes="$5"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $download
          License: CC0 as stated on the source page.
          Notes: $notes
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          mkdir -p "$TMP/croc" "$ROOT/models/oga_crocodile_animated"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B75/1.0' \
            "https://opengameart.org/sites/default/files/crocodile.7z" -o "$TMP/crocodile.7z"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B75/1.0' \
            "https://opengameart.org/sites/default/files/crocodile_textures.xcf.7z" -o "$TMP/crocodile_textures.xcf.7z"
          if 7z x -y "$TMP/crocodile.7z" -o"$TMP/croc" >/dev/null; then
            chmod -R u+rwX "$TMP/croc" || true
            rsync -a "$TMP/croc/" "$ROOT/models/oga_crocodile_animated/"
          else
            cp "$TMP/crocodile.7z" "$ROOT/models/oga_crocodile_animated/crocodile.7z"
          fi
          cp "$TMP/crocodile_textures.xcf.7z" "$ROOT/models/oga_crocodile_animated/crocodile_textures.xcf.7z"
          meta "oga_crocodile_animated" \
            "https://opengameart.org/content/crocodile-0" \
            "Crocodile" \
            "https://opengameart.org/sites/default/files/crocodile.7z + crocodile_textures.xcf.7z" \
            "918-triangle crocodile with 1024 diffuse/normal/specular textures and idle-loop, walk-loop, attack and death animations. XCF texture source archive is preserved too."

          mkdir -p "$TMP/shrike" "$ROOT/models/oga_yellow_billed_shrike_rigged"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B75/1.0' \
            "https://opengameart.org/sites/default/files/bird_yellow_billed_shrike.zip" -o "$TMP/shrike.zip"
          unzip -q "$TMP/shrike.zip" -d "$TMP/shrike"
          chmod -R u+rwX "$TMP/shrike" || true
          rsync -a "$TMP/shrike/" "$ROOT/models/oga_yellow_billed_shrike_rigged/"
          meta "oga_yellow_billed_shrike_rigged" \
            "https://opengameart.org/content/bird-yellow-billed-shrike" \
            "Bird (Yellow-Billed Shrike)" \
            "https://opengameart.org/sites/default/files/bird_yellow_billed_shrike.zip" \
            "Background bird source under 1k tris (996), IK-rigged and UVed with 2K body texture maps."

          mkdir -p "$ROOT/models/oga_modified_wasp_animated"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B75/1.0' \
            "https://opengameart.org/sites/default/files/Waspv2.blend" -o "$ROOT/models/oga_modified_wasp_animated/Waspv2.blend"
          meta "oga_modified_wasp_animated" \
            "https://opengameart.org/content/modified-wasp" \
            "Modified Wasp" \
            "https://opengameart.org/sites/default/files/Waspv2.blend" \
            "Flat-shaded polygonal wasp, about 1871 tris; source page reports one simple idle animation."

          mkdir -p "$ROOT/models/oga_bird_rigged_animated"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B75/1.0' \
            "https://opengameart.org/sites/default/files/bird.blend" -o "$ROOT/models/oga_bird_rigged_animated/bird.blend"
          meta "oga_bird_rigged_animated" \
            "https://opengameart.org/content/bird" \
            "Bird" \
            "https://opengameart.org/sites/default/files/bird.blend" \
            "Textured, rigged and animated bird source; useful as a generic small-bird animation candidate."

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.cs' -o -iname '*.gd' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B75 — real CC0 crocodile, birds and wasp

          Source-only staging. Nothing is wired into gameplay.

          Main integration chat should normalize scale/materials/animations and use a small selected fauna subset. Shrike and generic bird overlap semantically but serve different roles: the shrike is a higher-detail IK-rigged background bird, while the generic bird is an animation candidate. Crocodile is the strongest active-fauna candidate in this batch.
          EOF

          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B75 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B75 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b75
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 crocodile birds wasp B75"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
