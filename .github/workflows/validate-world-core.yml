name: Validate World Core

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "project.godot"
      - "export_presets.cfg"
      - "assets/audio/**"
      - "assets/production/**"
      - "assets/staging/nature/kenney_nature_kit/**"
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - "tools/run_godot_smoke.sh"
      - "tools/check_version_sync.py"
      - ".github/workflows/validate-world-core.yml"
  pull_request:
    paths:
      - "VERSION"
      - "project.godot"
      - "export_presets.cfg"
      - "assets/audio/**"
      - "assets/production/**"
      - "assets/staging/nature/kenney_nature_kit/**"
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - "tools/run_godot_smoke.sh"
      - "tools/check_version_sync.py"
      - ".github/workflows/validate-world-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impuls-world-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            assets/audio
            assets/branding
            assets/production
            assets/registry
            assets/shaders
            assets/staging/nature/kenney_nature_kit
            assets/ui
            assets/vfx
            installer
            scenes
            scripts
            story
            tests
            tools/run_godot_smoke.sh
            tools/check_version_sync.py

      - name: Verify synchronized version metadata
        run: python3 tools/check_version_sync.py

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Verify production model dependencies
        run: python3 tests/test_production_asset_dependencies.py

      - name: Parse project and scripts
        shell: bash
        run: timeout --signal=TERM --kill-after=15s 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Verify mandatory ImPuls progression systems
        run: bash tools/run_godot_smoke.sh tests/smoke_tz_progression.tscn 120

      - name: Verify active runtime uses production assets only
        shell: bash
        run: |
          set -euo pipefail
          staging_matches="$(
            {
              grep -R -n -F 'res://assets/staging/' --include='*.gd' --include='*.tscn' --include='*.tres' scripts scenes || true
              grep -n -F 'res://assets/staging/' project.godot || true
            }
          )"
          if [[ -n "$staging_matches" ]]; then
            while IFS= read -r match; do
              path="${match%%:*}"
              rest="${match#*:}"
              line="${rest%%:*}"
              message="${rest#*:}"
              echo "::error file=${path},line=${line},title=Staging runtime reference::${message}"
            done <<< "$staging_matches"
            echo '::error::Active runtime must not reference res://assets/staging/. Promote runtime assets to assets/production first.'
            exit 1
          fi
          nature_root='assets/production/nature/kenney_nature_kit/Models/GLTF format'
          grep -Fq 'res://assets/production/nature/kenney_nature_kit/Models/GLTF format/' scripts/start_region_streamer.gd
          grep -Fq 'res://assets/production/nature/kenney_nature_kit/Models/GLTF format/' scripts/start_civilization_signs.gd
          for asset in \
            tree_oak.glb tree_detailed.glb tree_pineDefaultA.glb plant_bushDetailed.glb \
            grass_large.glb rock_largeA.glb log_large.glb stump_roundDetailed.glb mushroom_tanGroup.glb; do
            test -s "$nature_root/$asset"
          done
          test -s assets/production/nature/kenney_nature_kit/LICENSE.txt
          test -s assets/production/nature/kenney_nature_kit/SOURCE.md

          city_root='assets/production/medieval/quaternius_city_core'
          grep -Fq 'res://assets/production/medieval/quaternius_city_core/' scripts/city_district.gd
          grep -Fq 'res://assets/production/medieval/quaternius_city_core/' scripts/capital_landmarks.gd
          for asset in \
            Wall_Plaster_Straight.gltf Wall_Plaster_Straight.bin \
            Wall_Plaster_Door_Round.gltf Wall_Plaster_Door_Round.bin \
            Wall_Plaster_Window_Wide_Round.gltf Wall_Plaster_Window_Wide_Round.bin \
            Wall_UnevenBrick_Straight.gltf Wall_UnevenBrick_Straight.bin \
            Wall_UnevenBrick_Door_Round.gltf Wall_UnevenBrick_Door_Round.bin \
            Wall_UnevenBrick_Window_Wide_Round.gltf Wall_UnevenBrick_Window_Wide_Round.bin \
            Roof_RoundTiles_8x8.gltf Roof_RoundTiles_8x8.bin \
            Prop_Wagon.gltf Prop_Wagon.bin Prop_Crate.gltf Prop_Crate.bin \
            T_WoodTrim_BaseColor.png T_WoodTrim_Normal.png T_WoodTrim_Roughness.png \
            T_Plaster_BaseColor.png T_Plaster_Normal.png T_Plaster_ORM.png \
            T_UnevenBrick_BaseColor.png T_UnevenBrick_Normal.png T_UnevenBrick_Roughness.png \
            T_RoundTiles_BaseColor.png T_RoundTiles_Normal.png T_RoundTiles_Roughness.png; do
            test -s "$city_root/$asset"
          done
          test -s "$city_root/LICENSE.txt"
          test -s "$city_root/License_Standard.txt"
          test -s "$city_root/SOURCE.md"

      - name: Verify enterable shell uses production assets only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'res://assets/production/medieval/building_shell/Door_1_Flat.gltf' scripts/enterable_building.gd
          grep -Fq 'res://assets/production/medieval/building_shell/Roof_RoundTiles_8x8.gltf' scripts/enterable_building.gd
          ! grep -E 'DOOR_SCENE.*assets/staging|ROOF_SCENE.*assets/staging' scripts/enterable_building.gd
          test -s assets/production/medieval/building_shell/Door_1_Flat.gltf
          test -s assets/production/medieval/building_shell/Door_1_Flat.bin
          test -s assets/production/medieval/building_shell/Roof_RoundTiles_8x8.gltf
          test -s assets/production/medieval/building_shell/Roof_RoundTiles_8x8.bin
          test -s assets/production/medieval/building_shell/QUATERNIUS_CC0_LICENSE.txt

      - name: Verify startup main menu flow
        run: bash tools/run_godot_smoke.sh tests/smoke_startup_menu.tscn 180
      - name: Verify canonical regions and climate
        run: bash tools/run_godot_smoke.sh tests/smoke_canonical_regions.tscn 90
      - name: Verify terrain seam normals and matching physical triangles
        run: bash tools/run_godot_smoke.sh tests/smoke_terrain_geometry.tscn 90
      - name: Verify conforming river shore and shared physical edges
        run: bash tools/run_godot_smoke.sh tests/smoke_river_shoreline.tscn 90
      - name: Verify forest avoids inhabited clearings
        run: bash tools/run_godot_smoke.sh tests/smoke_nature_clearings.tscn 90
      - name: Verify physical hydrology
        run: bash tools/run_godot_smoke.sh tests/smoke_world_hydrology.tscn 180
      - name: Verify bounded start-region production nature streaming
        run: bash tools/run_godot_smoke.sh tests/smoke_start_region_nature_streaming.tscn 180
      - name: Verify spatial world audio and surface-aware footsteps
        run: bash tools/run_godot_smoke.sh tests/smoke_world_audio.tscn 180
      - name: Verify physical river crossings
        run: bash tools/run_godot_smoke.sh tests/smoke_world_crossings.tscn 180
      - name: Verify real enterable building shell
        run: bash tools/run_godot_smoke.sh tests/smoke_enterable_building.tscn 180
      - name: Verify real production furniture in enterable interiors
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_interior_assets.tscn 240
      - name: Verify scene-based settlement streamer construction
        run: bash tools/run_godot_smoke.sh tests/smoke_world_settlements_fixture.tscn 60
      - name: Verify streamed physical settlements and gates
        run: bash tools/run_godot_smoke.sh tests/smoke_world_settlements.tscn 300
      - name: Verify physical settlement markets water and warehouses
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_public_works.tscn 300
      - name: Verify physical civic hall and council interior
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_civic_spaces.tscn 300
      - name: Verify bounded settlement and NPC streaming
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_streaming.tscn 300
      - name: Verify settlement road gate topology
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_gate_network.tscn 240
      - name: Verify physical roads pass through settlement gates
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_road_gate_overlay.tscn 240
      - name: Verify fortified town gate hinges and clearance
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_gate_overlay.tscn 240
      - name: Verify continuous sunrise, sunset and midnight lighting
        run: bash tools/run_godot_smoke.sh tests/smoke_world_lighting.tscn 60
      - name: Verify world boot, streamed roads and river water
        run: bash tools/run_godot_smoke.sh tests/smoke_boot_world.tscn 300
      - name: Verify terrain faces upward and produces collision
        run: bash tools/run_godot_smoke.sh tests/smoke_terrain_surface.tscn 60
      - name: Verify skinned human, ground contact and joined river banks
        run: bash tools/run_godot_smoke.sh tests/smoke_visual_grounding.tscn 120
      - name: Verify graphics presets, equipment, physical arrows and magic
        run: bash tools/run_godot_smoke.sh tests/smoke_gameplay_actions.tscn 120
      - name: Verify canonical capital residents, dialogue and walking
        run: bash tools/run_godot_smoke.sh tests/smoke_capital_gameplay.tscn 120
      - name: Verify terrain map and persistent discovered features
        run: bash tools/run_godot_smoke.sh tests/smoke_cartography.tscn 90
      - name: Verify citizen routines and finite paid trading
        run: bash tools/run_godot_smoke.sh tests/smoke_citizen_life.tscn 90
      - name: Verify player traverses bridge approaches
        run: bash tools/run_godot_smoke.sh tests/smoke_bridge_traversal.tscn 120
      - name: Verify capital road stays above the sea
        run: bash tools/run_godot_smoke.sh tests/smoke_capital_road.tscn 90
      - name: Verify supported steps and tall wall grounding
        run: bash tools/run_godot_smoke.sh tests/smoke_step_grounding.tscn 120
      - name: Verify authored resources and persistent encounters
        run: bash tools/run_godot_smoke.sh tests/smoke_living_world.tscn 90
      - name: Verify axe contact, tree fall, forest batches and persistent wood
        run: bash tools/run_godot_smoke.sh tests/smoke_chopping.tscn 90
      - name: Verify capital gate collisions and physical street access
        run: bash tools/run_godot_smoke.sh tests/smoke_capital_gate_traversal.tscn 180
      - name: Verify player movement and physical terrain
        run: bash tools/run_godot_smoke.sh tests/smoke_player_movement.tscn 240
      - name: Verify South Gate repair quest progression
        run: bash tools/run_godot_smoke.sh tests/smoke_city_quest.tscn 90
      - name: Verify HUD menus and save slots
        run: bash tools/run_godot_smoke.sh tests/smoke_ui_and_save.tscn 180
      - name: Verify corrupt save recovery and backup preservation
        run: bash tools/run_godot_smoke.sh tests/smoke_save_recovery.tscn 60
      - name: Verify loading readiness conversions
        run: bash tools/run_godot_smoke.sh tests/test_world_loading_readiness.tscn 60
      - name: Verify rapid UI teardown and streamed-node bursts
        run: bash tools/run_godot_smoke.sh tests/smoke_ui_lifecycle.tscn 60
      - name: Verify menus across resolutions and UI scales
        run: bash tools/run_godot_smoke.sh tests/smoke_ui_responsive.tscn 180
      - name: Install virtual display for camera validation
        # Geometry obstruction is also checked with the normal physics backend.
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Verify third-person camera obstruction and persistent zoom
        run: bash tools/run_godot_smoke.sh tests/smoke_camera_obstruction.tscn 120
      - name: Verify captured mouse and gameplay camera
        run: xvfb-run -a env GODOT_SMOKE_GRAPHICAL=1 LIBGL_ALWAYS_SOFTWARE=1 bash tools/run_godot_smoke.sh tests/smoke_camera_input.tscn 180
      - name: Verify rendered hair strand highlight detail
        run: xvfb-run -a env GODOT_SMOKE_GRAPHICAL=1 LIBGL_ALWAYS_SOFTWARE=1 bash tools/run_godot_smoke.sh tests/smoke_hair_rendering.tscn 60
      - name: Verify map cache across load and new game
        run: xvfb-run -a env GODOT_SMOKE_GRAPHICAL=1 LIBGL_ALWAYS_SOFTWARE=1 bash tools/run_godot_smoke.sh tests/smoke_map_state_transition.tscn 90
      - name: Verify chopping removes real rendered forest instances
        run: xvfb-run -a env GODOT_SMOKE_GRAPHICAL=1 LIBGL_ALWAYS_SOFTWARE=1 bash tools/run_godot_smoke.sh tests/smoke_chopping.tscn 90
      - name: Verify saved spell selection and remaining cooldowns
        run: bash tools/run_godot_smoke.sh tests/smoke_magic_state.tscn 90
      - name: Verify playable character creator and saved appearance
        run: bash tools/run_godot_smoke.sh tests/smoke_character_creator.tscn 120
      - name: Verify physical mip levels on character materials
        run: bash tools/run_godot_smoke.sh tests/smoke_character_texture_filtering.tscn 90
      - name: Verify character height and physical low passages
        run: bash tools/run_godot_smoke.sh tests/smoke_character_dimensions.tscn 90
      - name: Verify measured weapon grip and draw cancellation
        run: bash tools/run_godot_smoke.sh tests/smoke_weapon_grip.tscn 90
      - name: Verify saved household furniture
        run: bash tools/run_godot_smoke.sh tests/smoke_household_furniture.tscn 180
      - name: Verify private storage and bulk capacity
        run: bash tools/run_godot_smoke.sh tests/smoke_storage_access.tscn 60
      - name: Verify anatomical seated joint directions
        run: bash tools/run_godot_smoke.sh tests/smoke_household_pose.tscn 45
      - name: Verify graphics presets and absent NPC nameplates
        run: bash tools/run_godot_smoke.sh tests/smoke_household_quality.tscn 60
      - name: Verify household clearance past a stationary hero
        run: bash tools/run_godot_smoke.sh tests/smoke_household_aisle.tscn 60
      - name: Verify live home and workplace routes
        run: bash tools/run_godot_smoke.sh tests/smoke_square_home_life.tscn 300
      - name: Verify streamed citizen persistence
        run: bash tools/run_godot_smoke.sh tests/smoke_citizen_persistence.tscn 90
      - name: Verify runtime transforms before tree entry
        run: bash tools/run_godot_smoke.sh tests/smoke_runtime_spawn_transforms.tscn 60
      - name: Verify capital square recipe and production assets
        run: bash tools/run_godot_smoke.sh tests/smoke_capital_square.tscn 180
