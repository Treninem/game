name: Validate World Core

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - ".github/workflows/validate-world-core.yml"
  pull_request:
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - ".github/workflows/validate-world-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impuls-world-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Parse project and scripts
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Verify canonical regions and climate
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_canonical_regions.tscn

      - name: Verify physical hydrology
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_world_hydrology.tscn

      - name: Verify physical river crossings
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_world_crossings.tscn

      - name: Verify real enterable building shell
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_enterable_building.tscn

      - name: Verify real production furniture in enterable interiors
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_settlement_interior_assets.tscn

      - name: Verify streamed physical settlements and gates
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_world_settlements.tscn

      - name: Verify bounded settlement and NPC streaming
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_settlement_streaming.tscn

      - name: Verify settlement road gate topology
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_settlement_gate_network.tscn

      - name: Verify physical roads pass through settlement gates
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_settlement_road_gate_overlay.tscn

      - name: Verify fortified town gate hinges and clearance
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_settlement_gate_overlay.tscn

      - name: Verify world boot, streamed roads and river water
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_boot_world.tscn

      - name: Verify player movement and physical terrain
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_player_movement.tscn

      - name: Verify HUD menus and save slots
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_ui_and_save.tscn
