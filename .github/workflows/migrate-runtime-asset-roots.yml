name: Migrate Runtime Asset Roots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-runtime-asset-roots.yml"

permissions:
  contents: write

concurrency:
  group: impuls-runtime-asset-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/migrate-runtime-asset-roots.yml
            scripts/city_district.gd
            scripts/capital_landmarks.gd

      - name: Replace exact staging roots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [Path("scripts/city_district.gd"), Path("scripts/capital_landmarks.gd")]
          old = 'const ASSET_ROOT := "res://assets/staging/sourcechat_b47/models/quaternius_medieval_village_megakit_standard/glTF/"'
          new = 'const ASSET_ROOT := "res://assets/production/medieval/quaternius_city_core/"'

          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old runtime root, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git diff --check
          ! grep -F 'res://assets/staging/' scripts/city_district.gd scripts/capital_landmarks.gd
          grep -Fq 'res://assets/production/medieval/quaternius_city_core/' scripts/city_district.gd
          grep -Fq 'res://assets/production/medieval/quaternius_city_core/' scripts/capital_landmarks.gd

      - name: Commit minimal migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/city_district.gd scripts/capital_landmarks.gd
          changed="$(git diff --cached --name-only)"
          expected=$'scripts/capital_landmarks.gd\nscripts/city_district.gd'
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected migration diff:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git commit -m "fix(world): use production medieval city assets"
          git push origin HEAD:main
