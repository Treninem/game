name: Vendor source-chat B26 real CC0 farm animals and food kit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b26.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b26
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 farm animals and food kit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b26"
          TMP=".sourcechat_b26_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          stage_zip() {
            local name="$1" url="$2" page="$3" title="$4"
            mkdir -p "$TMP/$name" "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-SourceChat-B26/1.0' "$url" -o "$TMP/$name.zip"
            unzip -q "$TMP/$name.zip" -d "$TMP/$name"
            rsync -a "$TMP/$name/" "$ROOT/models/$name/"
            find "$ROOT/models/$name" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_zip "quaternius_farm_animals" "https://opengameart.org/sites/default/files/Farm%20Animals%20by%20%40Quaternius.zip" "https://opengameart.org/content/lowpoly-animated-farm-animal-pack" "LowPoly Animated Farm Animal Pack"
          stage_zip "kenney_food_kit" "https://opengameart.org/sites/default/files/kenney_food-kit.zip" "https://opengameart.org/content/food-kit" "Kenney Food Kit"

          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B26 — real CC0 farm animals and food/kitchen assets

          Real extracted assets only; not connected to gameplay.

          - Quaternius Farm Animals: animated low-poly pig, cow, horse, llama, pug/dog and sheep; source page states Blend, OBJ and FBX are included.
          - Kenney Food Kit: 200 optimized low-poly food and kitchen objects in FBX/OBJ/glTF families.

          Main chat should test animation import in Godot, normalize animal scale/skeleton handling, and promote only selected food/kitchen items to production paths.
          EOF
          rm -rf "$TMP"
          echo "B26 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B26 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b26
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 farm animals food kit B26"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
