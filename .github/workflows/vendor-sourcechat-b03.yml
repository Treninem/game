name: Vendor source-chat B03 real CC0 packs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b03.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b03
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real source-only CC0 packs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b03"
          TMP=".sourcechat_b03_tmp"
          rm -rf "$TMP"
          mkdir -p "$ROOT/vfx" "$ROOT/audio" "$TMP"

          write_meta() {
            local target="$1" key="$2" source="$3" author="$4" download="$5" notes="$6"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Author/source: $author
          Source page: $source
          Download used: $download
          License: CC0 1.0 Universal / public-domain dedication as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal

          The linked source page marks this staged asset as CC0.
          CC0 reference: https://creativecommons.org/publicdomain/zero/1.0/
          Preserve SOURCE.md with staged source files.
          EOF
          }

          import_zip() {
            local section="$1" key="$2" url="$3" source="$4" author="$5" notes="$6"
            local target="$ROOT/$section/$key" work="$TMP/$key"
            rm -rf "$target" "$work"
            mkdir -p "$target" "$work/archive"
            echo "Downloading $key"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
              -A 'ImPuls-CC0-SourceChat-B03/1.0' "$url" -o "$work/pack.zip"
            unzip -q "$work/pack.zip" -d "$work/archive"
            rsync -a --prune-empty-dirs \
              --include='*/' \
              --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' \
              --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' \
              --include='*.gif' --include='*.GIF' --include='*.svg' --include='*.SVG' \
              --include='*.wav' --include='*.WAV' --include='*.ogg' --include='*.OGG' \
              --include='*.mp3' --include='*.MP3' --include='*.flac' --include='*.FLAC' \
              --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' \
              --exclude='*' "$work/archive/" "$target/"
            write_meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          import_file() {
            local section="$1" key="$2" filename="$3" url="$4" source="$5" author="$6" notes="$7"
            local target="$ROOT/$section/$key"
            mkdir -p "$target"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              -A 'ImPuls-CC0-SourceChat-B03/1.0' "$url" -o "$target/$filename"
            write_meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          # Visual VFX source packs.
          import_zip "vfx" "oga_70_animated_effects" \
            "https://opengameart.org/sites/default/files/70_Effects_0.zip" \
            "https://opengameart.org/content/70-animated-2d-game-effects" \
            "IndieDevs / OpenGameArt" \
            "70 animated CC0 2D effects; broad source library for physical impacts, flashes, smoke and environmental effect candidates."

          import_zip "vfx" "oga_plasma_electric_animations" \
            "https://opengameart.org/sites/default/files/rc_art_-_plasma_electric_animations.zip" \
            "https://opengameart.org/content/plasma-electric-effect-animations" \
            "Reactorcore / OpenGameArt" \
            "Transparent electric/plasma/vortex animation sheets and individual PNGs. For electrical faults, generators, lightning-adjacent effects and machine arcs; main chat should ignore magic-looking variants if unsuitable."

          # Physical destruction / material audio.
          import_zip "audio" "oga_75_breaking_falling_hit_sfx" \
            "https://opengameart.org/sites/default/files/sfx_breaking_and_falling.zip" \
            "https://opengameart.org/content/75-cc0-breaking-falling-hit-sfx" \
            "rubberduck / OpenGameArt" \
            "75 CC0 destruction sounds covering wood, metal, glass, rock/stone, cracking, falling and impacts."

          import_zip "audio" "oga_100_metal_wood_sfx" \
            "https://opengameart.org/sites/default/files/100-CC0-wood-metal-SFX.zip" \
            "https://opengameart.org/content/100-cc0-metal-and-wood-sfx" \
            "rubberduck / OpenGameArt" \
            "100 CC0 metal/wood sounds: doors, hammering, locks, sheets, tools, hits, falls, cracks, breaks and squeaks."

          import_zip "audio" "oga_25_mud_sfx" \
            "https://opengameart.org/sites/default/files/25-CC0-mud-sfx.zip" \
            "https://opengameart.org/content/25-cc0-mud-sfx" \
            "rubberduck / OpenGameArt" \
            "25 CC0 mud/wet/squish sounds for footsteps, wheels, impacts and swamp interaction."

          import_zip "audio" "oga_40_water_splash_slime_sfx" \
            "https://opengameart.org/sites/default/files/water-splash-slime-sfx.zip" \
            "https://opengameart.org/content/40-cc0-water-splash-slime-sfx" \
            "rubberduck / OpenGameArt" \
            "40 CC0 water family sounds including bubbles, rain/water loops and 15 splashes; slime files are staged but optional for integration."

          import_zip "audio" "oga_ice_shatters_sfx" \
            "https://opengameart.org/sites/default/files/IceShatters_0.zip" \
            "https://opengameart.org/content/ice-breakingshattering" \
            "IgnasD / OpenGameArt" \
            "CC0 ice breaking and shattering sounds for frozen lakes, icicles and destructible ice."

          import_zip "audio" "oga_wind_sfx" \
            "https://opengameart.org/sites/default/files/wind.zip" \
            "https://opengameart.org/content/wind" \
            "IgnasD / OpenGameArt" \
            "CC0 wind recordings for wind/weather ambience layers."

          import_file "audio" "oga_glass_break_sfx" "glass_breaking.wav" \
            "https://opengameart.org/sites/default/files/glass_breaking.wav" \
            "https://opengameart.org/content/glass-break" \
            "Till Behrend / TinyWorlds / OpenGameArt" \
            "Game-ready CC0 glass break recording for windows, bottles and shattered glass."

          import_file "audio" "oga_electricity_sfx" "continuousspark.wav" \
            "https://opengameart.org/sites/default/files/continuousspark.wav" \
            "https://opengameart.org/content/electricity-sound-effects-0" \
            "BMacZero / OpenGameArt" \
            "CC0 continuous electrical spark/Tesla recording."
          import_file "audio" "oga_electricity_sfx" "spark.wav" \
            "https://opengameart.org/sites/default/files/spark.wav" \
            "https://opengameart.org/content/electricity-sound-effects-0" \
            "BMacZero / OpenGameArt" \
            "CC0 short electrical spark/Tesla recording."

          import_file "audio" "oga_rain_thunder_ambience" "Dark_Rainy_Night_ambience.ogg" \
            "https://opengameart.org/sites/default/files/Dark_Rainy_Night%28ambience%29.ogg" \
            "https://opengameart.org/content/rain-and-thunders" \
            "kindland / OpenGameArt" \
            "CC0 rain-and-thunder ambience candidate; source page states no attribution instructions."

          rm -rf "$TMP"

          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B03 — physically staged real packs

          This folder contains real downloaded CC0 files, not link-only registry entries.
          Nothing here is connected to gameplay by this source chat.

          ## Visual VFX
          - `vfx/oga_70_animated_effects/`
          - `vfx/oga_plasma_electric_animations/`

          ## Physical / environment audio
          - `audio/oga_75_breaking_falling_hit_sfx/`
          - `audio/oga_100_metal_wood_sfx/`
          - `audio/oga_25_mud_sfx/`
          - `audio/oga_40_water_splash_slime_sfx/`
          - `audio/oga_ice_shatters_sfx/`
          - `audio/oga_wind_sfx/`
          - `audio/oga_glass_break_sfx/`
          - `audio/oga_electricity_sfx/`
          - `audio/oga_rain_thunder_ambience/`

          Main integration chat should inspect SOURCE.md and LICENSE.txt, deduplicate, choose production subsets, then promote selected files to final asset paths.
          EOF

          echo "Physical staged file counts:"
          find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit only source-chat B03 staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b03
          if git diff --cached --quiet; then
            echo "No source-chat B03 staging changes."
            exit 0
          fi
          git commit -m "assets(staging): vendor real CC0 destruction weather packs B03"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
