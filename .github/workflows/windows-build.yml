name: Build Stable Release and Installer

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/**"
      - "scenes/**"
      - "installer/**"
      - "tools/**"
      - "tests/**"
      - "assets/audio/**"
      - "assets/branding/**"
      - "assets/ui/**"
      - "assets/vfx/**"
      - "assets/shaders/**"
      - "assets/staging/sourcechat_b47/**"
      - "assets/staging/nature/kenney_nature_kit/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impuls-stable-release
  cancel-in-progress: true

jobs:
  build-game:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[stable]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            scenes
            tests
            tools
            installer
            assets/audio
            assets/branding
            assets/ui
            assets/vfx
            assets/shaders
            assets/staging/sourcechat_b47
            assets/staging/nature/kenney_nature_kit
      - name: Prepare ImPuls branding
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/make_icon.py installer/impuls.ico
          test -s assets/branding/impuls_icon.png
          test -s installer/impuls.ico
      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz"
          rm -rf templates_unpack && mkdir templates_unpack
          unzip -q templates.tpz -d templates_unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -r templates_unpack/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
      - name: Validate project headlessly
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Verify production world audio
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_world_audio.tscn
      - name: Verify stable gameplay boot
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_boot_world.tscn
      - name: Verify UI and save slots
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_ui_and_save.tscn
      - name: Verify player traverses the world
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_player_movement.tscn
      - name: Export Windows x64
        run: |
          mkdir -p build/windows
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/ImPuls.exe
          test -f build/windows/ImPuls.exe
          test -f build/windows/ImPuls.pck
      - name: Report compact package size
        run: du -h build/windows/ImPuls.exe build/windows/ImPuls.pck
      - name: Package Windows build
        run: cd build/windows && zip -9 -r ../../ImPuls-PC-Windows-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: game-windows
          path: |
            build/windows/
            ImPuls-PC-Windows-x64.zip

  build-installer:
    needs: build-game
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            installer
            assets/branding
      - name: Validate updater PowerShell syntax
        shell: powershell
        run: |
          $files = @("installer/updater_bootstrap.ps1", "installer/updater_v4.ps1", "installer/repair_sync.ps1", "installer/updater.ps1", "installer/install_update_task.ps1", "installer/refresh_shortcuts.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $source = [System.IO.File]::ReadAllText((Resolve-Path $file), (New-Object System.Text.UTF8Encoding($false)))
            [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              throw "PowerShell syntax validation failed: $file"
            }
          }
      - name: Prepare ImPuls branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/make_icon.py installer/impuls.ico
          if (-not (Test-Path installer/impuls.ico)) { throw "ImPuls ICO missing" }
      - uses: actions/download-artifact@v4
        with:
          name: game-windows
          path: downloaded
      - name: Prepare installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          Copy-Item downloaded/build/windows/* build/windows/ -Recurse -Force
          "build-${{ github.run_number }}" | Set-Content installer/release_tag.txt -Encoding ASCII
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyBuildTag=build-${{ github.run_number }}" "installer\ImPuls.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ImPuls-Setup
          path: installer/output/ImPuls-Setup-*.exe

  publish-stable:
    needs: [build-game, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            installer
            assets/branding
      - uses: actions/download-artifact@v4
        with:
          name: game-windows
          path: game
      - uses: actions/download-artifact@v4
        with:
          name: ImPuls-Setup
          path: installer-artifact
      - name: Capture previous stable build
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous/windows
          OLD_BUILD=""
          if gh release view stable --repo "${{ github.repository }}" >/dev/null 2>&1; then
            OLD_BUILD="$(gh release view stable --repo "${{ github.repository }}" --json name --jq .name)"
            if [[ "$OLD_BUILD" =~ ^build-[0-9]+$ ]]; then
              gh release download stable --repo "${{ github.repository }}" --pattern "ImPuls-PC-Windows-x64.zip" --dir previous || true
              if [[ -f previous/ImPuls-PC-Windows-x64.zip ]]; then
                unzip -q previous/ImPuls-PC-Windows-x64.zip -d previous/windows
              else
                OLD_BUILD=""
              fi
            else
              OLD_BUILD=""
            fi
          fi
          echo "old_build=$OLD_BUILD" >> "$GITHUB_OUTPUT"
      - name: Prepare stable release files and content delta
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          BUILD="build-${{ github.run_number }}"
          OLD_BUILD="${{ steps.previous.outputs.old_build }}"
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/make_icon.py installer/impuls.ico
          cp game/ImPuls-PC-Windows-x64.zip .
          cp game/build/windows/ImPuls.exe ./ImPuls.exe
          cp game/build/windows/ImPuls.pck ./ImPuls.pck
          cp installer-artifact/ImPuls-Setup-*.exe ./ImPuls-Setup.exe

          mkdir -p updater-runtime
          cp installer/updater_bootstrap.ps1 installer/updater_v4.ps1 installer/repair_sync.ps1 installer/updater.ps1 installer/launcher.vbs installer/install_update_task.ps1 installer/refresh_shortcuts.ps1 installer/impuls.ico updater-runtime/
          (cd updater-runtime && zip -9 -r ../ImPuls-Updater-Runtime.zip .)

          FROM_BUILD="${OLD_BUILD:-bootstrap}"
          DELTA_NAME="ImPuls-Delta-${FROM_BUILD}-to-${BUILD}.zip"
          python3 tools/build_delta.py \
            --old-dir previous/windows \
            --new-dir game/build/windows \
            --from-build "$FROM_BUILD" \
            --to-build "$BUILD" \
            --output "$DELTA_NAME" \
            --manifest ImPuls-File-Manifest.json

          sha256sum ImPuls-PC-Windows-x64.zip ImPuls.exe ImPuls.pck ImPuls-Setup.exe ImPuls-Updater-Runtime.zip ImPuls-File-Manifest.json > SHA256SUMS.txt
          if [[ -n "$OLD_BUILD" ]]; then
            sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
            echo "delta_name=$DELTA_NAME" >> "$GITHUB_OUTPUT"
            echo "delta_sum=$DELTA_NAME.sha256" >> "$GITHUB_OUTPUT"
          else
            rm -f "$DELTA_NAME"
            echo "delta_name=" >> "$GITHUB_OUTPUT"
            echo "delta_sum=" >> "$GITHUB_OUTPUT"
          fi

          echo "Full first-install package: $(stat -c%s ImPuls-PC-Windows-x64.zip) bytes"
          echo "Repair asset exe: $(stat -c%s ImPuls.exe) bytes"
          echo "Repair asset pck: $(stat -c%s ImPuls.pck) bytes"
          if [[ -n "$OLD_BUILD" ]]; then
            echo "Delta-only update package: $(stat -c%s "$DELTA_NAME") bytes"
          fi
      - name: Publish rolling stable channel
        env:
          GH_TOKEN: ${{ github.token }}
          DELTA_NAME: ${{ steps.delta.outputs.delta_name }}
          DELTA_SUM: ${{ steps.delta.outputs.delta_sum }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD="build-${{ github.run_number }}"
          ASSETS=(ImPuls-PC-Windows-x64.zip ImPuls.exe ImPuls.pck ImPuls-Setup.exe ImPuls-Updater-Runtime.zip ImPuls-File-Manifest.json SHA256SUMS.txt)
          if [[ -n "$DELTA_NAME" && -f "$DELTA_NAME" ]]; then
            ASSETS+=("$DELTA_NAME" "$DELTA_SUM")
          fi
          if gh release view stable --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload stable "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"
            gh release edit stable --title "$BUILD" --notes "ImPuls stable channel. Normal installed builds update through retained content-aware delta chains; missing core files are repaired individually from signed manifest data. The full archive is for first installation/manual recovery only. Visible verified progress, responsive UI auto-alignment, rollback and offline-safe startup are mandatory." --repo "${{ github.repository }}"
          else
            gh release create stable "${ASSETS[@]}" --title "$BUILD" --notes "ImPuls stable channel. Normal installed builds update through retained content-aware delta chains; missing core files are repaired individually from signed manifest data. The full archive is for first installation/manual recovery only. Visible verified progress, responsive UI auto-alignment, rollback and offline-safe startup are mandatory." --repo "${{ github.repository }}"
          fi
