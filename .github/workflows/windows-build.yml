name: Build ImPuls Release Candidate

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/**"
      - "scenes/**"
      - "installer/**"
      - "tools/**"
      - "tests/**"
      - "assets/audio/**"
      - "assets/branding/**"
      - "assets/production/**"
      - "assets/ui/**"
      - "assets/vfx/**"
      - "assets/shaders/**"
      - "assets/staging/nature/kenney_nature_kit/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "export_presets.cfg"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/promote-current-stable.yml"
      - ".github/workflows/release-gate-status.yml"
      - ".github/workflows/release-gate-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impuls-release-candidate
  cancel-in-progress: true

jobs:
  build-game:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[candidate]') || contains(github.event.head_commit.message, '[stable]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            scenes
            tests
            tools
            installer
            assets/audio
            assets/branding
            assets/production
            assets/ui
            assets/vfx
            assets/shaders
            assets/staging/nature/kenney_nature_kit
            .github/workflows
      - name: Verify synchronized version metadata
        run: python3 tools/check_version_sync.py
      - name: Verify candidate/promotion separation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          candidate = Path(".github/workflows/windows-build.yml").read_text(encoding="utf-8")
          promote = Path(".github/workflows/promote-current-stable.yml").read_text(encoding="utf-8")
          gate_status = Path(".github/workflows/release-gate-status.yml").read_text(encoding="utf-8")
          gate_probe = Path(".github/workflows/release-gate-probe.yml").read_text(encoding="utf-8")
          forbidden_publish = ("gh release " + "upload stable", "gh release " + "create stable")
          assert all(marker not in candidate for marker in forbidden_publish)
          assert "Install candidate and prove installed game starts" in candidate
          assert "candidate_run_id" in promote
          assert "candidate_sha" in promote
          assert "INSTALLED_ACCEPTED" in promote
          assert "run-id: $" + "{{ inputs.candidate_run_id }}" in promote
          assert "github-token: $" + "{{ github.token }}" in promote
          assert 'HEAD_BRANCH="$(jq -r \'.head_branch\' <<<"$META")"' in promote
          assert '[[ "$HEAD_BRANCH" != "main" ]]' in promote
          assert '[[ "$EVENT" != "workflow_dispatch" && "$EVENT" != "push" ]]' in promote
          expected_candidate_name = "Build ImPuls Release Candidate"
          old_stable_name = "Build Stable Release and Installer"
          assert expected_candidate_name in gate_status
          assert old_stable_name not in gate_status
          assert expected_candidate_name in gate_probe
          assert old_stable_name not in gate_probe
          assert "[candidate]" in gate_probe
          print("candidate/promotion/release-gate separation contract OK")
          PY
      - name: Prepare ImPuls branding
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/make_icon.py installer/impuls.ico
          test -s assets/branding/impuls_icon.png
          test -s installer/impuls.ico
      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz"
          rm -rf templates_unpack && mkdir templates_unpack
          unzip -q templates.tpz -d templates_unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -r templates_unpack/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
      - name: Validate project headlessly
        shell: bash
        run: timeout --signal=TERM --kill-after=15s 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Verify mandatory ImPuls progression systems
        run: bash tools/run_godot_smoke.sh tests/smoke_tz_progression.tscn 120
      - name: Verify startup main menu
        run: bash tools/run_godot_smoke.sh tests/smoke_startup_menu.tscn 180
      - name: Verify player-facing magic runtime
        run: bash tools/run_godot_smoke.sh tests/smoke_magic_runtime.tscn 90
      - name: Verify world VFX runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'WorldVFX="*res://scripts/world_vfx.gd"' project.godot
          grep -Fq 'WeatherVFX="*res://scripts/weather_vfx.gd"' project.godot
          grep -Fq 'AmbientVFX="*res://scripts/ambient_vfx.gd"' project.godot
          grep -Fq 'NatureVFX="*res://scripts/nature_vfx.gd"' project.godot
          grep -Fq 'LandmarkVFX="*res://scripts/landmark_vfx.gd"' project.godot
          grep -Fq 'ScreenVFX="*res://scripts/screen_vfx.gd"' project.godot
          grep -Fq 'spawn_footstep' scripts/player_controller.gd
          grep -Fq 'spawn_landing' scripts/player_controller.gd
          grep -Fq 'damage_feedback' scripts/enemy.gd
          grep -Fq 'lightning_flash' scripts/weather_vfx.gd
      - name: Verify canonical regions and climate
        run: bash tools/run_godot_smoke.sh tests/smoke_canonical_regions.tscn 90
      - name: Verify physical hydrology
        run: bash tools/run_godot_smoke.sh tests/smoke_world_hydrology.tscn 180
      - name: Verify production world audio
        run: bash tools/run_godot_smoke.sh tests/smoke_world_audio.tscn 180
      - name: Verify physical river crossings
        run: bash tools/run_godot_smoke.sh tests/smoke_world_crossings.tscn 180
      - name: Verify real enterable building shell
        run: bash tools/run_godot_smoke.sh tests/smoke_enterable_building.tscn 180
      - name: Verify real production furniture
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_interior_assets.tscn 240
      - name: Verify streamed physical settlements
        run: bash tools/run_godot_smoke.sh tests/smoke_world_settlements.tscn 300
      - name: Verify settlement public works
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_public_works.tscn 300
      - name: Verify settlement civic spaces
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_civic_spaces.tscn 300
      - name: Verify settlement streaming bounds
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_streaming.tscn 300
      - name: Verify settlement gate network
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_gate_network.tscn 240
      - name: Verify roads through settlement gates
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_road_gate_overlay.tscn 240
      - name: Verify fortified town gate clearance
        run: bash tools/run_godot_smoke.sh tests/smoke_settlement_gate_overlay.tscn 240
      - name: Verify stable gameplay boot
        run: bash tools/run_godot_smoke.sh tests/smoke_boot_world.tscn 300
      - name: Verify UI and save slots
        run: bash tools/run_godot_smoke.sh tests/smoke_ui_and_save.tscn 180
      - name: Verify player traverses the world
        run: bash tools/run_godot_smoke.sh tests/smoke_player_movement.tscn 240
      - name: Verify bounded streaming outside the mainland
        run: bash tools/run_godot_smoke.sh tests/smoke_offworld_streaming.tscn 120
      - name: Verify updater delta roundtrip
        run: python3 tools/verify_delta_roundtrip.py
      - name: Export Windows x64
        run: |
          mkdir -p build/windows
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/ImPuls.exe
          test -f build/windows/ImPuls.exe
          test -f build/windows/ImPuls.pck
      - name: Report compact package size
        run: du -h build/windows/ImPuls.exe build/windows/ImPuls.pck
      - name: Package Windows build
        run: cd build/windows && zip -9 -r ../../ImPuls-PC-Windows-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: game-windows
          path: |
            build/windows/
            ImPuls-PC-Windows-x64.zip

  build-installer:
    needs: build-game
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            installer
            assets/branding
      - name: Validate updater PowerShell syntax
        shell: powershell
        run: |
          $files = @("installer/updater_bootstrap.ps1", "installer/updater_v4.ps1", "installer/repair_sync.ps1", "installer/updater.ps1", "installer/install_update_task.ps1", "installer/refresh_shortcuts.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $source = [System.IO.File]::ReadAllText((Resolve-Path $file), (New-Object System.Text.UTF8Encoding($false)))
            [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              throw "PowerShell syntax validation failed: $file"
            }
          }
      - name: Prove updater delta and repair policy
        shell: powershell
        run: |
          $bootstrap = Get-Content installer/updater_bootstrap.ps1 -Raw
          if ($bootstrap -notmatch 'ReadAllText' -or $bootstrap -notmatch 'UTF8Encoding' -or $bootstrap -notmatch 'updater_v4.ps1') {
            throw "Bootstrap does not enforce UTF-8 implementation loading"
          }
          $impl = [System.IO.File]::ReadAllText((Resolve-Path "installer/updater_v4.ps1"), (New-Object System.Text.UTF8Encoding($false)))
          foreach ($required in @('Initialize-ProgressUi','Set-ProgressUi','Download-File','Get-DeltaChain','Apply-Delta','Verify-Manifest','RangeHeaderValue','InfiniteTimeSpan','update-cache','.part')) {
            if ($impl -notmatch [regex]::Escape($required)) { throw "Missing updater marker: $required" }
          }
          if ($impl -match 'ImPuls-PC-Windows-x64\.zip.*Download-File' -or $impl -match 'ImPuls-Setup\.exe.*Download-File') {
            throw "Delta updater contains forbidden full-package/installer fallback"
          }

          $repair = [System.IO.File]::ReadAllText((Resolve-Path "installer/repair_sync.ps1"), (New-Object System.Text.UTF8Encoding($false)))
          foreach ($required in @('ImPuls-File-Manifest.json','ImPuls.exe','ImPuls.pck','File-Matches','Verify-Hash','Download-File','RangeHeaderValue','InfiniteTimeSpan','repair-cache','.part','Game did not exit before timeout')) {
            if ($repair -notmatch [regex]::Escape($required)) { throw "Missing repair marker: $required" }
          }
          if ($repair -match 'ImPuls-PC-Windows-x64\.zip') { throw "Repair runtime must not download the full game archive" }

          $router = Get-Content installer/updater.ps1 -Raw
          foreach ($required in @('repair_sync.ps1','updater_bootstrap.ps1','ImPuls.exe','ImPuls.pck')) {
            if ($router -notmatch [regex]::Escape($required)) { throw "Updater router missing marker: $required" }
          }
          Write-Host "Updater delta + individual file repair policy OK"

      - name: Prepare ImPuls branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/make_icon.py installer/impuls.ico
          if (-not (Test-Path installer/impuls.ico)) { throw "ImPuls ICO missing" }
      - uses: actions/download-artifact@v4
        with:
          name: game-windows
          path: downloaded
      - name: Prepare installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          Copy-Item downloaded/build/windows/* build/windows/ -Recurse -Force
          "build-${{ github.run_number }}" | Set-Content installer/release_tag.txt -Encoding ASCII
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fullVersion = (Get-Content VERSION -Raw).Trim()
          if ($fullVersion -notmatch '^([0-9]+(?:\.[0-9]+){1,3})') { throw "Installer version is not numeric: $fullVersion" }
          $appVersion = $Matches[1]
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyBuildTag=build-${{ github.run_number }}" "/DMyAppVersion=$appVersion" "installer\ImPuls.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path installer/output/ImPuls-Setup.exe)) { throw "Installer output missing" }
      - name: Install candidate and prove installed game starts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP "ImPulsCandidate"
          $currentDir = Join-Path $installDir "current"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "impuls-installed-stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "impuls-installed-stderr.log"
          $godotLog = Join-Path $env:RUNNER_TEMP "impuls-installed-godot.log"

          function Write-InstalledGameDiagnostics {
            Write-Host "===== installed game diagnostics ====="
            Write-Host "InstallDir: $installDir"
            Write-Host "CurrentDir: $currentDir"
            if (Test-Path $stdoutLog) {
              Write-Host "===== stdout ====="
              Get-Content $stdoutLog -Raw -ErrorAction SilentlyContinue
            }
            if (Test-Path $stderrLog) {
              Write-Host "===== stderr ====="
              Get-Content $stderrLog -Raw -ErrorAction SilentlyContinue
            }
            if (Test-Path $godotLog) {
              Write-Host "===== explicit Godot log ====="
              Get-Content $godotLog -Raw -ErrorAction SilentlyContinue
            }
            $godotUserRoot = Join-Path $env:APPDATA "Godot\app_userdata"
            if (Test-Path $godotUserRoot) {
              Get-ChildItem $godotUserRoot -Filter godot.log -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3 |
                ForEach-Object {
                  Write-Host "===== Godot user log: $($_.FullName) ====="
                  Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
                }
            }
            if (Test-Path $currentDir) {
              Write-Host "===== installed current directory ====="
              Get-ChildItem $currentDir -Force | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize
            }
          }

          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          foreach ($log in @($stdoutLog, $stderrLog, $godotLog)) {
            if (Test-Path $log) { Remove-Item $log -Force }
          }

          $installer = (Resolve-Path "installer/output/ImPuls-Setup.exe").Path
          $proc = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          ) -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }

          $exe = Join-Path $currentDir "ImPuls.exe"
          $pck = Join-Path $currentDir "ImPuls.pck"
          if (-not (Test-Path $exe)) { Write-InstalledGameDiagnostics; throw "Installed ImPuls.exe missing" }
          if (-not (Test-Path $pck)) { Write-InstalledGameDiagnostics; throw "Installed ImPuls.pck missing" }

          $game = Start-Process -FilePath $exe -WorkingDirectory $currentDir -ArgumentList @(
            "--headless",
            "--verbose",
            "--log-file", $godotLog,
            "--quit-after", "180"
          ) -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while (-not $game.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
            $game.Refresh()
          }
          if (-not $game.HasExited) {
            Stop-Process -Id $game.Id -Force
            Write-InstalledGameDiagnostics
            throw "Installed game did not exit under --headless --quit-after within 90 seconds"
          }

          $exitCode = $game.ExitCode
          Write-InstalledGameDiagnostics
          if ($exitCode -ne 0) { throw "Installed game exited with code $exitCode" }
          Write-Host "Installed-package startup smoke OK: $installDir"

      - uses: actions/upload-artifact@v4
        with:
          name: ImPuls-Setup
          path: installer/output/ImPuls-Setup.exe
          if-no-files-found: error
