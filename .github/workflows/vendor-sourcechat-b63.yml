name: Vendor source-chat B63 real CC0 skeleton forest monster

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b63.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b63
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 enemy source models
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b63"
          TMP=".sourcechat_b63_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          meta() {
            local name="$1" page="$2" title="$3" download="$4" notes="$5"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $download
          License: CC0 as stated on the source page.
          Notes: $notes
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          mkdir -p "$ROOT/models/oga_skeleton_with_rig"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B63/1.0' "https://opengameart.org/sites/default/files/fgc_skeleton.blend" -o "$ROOT/models/oga_skeleton_with_rig/fgc_skeleton.blend"
          meta "oga_skeleton_with_rig" "https://opengameart.org/content/skeleton-with-rig" "Skeleton with rig" "https://opengameart.org/sites/default/files/fgc_skeleton.blend" "Simple rigged skeleton source."

          mkdir -p "$TMP/forest" "$ROOT/models/oga_forest_monster_rigged_animated"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1800 -A 'ImPuls-CC0-B63/1.0' "https://opengameart.org/sites/default/files/forest-monster.7z" -o "$TMP/forest.7z"
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          7z x -y -o"$TMP/forest" "$TMP/forest.7z" >/dev/null
          chmod -R u+rwX "$TMP/forest" || true
          rsync -a "$TMP/forest/" "$ROOT/models/oga_forest_monster_rigged_animated/"
          meta "oga_forest_monster_rigged_animated" "https://opengameart.org/content/forest-monster" "Forest Monster" "https://opengameart.org/sites/default/files/forest-monster.7z" "Rigged and animated large creature with diffuse, normal and ambient-occlusion maps; source page describes it as ready to use ingame."

          mkdir -p "$TMP/gibs" "$ROOT/models/oga_forest_monster_gibs"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1800 -A 'ImPuls-CC0-B63/1.0' "https://opengameart.org/sites/default/files/forest_monster_gibs.zip" -o "$TMP/gibs.zip"
          unzip -q "$TMP/gibs.zip" -d "$TMP/gibs"
          chmod -R u+rwX "$TMP/gibs" || true
          rsync -a "$TMP/gibs/" "$ROOT/models/oga_forest_monster_gibs/"
          meta "oga_forest_monster_gibs" "https://opengameart.org/content/forest-monster-gibs" "Forest Monster gibs" "https://opengameart.org/sites/default/files/forest_monster_gibs.zip" "CC0 Blend plus OBJ exports of separated body/gib pieces derived from the CC0 Forest Monster source."

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B63 — real CC0 skeleton and Forest Monster enemy sources

          Source-only staging. Nothing is connected to gameplay.

          Includes one rigged skeleton, one rigged/animated Forest Monster and matching separated gibs. Main integration chat should test Godot skeleton/animation import, standardize materials/scale/collisions, and only use gibs if the final destruction/corpse system needs them.
          EOF
          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B63 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B63 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b63
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 skeleton forest monster B63"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
