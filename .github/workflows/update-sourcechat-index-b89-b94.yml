name: Update source-chat staging index through B94

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-sourcechat-index-b89-b94.yml'

permissions:
  contents: write

concurrency:
  group: update-sourcechat-index-b89-b94
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify B89-B94 physical directories and append index
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/staging/sourcechat_b89/models/oga_character_pack_2026
            assets/staging/sourcechat_b89/models/oga_hair_styles_cc0
            assets/staging/sourcechat_b89/models/oga_human_parts_pack_2026
            assets/staging/sourcechat_b89/models/oga_lowpoly_hats
            assets/staging/sourcechat_b90/models/oga_cargo_pants
            assets/staging/sourcechat_b90/models/oga_lowpoly_glasses_29
            assets/staging/sourcechat_b90/models/oga_sneakers
            assets/staging/sourcechat_b90/models/oga_sweatshirt
            assets/staging/sourcechat_b90/models/oga_work_boots
            assets/staging/sourcechat_b91/models/oga_hospital_medical_center_moscow_2025
            assets/staging/sourcechat_b91/models/oga_medical_packaging_1
            assets/staging/sourcechat_b91/models/oga_medical_packaging_2
            assets/staging/sourcechat_b91/models/oga_medical_packaging_3
            assets/staging/sourcechat_b92/models/oga_3td_office_starter_pack
            assets/staging/sourcechat_b92/models/oga_cooking_assets
            assets/staging/sourcechat_b92/models/oga_household_items_86
            assets/staging/sourcechat_b92/models/oga_office_campus_buildings_2026
            assets/staging/sourcechat_b93/models/oga_modular_wooden_docks_176
            assets/staging/sourcechat_b93/models/oga_barrels_10_lyricsz
            assets/staging/sourcechat_b94/models/oga_wood_stuff_84
            assets/staging/sourcechat_b94/models/oga_wooden_furnitures_53
            assets/staging/sourcechat_b94/models/oga_wood_furnitures_2_54
          )
          for d in "${required[@]}"; do
            test -d "$d" || { echo "Missing physical staging directory: $d" >&2; exit 1; }
            test -n "$(find "$d" -type f -print -quit)" || { echo "Empty staging directory: $d" >&2; exit 1; }
          done
          INDEX=assets/staging/SOURCECHAT_INDEX.md
          if ! grep -q '^## B89 —' "$INDEX"; then
            printf '\n' >> "$INDEX"
            echo '' | base64 -d >> "$INDEX"
          fi

      - name: Commit index update with retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/SOURCECHAT_INDEX.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(staging): index physical source batches B89-B94"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
