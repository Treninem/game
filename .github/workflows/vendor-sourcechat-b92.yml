name: Vendor source-chat B92 real CC0 office household cooking

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b92.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b92
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 office household cooking sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b92"
          TMP=".sourcechat_b92_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          meta() {
            local name="$1" page="$2" title="$3" download="$4" notes="$5"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $download
          License: CC0 as stated on the source page.
          Notes: $notes
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_zip() {
            local name="$1" url="$2" tmpname="$3" maxtime="$4"
            mkdir -p "$TMP/$tmpname" "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time "$maxtime" -A 'ImPuls-CC0-B92/1.0' "$url" -o "$TMP/$tmpname.zip"
            unzip -q "$TMP/$tmpname.zip" -d "$TMP/$tmpname"
            chmod -R u+rwX "$TMP/$tmpname" || true
            find "$TMP/$tmpname" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.cs' -o -iname '*.gd' -o -iname '*.unitypackage' \) -delete
            rsync -a "$TMP/$tmpname/" "$ROOT/models/$name/"
          }

          stage_zip "oga_3td_office_starter_pack" "https://opengameart.org/sites/default/files/3TD_Office%20Starter.zip" "office3td" "1800"
          meta "oga_3td_office_starter_pack" \
            "https://opengameart.org/content/3td-office-starter-pack" \
            "3TD Office Starter Pack" \
            "https://opengameart.org/sites/default/files/3TD_Office%20Starter.zip" \
            "CC0 office source set with desks, wall dividers, cabinets, drawers, filing cabinet, storage and required textures."

          stage_zip "oga_household_items_86" "https://opengameart.org/sites/default/files/HouseHold%20Props%20001.zip" "household86" "1800"
          meta "oga_household_items_86" \
            "https://opengameart.org/content/86-household-items" \
            "86 Household items" \
            "https://opengameart.org/sites/default/files/HouseHold%20Props%20001.zip" \
            "CC0 household prop library in FBX/OBJ with diffuse textures. Source comments note some UVs may need repair; main chat should audit before promotion."

          stage_zip "oga_cooking_assets" "https://opengameart.org/sites/default/files/cooking_assets.zip" "cooking" "1800"
          meta "oga_cooking_assets" \
            "https://opengameart.org/content/cooking-assets" \
            "Cooking Assets" \
            "https://opengameart.org/sites/default/files/cooking_assets.zip" \
            "CC0 low-poly cooking library with utensils, bowls, measuring gear, ovens, refrigerators, spoons, cups and more; FBX/GLB with one atlas and four materials."

          stage_zip "oga_office_campus_buildings_2026" "https://opengameart.org/sites/default/files/office.zip" "office2026" "1800"
          meta "oga_office_campus_buildings_2026" \
            "https://opengameart.org/content/officecampus-buildings-and-restaurant" \
            "Office/campus buildings and restaurant" \
            "https://opengameart.org/sites/default/files/office.zip" \
            "2026 CC0 building set with several office/campus height/material variants plus a restaurant building; base models around 2000 verts/tris."

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.cs' -o -iname '*.gd' -o -iname '*.unitypackage' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B92 — real CC0 office, household and cooking sources

          Source-only staging. Nothing is wired into gameplay.

          Main integration chat should select only the needed interior props and office/campus structures, normalize materials/scale/collisions and repair UVs if required. These source libraries complement the newer B77 furniture/home packs rather than replacing them wholesale.
          EOF

          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B92 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B92 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b92
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 office household cooking B92"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
