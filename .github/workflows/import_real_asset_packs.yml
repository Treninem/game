name: Import verified real asset packs

on:
  push:
    paths:
      - '.github/workflows/import_real_asset_packs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-packs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified CC0 packs
        shell: bash
        run: |
          set -euo pipefail

          SG6="assets/source_packs/opengameart/system_g6"
          QUA="assets/source_packs/opengameart/quaternius"
          KEN="assets/source_packs/opengameart/kenney"
          OGA="assets/source_packs/opengameart/individual_animals"

          mkdir -p \
            "$SG6/medieval_tools" \
            "$SG6/medieval_crafting_stations" \
            "$SG6/medieval_props" \
            "$SG6/medieval_buildings" \
            "$SG6/medieval_weapons" \
            "$QUA/farm_animals" \
            "$QUA/animal_pack_vol2" \
            "$KEN/cube_pets" \
            "$OGA/rooster" \
            "$OGA/chicken" \
            "$OGA/duck" \
            "$OGA/rabbit" \
            "$OGA/boar" \
            "$OGA/bear" \
            "$OGA/pig" \
            "$OGA/goat" \
            "$OGA/pigeon"

          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/medieval_tools_pack.7z' -o "$SG6/medieval_tools/medieval_tools_pack.7z"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/medieval_crafting_stations_pack.7z' -o "$SG6/medieval_crafting_stations/medieval_crafting_stations_pack.7z"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/medieval_props_pack.7z' -o "$SG6/medieval_props/medieval_props_pack.7z"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/medieval_buildings_pack.7z' -o "$SG6/medieval_buildings/medieval_buildings_pack.7z"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/medieval_weapon_pack.7z' -o "$SG6/medieval_weapons/medieval_weapon_pack.7z"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/Farm%20Animals%20by%20%40Quaternius.zip' -o "$QUA/farm_animals/Farm_Animals_by_Quaternius.zip"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/Animal%20Pack%20Vol.2%20by%20%40Quaternius.zip' -o "$QUA/animal_pack_vol2/Animal_Pack_Vol2_by_Quaternius.zip"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/kenney_cube-pets_1.0_0.zip' -o "$KEN/cube_pets/kenney_cube-pets_1.0.zip"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/rooster.zip' -o "$OGA/rooster/rooster.zip"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/chicken_0.zip' -o "$OGA/chicken/chicken.zip"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/duck6.blend' -o "$OGA/duck/duck6.blend"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/rabbit.blend' -o "$OGA/rabbit/rabbit.blend"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/rabbit-FBX.7z' -o "$OGA/rabbit/rabbit-FBX.7z"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/boar_0.blend' -o "$OGA/boar/boar.blend"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/Bear.7z' -o "$OGA/bear/Bear.7z"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/pig_0.blend' -o "$OGA/pig/pig.blend"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/goatlowrez.obj' -o "$OGA/goat/goatlowrez.obj"
          curl -L --fail --retry 4 --retry-delay 3 'https://opengameart.org/sites/default/files/genuinely-my-pigeon-extended-furthur.blend' -o "$OGA/pigeon/pigeon.blend"

          find assets/source_packs/opengameart -type f \
            \( -name '*.7z' -o -name '*.zip' -o -name '*.blend' -o -name '*.obj' -o -name '*.fbx' -o -name '*.glb' -o -name '*.gltf' \) \
            -size 0 -print -quit | grep -q . && { echo 'ERROR: zero-byte source asset detected'; exit 1; } || true

          find assets/source_packs/opengameart -type f \
            \( -name '*.7z' -o -name '*.zip' -o -name '*.blend' -o -name '*.obj' -o -name '*.fbx' -o -name '*.glb' -o -name '*.gltf' \) \
            -print0 | sort -z | xargs -0 sha256sum > assets/source_packs/opengameart/SHA256SUMS.txt

      - name: Write provenance and license metadata
        shell: bash
        run: |
          set -euo pipefail

          SG6="assets/source_packs/opengameart/system_g6"
          QUA="assets/source_packs/opengameart/quaternius"
          KEN="assets/source_packs/opengameart/kenney"
          OGA="assets/source_packs/opengameart/individual_animals"

          cat > assets/source_packs/opengameart/README.md <<'EOF'
          # Verified CC0 source packs

          Original downloadable archives/models mirrored for the main game-development chat.
          This folder is staging/source storage only: no scene, script, project-setting or runtime integration is performed by the research chat.
          Every source below is mirrored only after its individual source page explicitly lists CC0.
          EOF

          cat > "$SG6/LICENSE.txt" <<'EOF'
          License: CC0 1.0 / public-domain dedication.
          Author/uploader: System G6 (Qoma).
          Source: OpenGameArt.
          Attribution not required; provenance retained voluntarily.
          EOF

          cat > "$SG6/medieval_tools/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/medieval-tools-pack
          License: CC0
          Contents: 12 low-poly tools: pitchfork, shovel, hoe, sickle, axe, scythe, rake, broom, saws, pickaxe, hammer.
          EOF
          cat > "$SG6/medieval_crafting_stations/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/medieval-crafting-stations-pack
          License: CC0
          Contents: 3 crafting stations, low-poly, textured.
          EOF
          cat > "$SG6/medieval_props/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/medieval-props-pack
          License: CC0
          Contents: 19 settlement/interior props including cart, trough, hay, logs, chest, bed, crates, barrel and hitching post.
          EOF
          cat > "$SG6/medieval_buildings/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/medieval-buildings-pack
          License: CC0
          Contents: 18 building/environment props including houses, hall, well, walls, gates, watch tower, doors, trees and pine.
          EOF
          cat > "$SG6/medieval_weapons/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/medieval-weapon-pack
          License: CC0
          Contents: 14 low-poly weapons/items including bow, crossbow, quiver, sword, dagger, axe, mace, shield, staff, wand and grimoire.
          EOF

          cat > "$QUA/LICENSE.txt" <<'EOF'
          License: CC0 1.0 / public-domain dedication.
          Author/uploader: Quaternius.
          Source: OpenGameArt mirror of Quaternius packs.
          EOF
          cat > "$QUA/farm_animals/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/lowpoly-animated-farm-animal-pack
          License: CC0
          Author: Quaternius
          Contents: animated farm animal pack; pig, cow, horse, llama, pug/dog and sheep; Blend/OBJ/FBX included.
          EOF
          cat > "$QUA/animal_pack_vol2/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/animated-animales-low-poly
          License: CC0
          Author: Quaternius
          Contents: animated wolf, eagle, dog, cat and piranha.
          EOF

          cat > "$KEN/LICENSE.txt" <<'EOF'
          License: CC0 1.0 / public-domain dedication.
          Author/uploader: Kenney.
          Source: OpenGameArt/Kenney.
          EOF
          cat > "$KEN/cube_pets/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/cube-pets
          License: CC0
          Author: Kenney
          Contents: 16 animated cubic pets; FBX, OBJ and glTF models.
          EOF

          cat > "$OGA/rooster/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/rooster-animated
          License: CC0
          Author: CDmir / TinyWorlds
          Notes: rigged and animated; diffuse + normal map; source marks it ready for game use.
          EOF
          cat > "$OGA/chicken/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/chicken-animated
          License: CC0
          Author: CDmir / TinyWorlds
          Notes: rigged and animated; diffuse + normal map; source marks it ready for game use.
          EOF
          cat > "$OGA/duck/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/rigged-duck
          License: CC0
          Author: weirdybeardyman
          Notes: rigged duck with waddle and peck animations.
          EOF
          cat > "$OGA/rabbit/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/rabbit-0
          License: CC0
          Author: CDmir / TinyWorlds
          Notes: rigged and animated; diffuse + normal map; Blender + FBX archive.
          EOF
          cat > "$OGA/boar/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/boar
          License: CC0
          Author: Teh_Bucket
          Notes: rigged, textured, walk + attack animations, approximately 1k triangles.
          EOF
          cat > "$OGA/bear/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/white-bear-low-poly
          License: CC0
          Author: STKRudy85
          Notes: textured low-poly bear; not rigged.
          EOF
          cat > "$OGA/pig/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/low-poly-pig-0
          License: CC0
          Author: xTerryx
          Notes: low-poly Blender source model.
          EOF
          cat > "$OGA/goat/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/goat
          License: CC0
          Author: Copabrangorandel
          File: goatlowrez.obj
          Notes: one-object goat mesh; no rig or textures; source explicitly states CC0 intended.
          EOF
          cat > "$OGA/pigeon/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/low-poly-3d-pigeon-model-rigged-animated-untextured
          License: CC0
          Author: mujtaba-io
          File: pigeon.blend
          Notes: low-poly pigeon, rigged and animated, untextured.
          EOF

      - name: Commit downloaded packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source_packs/opengameart
          if git diff --cached --quiet; then echo "No asset changes to commit."; exit 0; fi
          git commit -m "assets: vendor verified CC0 goat and pigeon sources"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "ERROR: could not push source-pack commit after retries"
          exit 1
