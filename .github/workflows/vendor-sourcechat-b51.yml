name: Vendor source-chat B51 real CC0 medieval detail props

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b51.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b51
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 medieval detail props
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b51"
          TMP=".sourcechat_b51_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          meta() {
            local name="$1" page="$2" title="$3" download="$4" notes="$5"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $download
          License: CC0 as stated on the source page.
          Notes: $notes
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_file() {
            local name="$1" url="$2" page="$3" title="$4" filename="$5" notes="$6"
            mkdir -p "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B51/1.0' "$url" -o "$ROOT/models/$name/$filename"
            meta "$name" "$page" "$title" "$url" "$notes"
          }

          stage_zip() {
            local name="$1" url="$2" page="$3" title="$4" notes="$5"
            mkdir -p "$TMP/$name" "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B51/1.0' "$url" -o "$TMP/$name.zip"
            unzip -q "$TMP/$name.zip" -d "$TMP/$name"
            chmod -R u+rwX "$TMP/$name" || true
            rsync -a "$TMP/$name/" "$ROOT/models/$name/"
            meta "$name" "$page" "$title" "$url" "$notes"
          }

          stage_file "oga_medieval_benches" "https://opengameart.org/sites/default/files/medievalbenchesexport.blend" "https://opengameart.org/content/medieval-benches" "Medieval Benches" "medievalbenchesexport.blend" "Wood/stone bench source; source page lists 1024 verts / 852 tris."
          stage_file "oga_medieval_cage" "https://opengameart.org/sites/default/files/medievalcage.blend" "https://opengameart.org/content/medieval-cage" "Medieval Cage" "medievalcage.blend" "Low-poly metal/rust cage; source page lists 200 verts / 244 tris."
          stage_file "oga_medieval_boat" "https://opengameart.org/sites/default/files/medievalboatexport.blend" "https://opengameart.org/content/medieval-boat" "Medieval Boat" "medievalboatexport.blend" "Rowboat source; source page lists 188 verts / 356 tris."
          stage_zip "oga_cemetery_gravestones" "https://opengameart.org/sites/default/files/cemetery.zip" "https://opengameart.org/content/cemetery" "Cemetery" "Six untextured gravestone source models."
          stage_file "oga_open_books" "https://opengameart.org/sites/default/files/booksexport.blend" "https://opengameart.org/content/open-books" "Open Books" "booksexport.blend" "Source page states all 16 books from the related closed-book set have open versions in this Blend file."

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B51 — real CC0 medieval detail props

          Source-only staging. Nothing is connected to gameplay.

          Includes benches, cage, rowboat, cemetery gravestones and open books. Main integration chat should inspect texture links/materials, standardize scale and collisions, and promote these as authored detail props only where they improve the final scene.
          EOF
          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B51 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B51 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b51
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 medieval detail props B51"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
