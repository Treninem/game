name: Update source-chat staging index through B88

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-sourcechat-index-b86-b88.yml'

permissions:
  contents: write

concurrency:
  group: update-sourcechat-index-b86-b88
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify B86-B88 physical directories and append index
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/staging/sourcechat_b86/models/kenney_mini_market
            assets/staging/sourcechat_b86/models/oga_medieval_tools_12
            assets/staging/sourcechat_b86/models/oga_medieval_props_pack_1_daniel
            assets/staging/sourcechat_b86/models/oga_medieval_props_pack_2_daniel
            assets/staging/sourcechat_b86/models/oga_medieval_props_pack_3_daniel
            assets/staging/sourcechat_b87/models/quaternius_lowpoly_crops_100plus
            assets/staging/sourcechat_b87/models/oga_low_poly_corn
            assets/staging/sourcechat_b87/models/oga_hay_bale_lowpoly
            assets/staging/sourcechat_b87/models/oga_basic_voxel_farm
            assets/staging/sourcechat_b88/models/oga_sewer_tunnels_lowres_2026
            assets/staging/sourcechat_b88/models/oga_mines_and_caves_178
            assets/staging/sourcechat_b88/models/oga_free_mine_assets_pack
            assets/staging/sourcechat_b88/models/oga_concrete_pipes
          )
          for d in "${required[@]}"; do
            test -d "$d" || { echo "Missing physical staging directory: $d" >&2; exit 1; }
            test -n "$(find "$d" -type f -print -quit)" || { echo "Empty staging directory: $d" >&2; exit 1; }
          done

          INDEX=assets/staging/SOURCECHAT_INDEX.md
          if grep -q '^## B86 —' "$INDEX"; then
            echo 'B86-B88 already indexed; no append needed.'
            exit 0
          fi

          cat >> "$INDEX" <<'EOF'

## B86 — market / medieval tools / settlement props

Status: **READY / PHYSICAL**
Path: `assets/staging/sourcechat_b86/models/`

- `kenney_mini_market/`
- `oga_medieval_tools_12/`
- `oga_medieval_props_pack_1_daniel/`
- `oga_medieval_props_pack_2_daniel/`
- `oga_medieval_props_pack_3_daniel/`

Recommended use: village markets, workshops, farms, taverns, storage and general settlement dressing. Main chat should normalize scale/materials and promote coherent prop subsets instead of importing entire packs blindly.

## B87 — crops / corn / hay / farm source models

Status: **READY / PHYSICAL**
Path: `assets/staging/sourcechat_b87/models/`

- `quaternius_lowpoly_crops_100plus/` — 100+ low-poly crops with multiple growth stages.
- `oga_low_poly_corn/`
- `oga_hay_bale_lowpoly/`
- `oga_basic_voxel_farm/`

Recommended use: fields, farms, crop progression, harvest scenes and rural dressing. Main chat should select art-direction-compatible crops and map growth stages to gameplay only after production review.

## B88 — sewers / mines / caves / concrete pipes

Status: **READY / PHYSICAL**
Path: `assets/staging/sourcechat_b88/models/`

- `oga_sewer_tunnels_lowres_2026/`
- `oga_mines_and_caves_178/`
- `oga_free_mine_assets_pack/`
- `oga_concrete_pipes/`

Recommended use: sewers, underground service tunnels, mines, caves, drainage and industrial underground spaces. Combine selectively with B21/B23/B76; deduplicate overlapping mine/cave pieces and keep only the best production variants.
EOF

      - name: Commit index update with retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/SOURCECHAT_INDEX.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(staging): index physical source batches B86-B88"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
