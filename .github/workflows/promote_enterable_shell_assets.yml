name: Promote Enterable Building Shell Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote_enterable_shell_assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impuls-promote-enterable-shell
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            assets/staging/sourcechat_b47/models/quaternius_medieval_village_megakit_standard
            assets/production/medieval

      - name: Promote selected CC0 shell assets and migrate runtime paths
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="assets/staging/sourcechat_b47/models/quaternius_medieval_village_megakit_standard"
          SRC="$SOURCE/glTF"
          TARGET="assets/production/medieval/building_shell"
          mkdir -p "$TARGET"

          FILES=(
            Door_1_Flat.gltf
            Door_1_Flat.bin
            Roof_RoundTiles_8x8.gltf
            Roof_RoundTiles_8x8.bin
            T_WoodTrim_Normal.png
            T_WoodTrim_BaseColor.png
            T_WoodTrim_Roughness.png
            T_RoundTiles_Normal.png
            T_RoundTiles_BaseColor.png
            T_RoundTiles_Roughness.png
          )

          for file in "${FILES[@]}"; do
            test -s "$SRC/$file"
            cp "$SRC/$file" "$TARGET/$file"
          done
          test -s "$SOURCE/LICENSE.txt"
          cp "$SOURCE/LICENSE.txt" "$TARGET/QUATERNIUS_CC0_LICENSE.txt"
          cp "$SOURCE/SOURCE.md" "$TARGET/UPSTREAM_SOURCE.md"

          cat > "$TARGET/SOURCE.md" <<'EOF'
          # ImPuls production enterable-building shell assets

          Runtime subset promoted from the already staged Quaternius Medieval Village MegaKit Standard pack.

          Selected assets:
          - Door_1_Flat.gltf + Door_1_Flat.bin
          - Roof_RoundTiles_8x8.gltf + Roof_RoundTiles_8x8.bin
          - T_WoodTrim_Normal.png
          - T_WoodTrim_BaseColor.png
          - T_WoodTrim_Roughness.png
          - T_RoundTiles_Normal.png
          - T_RoundTiles_BaseColor.png
          - T_RoundTiles_Roughness.png

          License: CC0 1.0 Universal. The upstream license is copied as QUATERNIUS_CC0_LICENSE.txt.

          These files are the game-facing production copies. Runtime scripts must not reference assets/staging or sourcechat paths.
          EOF

          sha256sum "$TARGET"/Door_1_Flat.gltf "$TARGET"/Door_1_Flat.bin \
            "$TARGET"/Roof_RoundTiles_8x8.gltf "$TARGET"/Roof_RoundTiles_8x8.bin \
            "$TARGET"/T_WoodTrim_Normal.png "$TARGET"/T_WoodTrim_BaseColor.png \
            "$TARGET"/T_WoodTrim_Roughness.png "$TARGET"/T_RoundTiles_Normal.png \
            "$TARGET"/T_RoundTiles_BaseColor.png "$TARGET"/T_RoundTiles_Roughness.png \
            > "$TARGET/SHA256SUMS.txt"

          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/enterable_building.gd")
          text = script.read_text(encoding="utf-8")
          old_door = 'res://assets/staging/sourcechat_b47/models/quaternius_medieval_village_megakit_standard/glTF/Door_1_Flat.gltf'
          old_roof = 'res://assets/staging/sourcechat_b47/models/quaternius_medieval_village_megakit_standard/glTF/Roof_RoundTiles_8x8.gltf'
          new_door = 'res://assets/production/medieval/building_shell/Door_1_Flat.gltf'
          new_roof = 'res://assets/production/medieval/building_shell/Roof_RoundTiles_8x8.gltf'
          if old_door in text:
              text = text.replace(old_door, new_door)
          if old_roof in text:
              text = text.replace(old_roof, new_roof)
          if "assets/staging" in "\n".join(line for line in text.splitlines() if "DOOR_SCENE" in line or "ROOF_SCENE" in line):
              raise SystemExit("enterable building still references staging shell assets")
          if new_door not in text or new_roof not in text:
              raise SystemExit("production shell paths were not installed")
          script.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/windows-build.yml")
          stable = workflow.read_text(encoding="utf-8")
          build_marker = "            assets/audio\n            assets/branding\n"
          if "            assets/production\n" not in stable:
              if build_marker not in stable:
                  raise SystemExit("stable sparse-checkout marker changed")
              stable = stable.replace(build_marker, "            assets/audio\n            assets/production\n            assets/branding\n", 1)
          workflow.write_text(stable, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET" scripts/enterable_building.gd .github/workflows/windows-build.yml
          if git diff --cached --quiet; then
            echo "Production shell and runtime paths already up to date."
            exit 0
          fi
          git commit -m "fix(world): load enterable shell from production assets"
          git pull --rebase origin main
          git push origin HEAD:main
