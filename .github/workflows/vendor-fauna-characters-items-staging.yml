name: Vendor CC0 fauna characters items staging

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-fauna-characters-items-staging.yml'

permissions:
  contents: write

concurrency:
  group: vendor-fauna-characters-items-staging
  cancel-in-progress: false

jobs:
  vendor-fauna-characters-items:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified CC0 packs
        shell: bash
        run: |
          set -euo pipefail
          TMP=".fauna_chars_items_tmp"
          rm -rf "$TMP"
          mkdir -p "$TMP"

          write_meta() {
            local target="$1" key="$2" source="$3" download="$4" notes="$5"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Source page: $source
          Download used: $download
          License: CC0 1.0 Universal as stated by the source page.
          Status: SOURCE-ONLY STAGING — not gameplay-integrated by this workflow.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal

          Source page identifies this pack as CC0 / public-domain dedication.
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          Preserve SOURCE.md with staged files.
          EOF
          }

          import_zip() {
            local key="$1" url="$2" source="$3" target="$4" notes="$5"
            local work="$TMP/$key"
            rm -rf "$target" "$work"
            mkdir -p "$target" "$work/archive"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 420 \
              -A 'ImPuls-CC0-Staging/1.0' "$url" -o "$work/pack.zip"
            unzip -q "$work/pack.zip" -d "$work/archive"
            rsync -a --prune-empty-dirs \
              --include='*/' \
              --include='*.glb' --include='*.GLB' \
              --include='*.gltf' --include='*.GLTF' \
              --include='*.bin' --include='*.BIN' \
              --include='*.fbx' --include='*.FBX' \
              --include='*.obj' --include='*.OBJ' \
              --include='*.mtl' --include='*.MTL' \
              --include='*.blend' --include='*.BLEND' \
              --include='*.dae' --include='*.DAE' \
              --include='*.png' --include='*.PNG' \
              --include='*.jpg' --include='*.JPG' \
              --include='*.jpeg' --include='*.JPEG' \
              --include='*.webp' --include='*.WEBP' \
              --include='*.svg' --include='*.SVG' \
              --include='*.json' --include='*.JSON' \
              --include='*.txt' --include='*.TXT' \
              --include='*.md' --include='*.MD' \
              --exclude='*' "$work/archive/" "$target/"
            write_meta "$target" "$key" "$source" "$url" "$notes"
          }

          import_zip "quaternius_animal_pack_vol2" \
            "https://opengameart.org/sites/default/files/Animal%20Pack%20Vol.2%20by%20%40Quaternius.zip" \
            "https://opengameart.org/content/animated-animales-low-poly" \
            "assets/staging/animals/quaternius_animal_pack_vol2" \
            "Animated wolf, eagle, dog, cat and piranha; CC0 source pack."

          import_zip "quaternius_animated_fish" \
            "https://opengameart.org/sites/default/files/Animated%20Fish%20Pack%20by%20%40Quaternius.zip" \
            "https://opengameart.org/content/animated-fish" \
            "assets/staging/animals/quaternius_animated_fish" \
            "Seven animated aquatic species with Blender/OBJ/FBX source formats."

          import_zip "quaternius_animals_pack_5" \
            "https://opengameart.org/sites/default/files/Animals%20Pack%20by%20Quaternius.zip" \
            "https://opengameart.org/content/5-low-poly-animals" \
            "assets/staging/animals/quaternius_animals_pack_5" \
            "Five additional low-poly animated animals; CC0."

          import_zip "quaternius_animated_human" \
            "https://opengameart.org/sites/default/files/Animated%20Human%20by%20%40Quaternius.zip" \
            "https://opengameart.org/content/animated-human-low-poly" \
            "assets/staging/characters/quaternius_animated_human" \
            "Animated humanoid with idle, jump, punch, run, walk, work and death animations."

          import_zip "quaternius_universal_animation_library_2_standard" \
            "https://opengameart.org/sites/default/files/universal_animation_library_2standard.zip" \
            "https://opengameart.org/content/universal-animation-library-2" \
            "assets/staging/animations/quaternius_universal_animation_library_2_standard" \
            "Standard CC0 Universal Animation Library 2; 130+ animation library source page, Godot-compatible universal humanoid rig."

          import_zip "kenney_animated_characters_protagonists" \
            "https://www.kenney.nl/media/pages/assets/animated-characters-protagonists/608191acc4-1774773108/kenney_animated-characters-protagonists.zip" \
            "https://www.kenney.nl/assets/animated-characters-protagonists" \
            "assets/staging/characters/kenney_animated_characters_protagonists" \
            "Eight CC0 animated 3D protagonist character files."

          import_zip "kenney_animated_characters_retro" \
            "https://www.kenney.nl/media/pages/assets/animated-characters-retro/93305a3c49-1774772819/kenney_animated-characters-retro.zip" \
            "https://www.kenney.nl/assets/animated-characters-retro" \
            "assets/staging/characters/kenney_animated_characters_retro" \
            "Eight CC0 animated 3D retro survivor/zombie character files."

          import_zip "kenney_generic_items" \
            "https://www.kenney.nl/media/pages/assets/generic-items/96b9087204-1677667000/kenney_generic-items.zip" \
            "https://www.kenney.nl/assets/generic-items" \
            "assets/staging/items/kenney_generic_items" \
            "160 CC0 item/tool/household graphics for inventory, crafting and UI references."

          import_zip "kenney_blaster_kit" \
            "https://kenney.nl/media/pages/assets/blaster-kit/261d80a716-1753959510/kenney_blaster-kit_2.1.zip" \
            "https://kenney.nl/assets/blaster-kit" \
            "assets/staging/items/kenney_blaster_kit" \
            "40 CC0 3D weapon/target/crate/throwable assets with animation/variations."

          rm -rf "$TMP"

          cat > assets/staging/animals/FAUNA_STAGING_MANIFEST.md <<'EOF'
          # Fauna source-only staging

          Real CC0 animal/fish packs for the main integration chat. No gameplay integration is performed here.
          EOF

          mkdir -p assets/staging/characters assets/staging/animations assets/staging/items
          cat > assets/staging/characters/CHARACTER_STAGING_MANIFEST.md <<'EOF'
          # Character source-only staging

          Real CC0 humanoid/character packs for the main integration chat. No scenes/scripts/project settings are modified.
          EOF
          cat > assets/staging/animations/ANIMATION_STAGING_MANIFEST.md <<'EOF'
          # Animation source-only staging

          Real CC0 animation libraries for retargeting by the main integration chat.
          EOF
          cat > assets/staging/items/ITEM_STAGING_MANIFEST.md <<'EOF'
          # Item source-only staging

          Real CC0 item/tool/weapon source packs for the main integration chat.
          EOF

      - name: Commit staged assets back to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/animals assets/staging/characters assets/staging/animations assets/staging/items
          if git diff --cached --quiet; then
            echo "No staging changes to commit."
            exit 0
          fi
          git commit -m "assets(staging): add CC0 fauna characters animations and items"
          git pull --rebase origin main
          git push origin HEAD:main
