name: Vendor CC0 fauna characters items staging

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-fauna-characters-items-staging.yml'

permissions:
  contents: write

concurrency:
  group: vendor-fauna-characters-items-staging
  cancel-in-progress: false

jobs:
  vendor-fauna-characters-items:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging areas
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            assets/staging/animals
            assets/staging/characters
            assets/staging/animations
            assets/staging/items
          sparse-checkout-cone-mode: true

      - name: Download verified CC0 packs
        shell: bash
        run: |
          set -u
          TMP=".fauna_chars_items_tmp"
          FAILS="$TMP/FAILED.txt"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          : > "$FAILS"

          meta() {
            local target="$1" key="$2" source="$3" url="$4" notes="$5" format="$6"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Source page: $source
          Download used: $url
          License: CC0 1.0 Universal as stated by the source page.
          Status: SOURCE-ONLY STAGING — not gameplay-integrated.
          Canonical staged format: $format.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          Preserve SOURCE.md with staged files.
          EOF
          }

          get_zip() {
            local key="$1" url="$2" work="$3"
            if ! curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-Staging/1.0' "$url" -o "$work/pack.zip"; then
              echo "$key | download failed | $url" >> "$FAILS"
              return 1
            fi
            if ! unzip -q "$work/pack.zip" -d "$work/archive"; then
              echo "$key | unzip failed | $url" >> "$FAILS"
              return 1
            fi
          }

          import_best3d() {
            local key="$1" url="$2" source="$3" target="$4" notes="$5"
            local work="$TMP/$key" format=""
            rm -rf "$target" "$work"
            mkdir -p "$target" "$work/archive"
            get_zip "$key" "$url" "$work" || { rm -rf "$target" "$work"; return 0; }
            if find "$work/archive" -type f \( -iname '*.glb' -o -iname '*.gltf' \) -print -quit | grep -q .; then
              format="glTF/GLB"
              rsync -a --prune-empty-dirs --include='*/' --include='*.glb' --include='*.GLB' --include='*.gltf' --include='*.GLTF' --include='*.bin' --include='*.BIN' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.txt' --include='*.TXT' --include='*.json' --include='*.JSON' --exclude='*' "$work/archive/" "$target/"
            elif find "$work/archive" -type f -iname '*.fbx' -print -quit | grep -q .; then
              format="FBX"
              rsync -a --prune-empty-dirs --include='*/' --include='*.fbx' --include='*.FBX' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.txt' --include='*.TXT' --include='*.json' --include='*.JSON' --exclude='*' "$work/archive/" "$target/"
            elif find "$work/archive" -type f -iname '*.obj' -print -quit | grep -q .; then
              format="OBJ"
              rsync -a --prune-empty-dirs --include='*/' --include='*.obj' --include='*.OBJ' --include='*.mtl' --include='*.MTL' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.txt' --include='*.TXT' --include='*.json' --include='*.JSON' --exclude='*' "$work/archive/" "$target/"
            else
              format="Blend"
              rsync -a --prune-empty-dirs --include='*/' --include='*.blend' --include='*.BLEND' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.txt' --include='*.TXT' --include='*.json' --include='*.JSON' --exclude='*' "$work/archive/" "$target/"
            fi
            if [ -z "$(find "$target" -type f -print -quit)" ]; then
              echo "$key | no canonical files selected | $url" >> "$FAILS"
              rm -rf "$target"
              return 0
            fi
            meta "$target" "$key" "$source" "$url" "$notes" "$format"
          }

          import_generic() {
            local key="$1" url="$2" source="$3" target="$4" notes="$5"
            local work="$TMP/$key"
            rm -rf "$target" "$work"
            mkdir -p "$target" "$work/archive"
            get_zip "$key" "$url" "$work" || { rm -rf "$target" "$work"; return 0; }
            rsync -a --prune-empty-dirs --include='*/' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.svg' --include='*.SVG' --include='*.json' --include='*.JSON' --include='*.txt' --include='*.TXT' --exclude='*' "$work/archive/" "$target/"
            if [ -z "$(find "$target" -type f -print -quit)" ]; then
              echo "$key | no generic files selected | $url" >> "$FAILS"
              rm -rf "$target"
              return 0
            fi
            meta "$target" "$key" "$source" "$url" "$notes" "PNG/SVG"
          }

          import_best3d "quaternius_animal_pack_vol2" "https://opengameart.org/sites/default/files/Animal%20Pack%20Vol.2%20by%20%40Quaternius.zip" "https://opengameart.org/content/animated-animales-low-poly" "assets/staging/animals/quaternius_animal_pack_vol2" "Animated wolf, eagle, dog, cat and piranha."
          import_best3d "quaternius_animated_fish" "https://opengameart.org/sites/default/files/Animated%20Fish%20Pack%20by%20%40Quaternius.zip" "https://opengameart.org/content/animated-fish" "assets/staging/animals/quaternius_animated_fish" "Seven animated aquatic species."
          import_best3d "quaternius_animals_pack_5" "https://opengameart.org/sites/default/files/Animals%20Pack%20by%20Quaternius.zip" "https://opengameart.org/content/5-low-poly-animals" "assets/staging/animals/quaternius_animals_pack_5" "Five additional low-poly animals."
          import_best3d "quaternius_animated_human" "https://opengameart.org/sites/default/files/Animated%20Human%20by%20%40Quaternius_0.zip" "https://opengameart.org/content/animated-human-low-poly" "assets/staging/characters/quaternius_animated_human" "Idle, jump, punch, run, walk, work and death animations."
          import_best3d "quaternius_animated_characters_50plus" "https://opengameart.org/sites/default/files/ultimate_animated_character_pack_by_quaternius.zip" "https://opengameart.org/content/animated-characters-pack" "assets/staging/characters/quaternius_animated_characters_50plus" "50+ animated humans, elves, zombies and other characters."
          import_best3d "quaternius_universal_animation_library_2_standard" "https://opengameart.org/sites/default/files/universal_animation_library_2standard.zip" "https://opengameart.org/content/universal-animation-library-2" "assets/staging/animations/quaternius_universal_animation_library_2_standard" "130+ universal humanoid animations compatible with Godot retargeting."
          import_best3d "kenney_animated_characters_protagonists" "https://www.kenney.nl/media/pages/assets/animated-characters-protagonists/608191acc4-1774773108/kenney_animated-characters-protagonists.zip" "https://www.kenney.nl/assets/animated-characters-protagonists" "assets/staging/characters/kenney_animated_characters_protagonists" "Eight animated protagonist files."
          import_best3d "kenney_animated_characters_retro" "https://www.kenney.nl/media/pages/assets/animated-characters-retro/93305a3c49-1774772819/kenney_animated-characters-retro.zip" "https://www.kenney.nl/assets/animated-characters-retro" "assets/staging/characters/kenney_animated_characters_retro" "Eight animated retro survivor/zombie files."
          import_generic "kenney_generic_items" "https://www.kenney.nl/media/pages/assets/generic-items/96b9087204-1677667000/kenney_generic-items.zip" "https://www.kenney.nl/assets/generic-items" "assets/staging/items/kenney_generic_items" "160 generic item/tool/household graphics."
          import_best3d "kenney_blaster_kit" "https://kenney.nl/media/pages/assets/blaster-kit/261d80a716-1753959510/kenney_blaster-kit_2.1.zip" "https://kenney.nl/assets/blaster-kit" "assets/staging/items/kenney_blaster_kit" "40 3D blaster, target, crate and throwable assets."

          mkdir -p assets/staging/animals assets/staging/characters assets/staging/animations assets/staging/items
          cp "$FAILS" assets/staging/animals/FAUNA_CHARACTER_DOWNLOAD_FAILURES.txt
          printf '# Fauna source-only staging\nReal CC0 animal/fish sources for the main integration chat.\n' > assets/staging/animals/FAUNA_STAGING_MANIFEST.md
          printf '# Character source-only staging\nReal CC0 humanoid sources for the main integration chat.\n' > assets/staging/characters/CHARACTER_STAGING_MANIFEST.md
          printf '# Animation source-only staging\nReal CC0 retargetable animation sources for the main integration chat.\n' > assets/staging/animations/ANIMATION_STAGING_MANIFEST.md
          printf '# Item source-only staging\nReal CC0 item/tool/weapon sources for the main integration chat.\n' > assets/staging/items/ITEM_STAGING_MANIFEST.md
          rm -rf "$TMP"

      - name: Commit with concurrent-push retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/animals assets/staging/characters assets/staging/animations assets/staging/items
          if git diff --cached --quiet; then
            echo "No staging changes to commit."
            exit 0
          fi
          git commit -m "assets(staging): add canonical CC0 fauna characters animations and items"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --depth=1 origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
