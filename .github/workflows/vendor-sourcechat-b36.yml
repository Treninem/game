name: Vendor source-chat B36 real CC0 RPG characters monsters items

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b36.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b36
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 RPG characters monsters items
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b36"
          TMP=".sourcechat_b36_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"
          stage_zip() {
            local name="$1" url="$2" page="$3" title="$4"
            mkdir -p "$TMP/$name" "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B36/1.0' "$url" -o "$TMP/$name.zip"
            unzip -q "$TMP/$name.zip" -d "$TMP/$name"
            rsync -a "$TMP/$name/" "$ROOT/models/$name/"
            find "$ROOT/models/$name" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }
          stage_zip "quaternius_rpg_characters" "https://opengameart.org/sites/default/files/rpg_characters_-_nov_2020.zip" "https://opengameart.org/content/lowpoly-rpg-characters" "Quaternius LowPoly RPG Characters"
          stage_zip "quaternius_animated_monsters" "https://opengameart.org/sites/default/files/Animated%20Monster%20Pack%20by%20%40Quaternius.zip" "https://opengameart.org/content/lowpoly-animated-monsters" "Quaternius LowPoly Animated Monsters"
          stage_zip "quaternius_ultimate_rpg_items" "https://opengameart.org/sites/default/files/ultimate_rpg_items_pack_by_quaternius.zip" "https://opengameart.org/content/low-poly-rpg-pack" "Quaternius Low Poly RPG Pack"
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B36 — real CC0 RPG characters, monsters and items

          Real extracted source assets only; nothing is connected to gameplay.

          - RPG Characters: six rigged/animated/textured fantasy character archetypes in common 3D formats.
          - Animated Monsters: low-poly animated slime/skeleton/dragon/bat-style enemy sources with multiple motions.
          - Low Poly RPG Pack: 100+ RPG models and renders, including fantasy equipment/items.

          Main chat should standardize skeleton/animation retargeting, split runtime item categories, build collisions/LODs, and promote art-direction-compatible subsets only.
          EOF
          rm -rf "$TMP"
          echo "B36 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"
      - name: Commit B36 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b36
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 RPG characters monsters items B36"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
