name: Vendor source-chat B15 real CC0 weather cavern ambience

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b15.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b15
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 weather and cavern ambience sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b15/audio"
          TMP=".sourcechat_b15_tmp"
          rm -rf "$TMP"; mkdir -p "$ROOT" "$TMP"

          meta() {
            local target="$1" key="$2" source="$3" author="$4" download="$5" notes="$6"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Author/source: $author
          Source page: $source
          Download used: $download
          License: CC0 1.0 Universal / public-domain dedication as stated on source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          Source page marks this staged asset as CC0/public domain.
          License: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          one() {
            local key="$1" filename="$2" url="$3" source="$4" author="$5" notes="$6"
            local target="$ROOT/$key"; mkdir -p "$target"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 -A 'ImPuls-CC0-SourceChat-B15/1.0' "$url" -o "$target/$filename"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          zip_audio() {
            local key="$1" url="$2" source="$3" author="$4" notes="$5"
            local target="$ROOT/$key" work="$TMP/$key"
            rm -rf "$target" "$work"; mkdir -p "$target" "$work/archive"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 -A 'ImPuls-CC0-SourceChat-B15/1.0' "$url" -o "$work/pack.zip"
            unzip -q "$work/pack.zip" -d "$work/archive"
            rsync -a --prune-empty-dirs --include='*/' --include='*.wav' --include='*.WAV' --include='*.ogg' --include='*.OGG' --include='*.mp3' --include='*.MP3' --include='*.flac' --include='*.FLAC' --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' --exclude='*' "$work/archive/" "$target/"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          zip_audio "oga_loopable_rain" \
            "https://opengameart.org/sites/default/files/Rain%20OGG.zip" \
            "https://opengameart.org/content/rain-loopable" \
            "Ylmir / OpenGameArt" \
            "Four CC0 loopable rain recordings, roughly 25–45 seconds each, OGG format."

          one "oga_rain_gutter_loop" "rain-gutter-loop_0.mp3" \
            "https://opengameart.org/sites/default/files/rain-gutter-loop_0.mp3" \
            "https://opengameart.org/content/rain-gutter-loop" \
            "Ogrebane / OpenGameArt" \
            "CC0 rain-on-roof/gutter loop for buildings, streets and covered areas."

          one "oga_short_wind" "short wind sound.wav" \
            "https://opengameart.org/sites/default/files/short%20wind%20sound.wav" \
            "https://opengameart.org/content/short-wind-sound" \
            "remaxim / OpenGameArt" \
            "CC0 short wind gust/fade source."

          one "oga_wind_whoosh_loop" "wind woosh loop.ogg" \
            "https://opengameart.org/sites/default/files/wind%20woosh%20loop.ogg" \
            "https://opengameart.org/content/wind-whoosh-loop" \
            "SketchMan3 / OpenGameArt" \
            "CC0 high-frequency wind whoosh loop."

          for n in 1 2 3 4 5; do
            one "oga_wind1_family" "wind${n}.wav" \
              "https://opengameart.org/sites/default/files/wind${n}.wav" \
              "https://opengameart.org/content/wind1" \
              "Luke.RUSTLTD / OpenGameArt" \
              "One of five CC0 roughly one-minute synthesized wind variants intended to loop."
          done

          one "oga_dark_cavern_ambient" "dark_cavern_ambient_001.ogg" \
            "https://opengameart.org/sites/default/files/dark_cavern_ambient_001.ogg" \
            "https://opengameart.org/content/dark-cavern-ambient" \
            "Paul Wortmann / OpenGameArt" \
            "CC0 dark cavern/dungeon ambience version with fade behavior."
          one "oga_dark_cavern_ambient" "dark_cavern_ambient_002.ogg" \
            "https://opengameart.org/sites/default/files/dark_cavern_ambient_002.ogg" \
            "https://opengameart.org/content/dark-cavern-ambient" \
            "Paul Wortmann / OpenGameArt" \
            "CC0 continuous-loop dark cavern/dungeon ambience."

          rm -rf "$TMP"
          cat > "assets/staging/sourcechat_b15/README.md" <<'EOF'
          # Source chat B15 — real CC0 weather/cavern ambience

          Physically staged source files only; no runtime integration.
          Coverage: four loopable rain recordings, roof/gutter rain, short wind, wind whoosh, five long wind variants and two cavern ambience versions.
          Main chat should layer/attenuate these by shelter, region, storm strength and underground context rather than playing all sources simultaneously.
          EOF
          find assets/staging/sourcechat_b15 -type f | wc -l
          du -sh assets/staging/sourcechat_b15

      - name: Commit only B15 staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b15
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(staging): vendor real CC0 weather cavern ambience B15"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
