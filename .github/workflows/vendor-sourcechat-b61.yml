name: Vendor source-chat B61 real CC0 sawmill carriage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b61.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b61
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 sawmill and carriage sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b61"
          TMP=".sourcechat_b61_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          meta() {
            local name="$1" page="$2" title="$3" download="$4" notes="$5"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $download
          License: CC0 as stated on the source page.
          Notes: $notes
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          mkdir -p "$TMP/sawmill" "$ROOT/models/oga_medieval_waterpowered_sawmill"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1800 -A 'ImPuls-CC0-B61/1.0' "https://opengameart.org/sites/default/files/75340_WaterPoweredSawmillUpload_blend.zip" -o "$TMP/sawmill.zip"
          unzip -q "$TMP/sawmill.zip" -d "$TMP/sawmill"
          chmod -R u+rwX "$TMP/sawmill" || true
          rsync -a "$TMP/sawmill/" "$ROOT/models/oga_medieval_waterpowered_sawmill/"
          meta "oga_medieval_waterpowered_sawmill" "https://opengameart.org/content/medieval-waterpowered-sawmill" "Medieval Waterpowered Sawmill" "https://opengameart.org/sites/default/files/75340_WaterPoweredSawmillUpload_blend.zip" "Authored water-powered sawmill building/source for river/industry/lumber locations."

          mkdir -p "$ROOT/models/oga_horse_drawn_carriage"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B61/1.0' "https://opengameart.org/sites/default/files/WOZ.blend" -o "$ROOT/models/oga_horse_drawn_carriage/WOZ.blend"
          meta "oga_horse_drawn_carriage" "https://opengameart.org/content/horse-drawn-carriage" "Horse drawn carriage" "https://opengameart.org/sites/default/files/WOZ.blend" "Static carriage source. Source-page comments state textures were not packed; main chat must rebuild/replace materials before production use."

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B61 — real CC0 sawmill and horse-drawn carriage

          Source-only staging. Nothing is connected to gameplay.

          Main integration chat should use the sawmill as an authored river/lumber/industry location candidate and treat the carriage as a material-incomplete vehicle prop source. Normalize scale, collisions and materials before promotion.
          EOF
          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B61 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B61 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b61
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 sawmill carriage B61"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
