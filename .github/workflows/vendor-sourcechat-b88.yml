name: Vendor source-chat B88 real CC0 sewers mines caves

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b88.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b88
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 sewer mine cave sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b88"
          TMP=".sourcechat_b88_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          meta() {
            local name="$1" page="$2" title="$3" download="$4" notes="$5"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $download
          License: CC0 as stated on the source page.
          Notes: $notes
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_zip() {
            local name="$1" url="$2" tmpname="$3" maxtime="$4"
            mkdir -p "$TMP/$tmpname" "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time "$maxtime" -A 'ImPuls-CC0-B88/1.0' "$url" -o "$TMP/$tmpname.zip"
            unzip -q "$TMP/$tmpname.zip" -d "$TMP/$tmpname"
            chmod -R u+rwX "$TMP/$tmpname" || true
            find "$TMP/$tmpname" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.cs' -o -iname '*.gd' \) -delete
            rsync -a "$TMP/$tmpname/" "$ROOT/models/$name/"
          }

          stage_zip "oga_sewer_tunnels_lowres_2026" "https://opengameart.org/sites/default/files/sewer_low_resolution.zip" "sewer" "1800"
          meta "oga_sewer_tunnels_lowres_2026" \
            "https://opengameart.org/node/186811" \
            "Sewer Tunnels — low resolution" \
            "https://opengameart.org/sites/default/files/sewer_low_resolution.zip" \
            "2026 modular sewer set on a 4x4 grid. Low-resolution update uses 256x256 textures and remodeled lower-poly pipes; PBR color/rough/normal maps included."

          stage_zip "oga_mines_and_caves_178" "https://opengameart.org/sites/default/files/minesandcaves_set_blend_gltf_fbx_godot.zip" "minescaves" "3600"
          meta "oga_mines_and_caves_178" \
            "https://opengameart.org/content/mines-and-cave-set" \
            "mines and cave set" \
            "https://opengameart.org/sites/default/files/minesandcaves_set_blend_gltf_fbx_godot.zip" \
            "CC0 modular cave/mine system with 178 objects, 1K textures, Blend/FBX/GLTF and Godot-ready source data. Third-party scripts are intentionally removed in this source-only chat."

          stage_zip "oga_free_mine_assets_pack" "https://opengameart.org/sites/default/files/free_mine_assets.zip" "freemine" "2400"
          meta "oga_free_mine_assets_pack" \
            "https://opengameart.org/content/free-mine-assets-pack" \
            "free mine assets pack" \
            "https://opengameart.org/sites/default/files/free_mine_assets.zip" \
            "CC0 mine-level source with 35+ wooden supports plus stones, stalagmites/stalactites, rail system, lamps, treasure chest, minecart and gold coins."

          mkdir -p "$ROOT/models/oga_concrete_pipes"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1800 -A 'ImPuls-CC0-B88/1.0' \
            "https://opengameart.org/sites/default/files/concrete%20pipes.7z" -o "$ROOT/models/oga_concrete_pipes/concrete_pipes.7z"
          meta "oga_concrete_pipes" \
            "https://opengameart.org/content/concrete-pipes" \
            "Concrete pipes" \
            "https://opengameart.org/sites/default/files/concrete%20pipes.7z" \
            "CC0 concrete pipe/infrastructure source for sewers, construction, industrial yards and drainage. Original 7z preserved for integration-time extraction."

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.cs' -o -iname '*.gd' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B88 — real CC0 sewer, mine and cave libraries

          Source-only staging. Nothing is wired into gameplay.

          Main integration chat should prefer the newer mines+caves and 2026 low-resolution sewer systems for production candidates, while keeping the older free mine pack as a broad prop/reference source. Normalize grid scale, materials, collision and visibility/LOD before promotion.
          EOF

          chmod -R u+rwX "$TMP" || true
          rm -rf "$TMP"
          echo "B88 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B88 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b88
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 sewers mines caves B88"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
