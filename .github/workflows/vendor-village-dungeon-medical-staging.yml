name: Vendor CC0 village dungeon medical staging

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-village-dungeon-medical-staging.yml'

permissions:
  contents: write

concurrency:
  group: vendor-village-dungeon-medical-staging
  cancel-in-progress: false

jobs:
  vendor-village-dungeon-medical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging areas
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            assets/staging/buildings
            assets/staging/items
          sparse-checkout-cone-mode: true

      - name: Download verified CC0 source packs
        shell: bash
        run: |
          set -u
          TMP=".village_dungeon_medical_tmp"
          FAILS="$TMP/FAILED.txt"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          : > "$FAILS"

          meta() {
            local target="$1" source="$2" url="$3" notes="$4" format="$5"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Source page: $source
          Download used: $url
          License: CC0 1.0 Universal as stated by the source page.
          Status: SOURCE-ONLY STAGING — not gameplay-integrated.
          Canonical staged format: $format.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          Preserve SOURCE.md with staged files.
          EOF
          }

          import_best3d() {
            local key="$1" url="$2" source="$3" target="$4" notes="$5"
            local work="$TMP/$key" format=""
            rm -rf "$target" "$work"
            mkdir -p "$target" "$work/archive"
            if ! curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-Staging/1.0' "$url" -o "$work/pack.zip"; then
              echo "$key | download failed | $url" >> "$FAILS"
              rm -rf "$target" "$work"
              return 0
            fi
            if ! unzip -q "$work/pack.zip" -d "$work/archive"; then
              echo "$key | unzip failed | $url" >> "$FAILS"
              rm -rf "$target" "$work"
              return 0
            fi
            if find "$work/archive" -type f \( -iname '*.glb' -o -iname '*.gltf' \) -print -quit | grep -q .; then
              format="glTF/GLB"
              rsync -a --prune-empty-dirs --include='*/' --include='*.glb' --include='*.GLB' --include='*.gltf' --include='*.GLTF' --include='*.bin' --include='*.BIN' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.txt' --include='*.TXT' --exclude='*' "$work/archive/" "$target/"
            elif find "$work/archive" -type f -iname '*.fbx' -print -quit | grep -q .; then
              format="FBX"
              rsync -a --prune-empty-dirs --include='*/' --include='*.fbx' --include='*.FBX' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.txt' --include='*.TXT' --exclude='*' "$work/archive/" "$target/"
            elif find "$work/archive" -type f -iname '*.obj' -print -quit | grep -q .; then
              format="OBJ"
              rsync -a --prune-empty-dirs --include='*/' --include='*.obj' --include='*.OBJ' --include='*.mtl' --include='*.MTL' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.txt' --include='*.TXT' --exclude='*' "$work/archive/" "$target/"
            else
              format="Blend"
              rsync -a --prune-empty-dirs --include='*/' --include='*.blend' --include='*.BLEND' --include='*.png' --include='*.PNG' --include='*.jpg' --include='*.JPG' --include='*.jpeg' --include='*.JPEG' --include='*.webp' --include='*.WEBP' --include='*.txt' --include='*.TXT' --exclude='*' "$work/archive/" "$target/"
            fi
            if [ -z "$(find "$target" -type f -print -quit)" ]; then
              echo "$key | no canonical files selected | $url" >> "$FAILS"
              rm -rf "$target"
              return 0
            fi
            meta "$target" "$source" "$url" "$notes" "$format"
          }

          import_best3d "quaternius_rpg_items_100plus" \
            "https://opengameart.org/sites/default/files/ultimate_rpg_items_pack_by_quaternius_0.zip" \
            "https://opengameart.org/content/low-poly-rpg-pack" \
            "assets/staging/items/quaternius_rpg_items_100plus" \
            "100+ RPG models: swords, daggers, helmets, staffs, gems, gold and pickups."

          import_best3d "quaternius_medieval_village" \
            "https://opengameart.org/sites/default/files/medieval_village_pack_-_dec_2020.zip" \
            "https://opengameart.org/content/lowpoly-medieval-village-pack" \
            "assets/staging/buildings/quaternius_medieval_village" \
            "Medieval buildings and village props."

          import_best3d "quaternius_modular_dungeon" \
            "https://opengameart.org/sites/default/files/Modular%20Dungeon%20by%20%40Quaternius.zip" \
            "https://opengameart.org/content/lowpoly-modular-dungeon" \
            "assets/staging/buildings/quaternius_modular_dungeon" \
            "Modular dungeon with barrels, torches, candles, potion/RPG props."

          import_best3d "quaternius_lowpoly_buildings" \
            "https://opengameart.org/sites/default/files/Buildings%20pack%20by%20%40Quaternius_0.zip" \
            "https://opengameart.org/content/lowpoly-buildings" \
            "assets/staging/buildings/quaternius_lowpoly_buildings" \
            "City buildings including shop, bank, hospital, house and flats."

          import_best3d "oga_medical_stuff" \
            "https://opengameart.org/sites/default/files/Medical_0.zip" \
            "https://opengameart.org/content/medical-stuff" \
            "assets/staging/items/oga_medical_stuff" \
            "Medical box, pill, pill bottle, syringe and gauze. Main chat must visually verify that no protected Red Cross emblem is used; recolor/remove any protected emblem before production."

          mkdir -p assets/staging/buildings assets/staging/items
          cp "$FAILS" assets/staging/items/VILLAGE_DUNGEON_MEDICAL_DOWNLOAD_FAILURES.txt
          rm -rf "$TMP"

      - name: Commit with concurrent-push retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/buildings assets/staging/items
          if git diff --cached --quiet; then
            echo "No staging changes to commit."
            exit 0
          fi
          git commit -m "assets(staging): add CC0 RPG village dungeon city and medical props"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --depth=1 origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
