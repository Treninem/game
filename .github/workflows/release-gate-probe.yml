# probe refresh 2026-10-07 v3
name: Probe Candidate Release Gates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-gate-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Capture latest candidate-trigger workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/commits?per_page=50" > /tmp/commits.json
          TARGET_SHA="$(python3 - <<'PY'
          import json
          from pathlib import Path
          commits=json.loads(Path('/tmp/commits.json').read_text())
          for c in commits:
              if '[candidate]' in c.get('commit',{}).get('message',''):
                  print(c['sha'])
                  break
          PY
          )"
          test -n "$TARGET_SHA"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" > /tmp/runs.json
          mkdir -p release
          TARGET_SHA="$TARGET_SHA" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          sha=os.environ['TARGET_SHA']
          data=json.loads(Path('/tmp/runs.json').read_text())
          wanted={
              'Validate World Core',
              'Validate Player Movement',
              'Build ImPuls Release Candidate',
          }
          rows=[]
          for r in data.get('workflow_runs',[]):
              if r.get('name') in wanted and r.get('head_sha') == sha:
                  rows.append({
                      'name': r.get('name'),
                      'run_id': r.get('id'),
                      'run_number': r.get('run_number'),
                      'status': r.get('status'),
                      'conclusion': r.get('conclusion'),
                      'html_url': r.get('html_url'),
                  })
          rows.sort(key=lambda x:(x['name'], int(x['run_number'] or 0)))
          payload={
              'release_sha': sha,
              'captured_at': datetime.now(timezone.utc).isoformat(),
              'runs': rows,
          }
          Path('release/probe.json').write_text(json.dumps(payload, indent=2)+'\n', encoding='utf-8')
          Path('/tmp/run_ids.txt').write_text('\n'.join(str(r['run_id']) for r in rows if r['conclusion'] == 'failure')+'\n', encoding='utf-8')
          PY

          : > release/failure-logs.txt
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            printf '\n===== RUN %s =====\n' "$run_id" >> release/failure-logs.txt
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed >> release/failure-logs.txt 2>&1 || true
          done < /tmp/run_ids.txt
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          cp release/probe.json /tmp/impuls-probe.json
          cp release/failure-logs.txt /tmp/impuls-failure-logs.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p release
            cp /tmp/impuls-probe.json release/probe.json
            cp /tmp/impuls-failure-logs.txt release/failure-logs.txt
            git add release/probe.json release/failure-logs.txt
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "ci: capture candidate gate failure logs [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved while recording probe data; retrying from fresh origin/main (attempt $attempt/3)."
          done

          echo "::error::Unable to record candidate probe data after 3 non-destructive retries."
          exit 1
