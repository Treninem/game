name: Vendor source-chat B43 real CC0 wetland insects fauna

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b43.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b43
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 wetland insects fauna sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b43"
          TMP=".sourcechat_b43_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$TMP"

          write_meta() {
            local name="$1" page="$2" title="$3" download="$4"
            cat > "$ROOT/models/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $download
          License: CC0 as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/models/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_zip() {
            local name="$1" url="$2" page="$3" title="$4"
            mkdir -p "$TMP/$name" "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B43/1.0' "$url" -o "$TMP/$name.zip"
            unzip -q "$TMP/$name.zip" -d "$TMP/$name"
            rsync -a "$TMP/$name/" "$ROOT/models/$name/"
            write_meta "$name" "$page" "$title" "$url"
          }

          stage_file() {
            local name="$1" url="$2" page="$3" title="$4" filename="$5"
            mkdir -p "$ROOT/models/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B43/1.0' "$url" -o "$ROOT/models/$name/$filename"
            write_meta "$name" "$page" "$title" "$url"
          }

          stage_zip "oga_penguin_rigged_animated" "https://opengameart.org/sites/default/files/penguin_3.zip" "https://opengameart.org/content/penguin-0" "Penguin"
          stage_zip "oga_crab_lowpoly_animated" "https://opengameart.org/sites/default/files/crab_0.zip" "https://opengameart.org/content/crab-low-poly-animated-3d-model" "Crab low poly animated 3D model"
          stage_zip "oga_butterfly_animated" "https://opengameart.org/sites/default/files/Butterfly.zip" "https://opengameart.org/content/butterfly-animated" "Butterfly animated"
          stage_file "oga_turtle_rigged" "https://opengameart.org/sites/default/files/Turtle.blend" "https://opengameart.org/content/turtle-0" "Turtle" "Turtle.blend"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B43/1.0' "https://opengameart.org/sites/default/files/turtle%20texture.png" -o "$ROOT/models/oga_turtle_rigged/turtle_texture.png"
          stage_file "oga_bee_rigged" "https://opengameart.org/sites/default/files/bee_rigged_v1.1.blend" "https://opengameart.org/content/bee-0" "Bee rigged" "bee_rigged_v1.1.blend"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 1200 -A 'ImPuls-CC0-B43/1.0' "https://opengameart.org/sites/default/files/bee_5.png" -o "$ROOT/models/oga_bee_rigged/bee.png"
          stage_file "oga_swamp_limule_rigged_animated" "https://opengameart.org/sites/default/files/limule-final.blend" "https://opengameart.org/content/swamp-limule" "Swamp Limule" "limule-final.blend"

          find "$ROOT" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B43 — real CC0 wetland, coast and insect fauna

          Source-only staging. Nothing in this batch is connected to gameplay.

          Includes penguin, crab, turtle, butterfly, bee and horseshoe-crab/limule sources. Main integration chat should validate texture references, animation clips, skeletons, scale and production suitability before promotion.
          EOF
          rm -rf "$TMP"
          echo "B43 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"

      - name: Commit B43 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b43
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 wetland insects fauna B43"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
