name: Snapshot TZ Gate Status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tz-instant-status.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 3
      - name: Snapshot target runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: "82651eb30b721d9020e4ba53e9fc0a848e53c25e"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" > /tmp/runs.json
          TARGET_SHA="$TARGET_SHA" python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/runs.json').read_text())
          rows=[]
          for r in data.get('workflow_runs',[]):
              rows.append({k:r.get(k) for k in ['id','name','status','conclusion','run_number','html_url','created_at','updated_at']})
          Path('release/tz-instant-status.json').write_text(json.dumps({'sha':os.environ['TARGET_SHA'],'runs':rows},indent=2)+'\n')
          PY
      - name: Publish snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/tz-instant-status.json
          git commit -m "ci: snapshot final stable runs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
