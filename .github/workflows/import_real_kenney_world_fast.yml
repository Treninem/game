name: Fast import real CC0 Kenney world packs

on:
  push:
    paths:
      - '.github/workflows/import_real_kenney_world_fast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-real-kenney-world-fast
  cancel-in-progress: false

jobs:
  import-world-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse partial checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/import_real_kenney_world_fast.yml
            assets/source_packs/opengameart/kenney
          sparse-checkout-cone-mode: false

      - name: Download verified CC0 Kenney world packs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/source_packs/opengameart/kenney"
          mkdir -p "$ROOT/nature_kit" "$ROOT/survival_kit" "$ROOT/prototype_kit" "$ROOT/nature_landscape_blocks"

          fetch() {
            local url="$1" out="$2"
            if [ -s "$out" ]; then echo "Already present: $out"; return 0; fi
            curl -L --fail --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 1200 \
              -A 'ImPuls-CC0-AssetImporter/2.1' "$url" -o "$out"
            test -s "$out"
          }

          fetch 'https://opengameart.org/sites/default/files/Nature%20Kit%20%282.1%29.zip' "$ROOT/nature_kit/Nature_Kit_2.1.zip"
          fetch 'https://opengameart.org/sites/default/files/kenney_survival-kit.zip' "$ROOT/survival_kit/kenney_survival-kit.zip"
          fetch 'https://opengameart.org/sites/default/files/kenney_prototype-kit.zip' "$ROOT/prototype_kit/kenney_prototype-kit.zip"
          fetch 'https://opengameart.org/sites/default/files/NatureLandscapeBlocks_Optimised.zip' "$ROOT/nature_landscape_blocks/NatureLandscapeBlocks_Optimised.zip"

          find "$ROOT" -type f -name '*.zip' -size 0 -print -quit | grep -q . && { echo 'ERROR: zero-byte archive'; exit 1; } || true
          find "$ROOT" -type f -name '*.zip' -print0 | sort -z | xargs -0 sha256sum > "$ROOT/WORLD_BATCH_SHA256SUMS.txt"

      - name: Write source metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/source_packs/opengameart/kenney"

          cat > "$ROOT/nature_kit/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/nature-kit
          License: CC0
          Author: Kenney
          File: Nature_Kit_2.1.zip
          Coverage: 330+ optimized low-poly objects: trees, rocks, terrain, waterfalls, camping equipment and plants.
          Status: source-only; not gameplay-integrated by this chat.
          EOF
          cat > "$ROOT/survival_kit/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/survival-kit
          License: CC0
          Author: Kenney
          File: kenney_survival-kit.zip
          Coverage: 80 optimized survival structures, items, tools and resources.
          Status: source-only; not gameplay-integrated by this chat.
          EOF
          cat > "$ROOT/prototype_kit/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/prototype-kit
          License: CC0
          Author: Kenney
          File: kenney_prototype-kit.zip
          Coverage: 145 models with characters, animals, vehicles, walls, objects and animated controls; source lists Godot compatibility.
          Status: source-only; not gameplay-integrated by this chat.
          EOF
          cat > "$ROOT/nature_landscape_blocks/SOURCE.md" <<'EOF'
          Source: https://opengameart.org/content/nature-landscape-blocks-asset-forge-game-engine-optimized
          License: CC0
          Author: nateonus; based on Kenney Nature Kit
          File: NatureLandscapeBlocks_Optimised.zip
          Coverage: optimized modular landscape blocks for large terrain assembly.
          Status: source-only; not gameplay-integrated by this chat.
          EOF

      - name: Commit and push source packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source_packs/opengameart/kenney
          git diff --cached --quiet && exit 0
          git commit -m "assets: vendor real CC0 Kenney world packs"
          for attempt in 1 2 3 4 5 6; do
            git fetch --depth=1 origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
