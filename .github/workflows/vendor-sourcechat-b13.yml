name: Vendor source-chat B13 real CC0 physical world interactions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b13.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b13
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 physical interaction sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b13/audio"
          TMP=".sourcechat_b13_tmp"
          rm -rf "$TMP"; mkdir -p "$ROOT" "$TMP"
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null

          meta() {
            local target="$1" key="$2" source="$3" author="$4" download="$5" notes="$6"
            cat > "$target/SOURCE.md" <<EOF
          # Source

          Pack key: $key
          Author/source: $author
          Source page: $source
          Download used: $download
          License: CC0 1.0 Universal / public-domain dedication as stated on source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          Notes: $notes
          EOF
            cat > "$target/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          Source page marks this staged asset as CC0/public domain.
          License: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          one() {
            local key="$1" filename="$2" url="$3" source="$4" author="$5" notes="$6"
            local target="$ROOT/$key"; mkdir -p "$target"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'ImPuls-CC0-SourceChat-B13/1.0' "$url" -o "$target/$filename"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          seven_audio() {
            local key="$1" url="$2" source="$3" author="$4" notes="$5"
            local target="$ROOT/$key" work="$TMP/$key"
            rm -rf "$target" "$work"; mkdir -p "$target" "$work/archive"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 -A 'ImPuls-CC0-SourceChat-B13/1.0' "$url" -o "$work/pack.7z"
            7z x -y "$work/pack.7z" -o"$work/archive" >/dev/null
            rsync -a --prune-empty-dirs --include='*/' --include='*.wav' --include='*.WAV' --include='*.ogg' --include='*.OGG' --include='*.mp3' --include='*.MP3' --include='*.flac' --include='*.FLAC' --include='*.txt' --include='*.TXT' --include='*.md' --include='*.MD' --exclude='*' "$work/archive/" "$target/"
            meta "$target" "$key" "$source" "$author" "$url" "$notes"
          }

          one "oga_shovel_dirt" "shovel.ogg" \
            "https://opengameart.org/sites/default/files/shovel.ogg" \
            "https://opengameart.org/content/shovel-sound" \
            "themightyglider / OpenGameArt" \
            "CC0 shovel moving dirt/soil, suitable for digging and ground tool interaction."

          one "oga_object_into_water" "water_drops.ogg" \
            "https://opengameart.org/sites/default/files/water_drops.ogg" \
            "https://opengameart.org/content/object-dropping-into-water-0" \
            "angeloyazar / OpenGameArt" \
            "CC0 object-dropping-into-water recording for heavy splash/object physics."

          one "oga_stone_rock_wood_move" "stone_rock_or_wood_moved.mp3" \
            "https://opengameart.org/sites/default/files/stone_rock_or_wood_moved.mp3" \
            "https://opengameart.org/content/stone-rock-or-wood-moved-sound" \
            "pauliuw / OpenGameArt" \
            "CC0 grinding/moving sound candidate for stones, rocks and heavy wooden props."

          one "oga_moving_boulder" "boulder_drop.ogg" \
            "https://opengameart.org/sites/default/files/boulder_drop.ogg" \
            "https://opengameart.org/content/moving-boulder" \
            "themightyglider / OpenGameArt" \
            "CC0 boulder drop/stone object impact."
          one "oga_moving_boulder" "move_boulder.ogg" \
            "https://opengameart.org/sites/default/files/move_boulder.ogg" \
            "https://opengameart.org/content/moving-boulder" \
            "themightyglider / OpenGameArt" \
            "CC0 boulder/stone object movement scrape."

          seven_audio "oga_qubodup_impact_palette" \
            "https://opengameart.org/sites/default/files/qubodupImpact.7z" \
            "https://opengameart.org/content/impact" \
            "qubodup / OpenGameArt" \
            "CC0 impact palette tagged for metal, iron, wood, tree/trunk, stone, hard/soft and wet contacts."

          one "oga_cannon_wall_crash" "cannon_hit_wall.ogg" \
            "https://opengameart.org/sites/default/files/cannon_hit_wall.ogg" \
            "https://opengameart.org/content/cannon-hit-wall" \
            "Thimras / OpenGameArt" \
            "CC0 heavy wall/cliff crash with slide/splash tail; source candidate for large structural impacts."

          rm -rf "$TMP"
          cat > "assets/staging/sourcechat_b13/README.md" <<'EOF'
          # Source chat B13 — real CC0 physical world interaction audio

          Physically staged files only; no game integration.
          Coverage: digging/shovel dirt, objects falling into water, heavy stone/wood movement, boulder drop/scrape, a multi-material impact palette and one large wall/cliff crash.

          Deliberately excluded from this CC0 batch: OpenGameArt `rock_breaking` and `Falling Rock`, because those exact pages are CC-BY 3.0 rather than CC0.
          EOF
          find assets/staging/sourcechat_b13 -type f | wc -l
          du -sh assets/staging/sourcechat_b13

      - name: Commit only B13 staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b13
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(staging): vendor real CC0 physical world interactions B13"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
