name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "assets/**"
      - "scenes/**"
      - "scripts/**"
      - "story/**"
      - "tools/**"
      - "installer/**"
      - "export_presets.cfg"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impuls-windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_TEMPLATE_VERSION: "4.7.1.stable"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/${env:GODOT_VERSION}-stable/Godot_v${env:GODOT_VERSION}-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          $godot = Get-ChildItem godot -Filter 'Godot_v*.exe' -Recurse | Select-Object -First 1
          if (-not $godot) { throw 'Godot executable not found' }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install matching Godot export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $templatesRoot = Join-Path $env:APPDATA ('Godot\export_templates\' + $env:GODOT_TEMPLATE_VERSION)
          $templatesArchive = 'Godot_v' + $env:GODOT_VERSION + '-stable_export_templates.tpz'
          $templatesUrl = 'https://github.com/godotengine/godot/releases/download/' + $env:GODOT_VERSION + '-stable/' + $templatesArchive
          Invoke-WebRequest -Uri $templatesUrl -OutFile export_templates.tpz
          New-Item -ItemType Directory -Force -Path $templatesRoot | Out-Null
          Expand-Archive export_templates.tpz -DestinationPath export_templates_unpack -Force
          $sourceTemplates = Join-Path (Get-Location) 'export_templates_unpack\templates'
          if (-not (Test-Path $sourceTemplates)) { throw 'Godot export templates archive has unexpected layout' }
          Copy-Item (Join-Path $sourceTemplates '*') $templatesRoot -Recurse -Force
          '4.7.1.stable' | Set-Content -Path (Join-Path $templatesRoot 'version.txt') -Encoding ascii
          $releaseTemplate = Join-Path $templatesRoot 'windows_release_x86_64.exe'
          if (-not (Test-Path $releaseTemplate)) { throw "Windows x86_64 release template was not installed: $releaseTemplate" }

      - name: Read game version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $line = Select-String -Path project.godot -Pattern '^config/version=' | Select-Object -First 1
          if (-not $line) { throw 'application/config/version is missing from project.godot' }
          if ($line.Line -notmatch 'config/version="([^"]+)"') { throw 'Could not parse application/config/version' }
          $fullVersion = $Matches[1]
          if ($fullVersion -notmatch '^([0-9]+(?:\.[0-9]+){1,3})') { throw "Installer version is not numeric: $fullVersion" }
          $appVersion = $Matches[1]
          "IMPULS_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMPULS_BUILD_TAG=build-${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import and validate project
        shell: pwsh
        run: |
          & "$env:GODOT_EXE" --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\windows | Out-Null
          & "$env:GODOT_EXE" --headless --path . --export-release "Windows Desktop" build\windows\ImPuls.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build\windows\ImPuls.exe)) { throw 'Windows export was not created' }

      - name: Prepare stable release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:IMPULS_BUILD_TAG | Set-Content -Path installer\release_tag.txt -Encoding ascii

      - name: Build updater-aware installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyBuildTag=$env:IMPULS_BUILD_TAG" "/DMyAppVersion=$env:IMPULS_VERSION" "installer\ImPuls.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path installer\output\ImPuls-Setup.exe)) { throw 'Installer was not created' }

      - name: Create SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer\output\ImPuls-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ImPuls-Setup.exe" | Set-Content installer\output\ImPuls-Setup.exe.sha256 -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImPuls-Windows-Installer
          path: |
            installer/output/ImPuls-Setup.exe
            installer/output/ImPuls-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Move stable tag to this build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f stable "$env:GITHUB_SHA"
          git push origin refs/tags/stable --force

      - name: Publish stable GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable
          name: ${{ env.IMPULS_BUILD_TAG }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            installer/output/ImPuls-Setup.exe
            installer/output/ImPuls-Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
