name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "assets/**"
      - "scenes/**"
      - "scripts/**"
      - "story/**"
      - "tools/**"
      - "export_presets.cfg"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impuls-windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_TEMPLATE_VERSION: "4.7.1.stable"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/${env:GODOT_VERSION}-stable/Godot_v${env:GODOT_VERSION}-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          $godot = Get-ChildItem godot -Filter 'Godot_v*.exe' -Recurse | Select-Object -First 1
          if (-not $godot) { throw 'Godot executable not found' }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install matching Godot export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $templatesRoot = Join-Path $env:APPDATA ('Godot\export_templates\' + $env:GODOT_TEMPLATE_VERSION)
          $templatesArchive = 'Godot_v' + $env:GODOT_VERSION + '-stable_export_templates.tpz'
          $templatesUrl = 'https://github.com/godotengine/godot/releases/download/' + $env:GODOT_VERSION + '-stable/' + $templatesArchive
          Invoke-WebRequest -Uri $templatesUrl -OutFile export_templates.tpz
          New-Item -ItemType Directory -Force -Path $templatesRoot | Out-Null
          Expand-Archive export_templates.tpz -DestinationPath export_templates_unpack -Force
          $templateFiles = Get-ChildItem export_templates_unpack -Recurse -File
          if (-not $templateFiles) { throw 'Godot export templates archive is empty' }
          $sourceTemplates = Join-Path (Get-Location) 'export_templates_unpack\templates'
          if (-not (Test-Path $sourceTemplates)) { throw 'Godot export templates archive has unexpected layout' }
          Copy-Item (Join-Path $sourceTemplates '*') $templatesRoot -Recurse -Force
          '4.7.1.stable' | Set-Content -Path (Join-Path $templatesRoot 'version.txt') -Encoding ascii
          $releaseTemplate = Join-Path $templatesRoot 'windows_release_x86_64.exe'
          if (-not (Test-Path $releaseTemplate)) { throw "Windows x86_64 release template was not installed: $releaseTemplate" }
          Write-Host "Installed export templates in $templatesRoot"

      - name: Read game version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $line = Select-String -Path project.godot -Pattern '^config/version=' | Select-Object -First 1
          if (-not $line) { throw 'application/config/version is missing from project.godot' }
          if ($line.Line -notmatch 'config/version="([^"]+)"') { throw 'Could not parse application/config/version' }
          $fullVersion = $Matches[1]
          if ($fullVersion -notmatch '^([0-9]+(?:\.[0-9]+){1,3})') { throw "Installer version is not numeric: $fullVersion" }
          $appVersion = $Matches[1]
          "IMPULS_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building ImPuls version $appVersion from project version $fullVersion"

      - name: Import and validate project
        shell: pwsh
        run: |
          & "$env:GODOT_EXE" --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\windows | Out-Null
          & "$env:GODOT_EXE" --headless --path . --export-release "Windows Desktop" build\windows\ImPuls.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build\windows\ImPuls.exe)) { throw 'Windows export was not created' }

      - name: Create installer script
        shell: pwsh
        run: |
          $iss = @"
          #define MyAppName "ImPuls"
          #define MyAppVersion "$env:IMPULS_VERSION"
          #define MyAppPublisher "ImPuls"
          #define MyAppExeName "ImPuls.exe"

          [Setup]
          AppId={{9F4A0D68-1A8A-4F52-9F4B-IMPULS0001}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\ImPuls
          DefaultGroupName=ImPuls
          OutputDir=build\installer
          OutputBaseFilename=ImPuls-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{group}\ImPuls"; Filename: "{app}\{#MyAppExeName}"
          Name: "{commondesktop}\ImPuls"; Filename: "{app}\{#MyAppExeName}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Запустить ImPuls"; Flags: nowait postinstall skipifsilent
          "@
          $iss | Set-Content -Path build\installer.iss -Encoding UTF8

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build\installer\ImPuls-Setup.exe)) { throw 'Installer was not created' }

      - name: Create SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash build\installer\ImPuls-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ImPuls-Setup.exe" | Set-Content build\installer\ImPuls-Setup.exe.sha256 -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImPuls-Windows-Installer
          path: |
            build/installer/ImPuls-Setup.exe
            build/installer/ImPuls-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ImPuls Windows — latest
          prerelease: true
          make_latest: false
          files: |
            build/installer/ImPuls-Setup.exe
            build/installer/ImPuls-Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
