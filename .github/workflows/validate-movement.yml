name: Validate Player Movement

on:
  push:
    branches: [main]
    paths:
      - "scripts/bootstrap.gd"
      - "scripts/player_controller.gd"
      - "scripts/humanoid_visual.gd"
      - "scripts/world_streamer.gd"
      - "scripts/world_data.gd"
      - "scripts/world_geography.gd"
      - "scripts/start_region_streamer.gd"
      - "scripts/start_spawn_surface.gd"
      - "scripts/capital_data.gd"
      - "scripts/capital_perimeter.gd"
      - "scripts/city_district.gd"
      - "scripts/city_streamer_fast.gd"
      - "scripts/runtime_stability_guard.gd"
      - "scripts/hud_runtime.gd"
      - "scripts/settings_manager.gd"
      - "scripts/ui_layout_guard.gd"
      - "scripts/game_menu.gd"
      - "scripts/gameplay_panels.gd"
      - "scenes/stage1.tscn"
      - "tests/smoke_player_movement.gd"
      - "tests/smoke_player_movement.tscn"
      - "tests/smoke_ui_and_save.gd"
      - "tests/smoke_ui_and_save.tscn"
      - "assets/shaders/**"
      - "assets/staging/nature/kenney_nature_kit/**"
      - ".github/workflows/validate-movement.yml"
  workflow_dispatch:

concurrency:
  group: validate-player-movement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  movement-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            scenes
            tests
            assets/branding
            assets/ui
            assets/vfx
            assets/shaders
            assets/staging/sourcechat_b47
            assets/staging/nature/kenney_nature_kit/License.txt
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/tree_oak.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/tree_detailed.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/tree_pineDefaultA.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/plant_bushDetailed.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/grass_large.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/rock_largeA.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/log_large.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/stump_roundDetailed.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/mushroom_tanGroup.glb
            project.godot
          sparse-checkout-cone-mode: false
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Parse project
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Prove player surface, void recovery and movement
        shell: bash
        run: |
          set +e
          output=$(timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_player_movement.tscn 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail=$(printf '%s\n' "$output" | tail -n 32 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Player smoke raw Godot output::$detail"
          fi
          exit "$status"
      - name: Prove UI geometry and save slots
        shell: bash
        run: |
          set +e
          output=$(timeout 35s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_ui_and_save.tscn 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 124 ]; then
            echo "::error title=UI layout smoke timeout::Menu layout did not settle within 35 seconds"
          elif [ "$status" -ne 0 ]; then
            detail=$(printf '%s\n' "$output" | tail -n 32 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=UI smoke raw Godot output::$detail"
          fi
          exit "$status"
