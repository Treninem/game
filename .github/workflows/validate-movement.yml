name: Validate Player Movement

on:
  push:
    branches: [main]
    paths:
      - "scripts/bootstrap.gd"
      - "scripts/player_controller.gd"
      - "scripts/humanoid_visual.gd"
      - "scripts/world_streamer.gd"
      - "scripts/world_data.gd"
      - "scripts/world_geography.gd"
      - "scripts/start_region_streamer.gd"
      - "scripts/start_civilization_signs.gd"
      - "scripts/start_spawn_surface.gd"
      - "scripts/capital_data.gd"
      - "scripts/capital_perimeter.gd"
      - "scripts/city_district.gd"
      - "scripts/city_streamer_fast.gd"
      - "scripts/door_interactable.gd"
      - "scripts/enterable_building.gd"
      - "scripts/runtime_stability_guard.gd"
      - "scripts/hud_runtime.gd"
      - "scripts/settings_manager.gd"
      - "scripts/ui_layout_guard.gd"
      - "scripts/game_menu.gd"
      - "scripts/gameplay_panels.gd"
      - "scenes/stage1.tscn"
      - "tests/smoke_player_movement.gd"
      - "tests/smoke_player_movement.tscn"
      - "tests/smoke_enterable_building.gd"
      - "tests/smoke_enterable_building.tscn"
      - "tests/smoke_canonical_regions.gd"
      - "tests/smoke_canonical_regions.tscn"
      - "tests/smoke_ui_and_save.gd"
      - "tests/smoke_ui_and_save.tscn"
      - "assets/audio/**"
      - "assets/production/**"
      - "assets/shaders/**"
      - "assets/staging/sourcechat_b47/**"
      - "assets/staging/nature/kenney_nature_kit/**"
      - ".github/workflows/validate-movement.yml"
  workflow_dispatch:

concurrency:
  group: validate-player-movement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  movement-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            scenes
            tests
            assets/branding
            assets/ui
            assets/vfx
            assets/shaders
            assets/audio/world/oga_100_cc0_sfx_2
            assets/production/nature/kenney_nature_kit
            assets/production/medieval/building_shell
            assets/production/medieval/quaternius_market
            assets/production/interiors/quaternius_furniture
            assets/staging/sourcechat_b47
            assets/staging/nature/kenney_nature_kit/License.txt
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/tree_oak.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/tree_detailed.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/tree_pineDefaultA.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/plant_bushDetailed.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/grass_large.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/rock_largeA.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/log_large.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/stump_roundDetailed.glb
            assets/staging/nature/kenney_nature_kit/Models/GLTF format/mushroom_tanGroup.glb
            project.godot
          sparse-checkout-cone-mode: false
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Parse project
        shell: bash
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Prove canonical geography and regional climates
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/impuls-canonical-smoke"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root/scripts" "$smoke_root/tests"
          cp scripts/world_data.gd "$smoke_root/scripts/"
          cp scripts/world_geography.gd "$smoke_root/scripts/"
          cp scripts/world_hydrology.gd "$smoke_root/scripts/"
          cp scripts/capital_data.gd "$smoke_root/scripts/"
          cp tests/smoke_canonical_regions.gd "$smoke_root/tests/"
          cp tests/smoke_canonical_regions.tscn "$smoke_root/tests/"
          cat > "$smoke_root/project.godot" <<'EOF'
          config_version=5

          [application]
          config/name="ImPuls Canonical Geography Smoke"
          config/features=PackedStringArray("4.7", "GL Compatibility")

          [autoload]
          WorldData="*res://scripts/world_data.gd"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

          set +e
          output=$(timeout 30s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$smoke_root" tests/smoke_canonical_regions.tscn 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          detail=$(printf '%s\n' "$output" | tail -n 48 | tr '\n' ' ' | sed 's/%/%25/g' | sed 's/\r//g')
          if [ "$status" -eq 124 ]; then
            echo "::error title=Canonical regions smoke timeout::$detail"
          elif [ "$status" -ne 0 ]; then
            echo "::error title=Canonical regions raw Godot output::$detail"
          fi
          exit "$status"
      - name: Prove player surface, void recovery and movement
        shell: bash
        run: |
          set +e
          output=$(timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_player_movement.tscn 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail=$(printf '%s\n' "$output" | tail -n 32 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Player smoke raw Godot output::$detail"
          fi
          exit "$status"
      - name: Prove buildings are physically enterable
        shell: bash
        run: |
          set +e
          output=$(timeout 30s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_enterable_building.tscn 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 124 ]; then
            echo "::error title=Enterable building smoke timeout::Building physics did not settle within 30 seconds"
          elif [ "$status" -ne 0 ]; then
            detail=$(printf '%s\n' "$output" | tail -n 32 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Enterable building raw Godot output::$detail"
          fi
          exit "$status"
      - name: Prove UI geometry and save slots
        shell: bash
        run: |
          set +e
          output=$(timeout 35s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . tests/smoke_ui_and_save.tscn 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 124 ]; then
            echo "::error title=UI layout smoke timeout::Menu layout did not settle within 35 seconds"
          elif [ "$status" -ne 0 ]; then
            detail=$(printf '%s\n' "$output" | tail -n 32 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=UI smoke raw Godot output::$detail"
          fi
          exit "$status"
