name: Vendor source-chat B38 real CC0 weapons items construction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b38.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b38
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download real CC0 weapons items construction sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b38"
          TMP=".sourcechat_b38_tmp"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/models" "$ROOT/ui" "$TMP"

          stage_zip() {
            local root="$1" name="$2" url="$3" page="$4" title="$5"
            mkdir -p "$TMP/$name" "$root/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-B38/1.0' "$url" -o "$TMP/$name.zip"
            unzip -q "$TMP/$name.zip" -d "$TMP/$name"
            rsync -a "$TMP/$name/" "$root/$name/"
            find "$root/$name" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
            cat > "$root/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$root/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_zip "$ROOT/models" "kenney_weapon_pack" "https://opengameart.org/sites/default/files/weaponPack_assets.zip" "https://opengameart.org/content/weapon-pack" "Kenney Weapon Pack"
          stage_zip "$ROOT/ui" "kenney_generic_items" "https://opengameart.org/sites/default/files/kenney_genericItems_updatedCross.zip" "https://opengameart.org/content/generic-items" "Kenney Generic Items"
          stage_zip "$ROOT/models" "oga_construction_site_kit" "https://opengameart.org/sites/default/files/Contruction%20Site%20Kit.zip" "https://opengameart.org/content/construction-site-kit" "Construction Site Kit"

          cat > "$ROOT/README.md" <<'EOF'
          # Source chat B38 — real CC0 weapons, generic item UI and construction props

          Real downloaded/extracted source assets only. Nothing is connected to gameplay.

          - Kenney Weapon Pack: low-poly weapon models and related renders/source files.
          - Kenney Generic Items: broad CC0 icon/source set for tools, medical, technology, travel, transport and generic inventory categories.
          - Construction Site Kit: CC0 staging source for building-site props. This pack is retained as a source/reference library only; main chat should independently inspect texture/material provenance and visual quality before any production promotion.

          Main chat should select only art-direction-compatible assets, normalize scale/materials and keep SOURCE.md/LICENSE.txt when promoting production copies.
          EOF
          rm -rf "$TMP"
          echo "B38 files:"; find "$ROOT" -type f | wc -l
          du -sh "$ROOT"
      - name: Commit B38 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b38
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 weapons items construction B38"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
