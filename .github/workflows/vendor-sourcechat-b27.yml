name: Vendor source-chat B27 real CC0 traffic and fences

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-sourcechat-b27.yml'

permissions:
  contents: write

concurrency:
  group: vendor-sourcechat-b27
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download real CC0 traffic and fence sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/sourcechat_b27/models"
          TMP=".sourcechat_b27_tmp"
          rm -rf "assets/staging/sourcechat_b27" "$TMP"
          mkdir -p "$ROOT" "$TMP"

          stage_zip() {
            local name="$1" url="$2" page="$3" title="$4"
            mkdir -p "$TMP/$name" "$ROOT/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 900 -A 'ImPuls-CC0-SourceChat-B27/1.0' "$url" -o "$TMP/$name.zip"
            unzip -q "$TMP/$name.zip" -d "$TMP/$name"
            rsync -a "$TMP/$name/" "$ROOT/$name/"
            find "$ROOT/$name" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -delete
            cat > "$ROOT/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_single() {
            local name="$1" url="$2" page="$3" title="$4" filename="$5"
            mkdir -p "$ROOT/$name"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 300 -A 'ImPuls-CC0-SourceChat-B27/1.0' "$url" -o "$ROOT/$name/$filename"
            cat > "$ROOT/$name/SOURCE.md" <<EOF
          # Source
          Pack: $title
          Source page: $page
          Download: $url
          License: CC0 as stated on the source page.
          Status: PHYSICALLY STAGED SOURCE — not gameplay-integrated in this chat.
          EOF
            cat > "$ROOT/$name/LICENSE.txt" <<'EOF'
          CC0 1.0 Universal
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          }

          stage_zip "oga_traffic_road_assets" "https://opengameart.org/sites/default/files/traffic_road_assets.zip" "https://opengameart.org/content/traffic-road-assets" "Traffic Road Assets"
          stage_zip "oga_modular_fence_pack" "https://opengameart.org/sites/default/files/godot-fencePack.zip" "https://opengameart.org/content/modular-fence-pack" "modular fence pack"
          stage_single "oga_basic_wooden_fence" "https://opengameart.org/sites/default/files/picketfence_0.blend" "https://opengameart.org/content/basic-wooden-fence" "Basic Wooden Fence" "picketfence_0.blend"

          cat > "assets/staging/sourcechat_b27/README.md" <<'EOF'
          # Source chat B27 — real CC0 traffic and fences

          Real source assets only; nothing is connected to gameplay.

          - Traffic Road Assets: cones, crush barriers/fences, manhole covers, wood/concrete/plastic roadblocks, streetlights and hydrants; FBX/GLB family.
          - modular fence pack: two fence families, DAE plus Godot meshlib/gridmap sources.
          - Basic Wooden Fence: farm-style Blender fence source.

          Main chat should use these for city streets, work zones, farms, property boundaries and settlement dressing, after scale/material/collision review.
          EOF
          rm -rf "$TMP"
          echo "B27 files:"; find assets/staging/sourcechat_b27 -type f | wc -l
          du -sh assets/staging/sourcechat_b27

      - name: Commit B27 with push-race retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/sourcechat_b27
          git diff --cached --quiet && exit 0
          git commit -m "assets(staging): vendor real CC0 traffic fences B27"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
