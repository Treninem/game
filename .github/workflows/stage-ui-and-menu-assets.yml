name: Stage UI and menu assets

on:
  push:
    paths:
      - .github/workflows/stage-ui-and-menu-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-staging-assets
  cancel-in-progress: true

jobs:
  stage-ui-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            assets/staging/ui
            .github/workflows/stage-ui-and-menu-assets.yml
          sparse-checkout-cone-mode: false

      - name: Download and stage CC0 UI packs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/staging/ui"
          mkdir -p "$ROOT"
          FAILS="$ROOT/UI_DOWNLOAD_FAILURES.txt"
          : > "$FAILS"

          write_source_md() {
            local dir="$1" title="$2" page_url="$3" direct_url="$4" license="$5" summary="$6"
            printf '# %s\n\n- Status: STAGED_PHYSICAL\n- Source page: %s\n- Direct download: %s\n- License: %s\n- Intended use: %s\n- Note: Source-only staging. Do not integrate automatically; the main integration chat should review and select assets deliberately.\n' \
              "$title" "$page_url" "$direct_url" "$license" "$summary" > "$dir/SOURCE.md"
          }

          ensure_license_note() {
            local dir="$1" license="$2"
            if ! find "$dir" -maxdepth 2 \( -iname 'license*' -o -iname 'licence*' -o -iname 'copying*' \) | grep -q .; then
              printf '%s\n\nThis folder was staged from a verified free source for game UI development.\nRefer to SOURCE.md for the exact source page and download URL.\n' "$license" > "$dir/LICENSE.txt"
            fi
          }

          download_zip_pack() {
            local slug="$1" title="$2" page_url="$3" direct_url="$4" license="$5" summary="$6"
            local dir="$ROOT/$slug" tmp
            tmp="$(mktemp /tmp/ui-pack-XXXXXX.zip)"
            rm -rf "$dir" && mkdir -p "$dir"
            if curl --retry 3 --retry-delay 2 -fL "$direct_url" -o "$tmp" && unzip -tq "$tmp" >/dev/null; then
              unzip -oq "$tmp" -d "$dir"
              write_source_md "$dir" "$title" "$page_url" "$direct_url" "$license" "$summary"
              ensure_license_note "$dir" "$license"
            else
              echo "$slug | $direct_url" >> "$FAILS"
              rm -rf "$dir"
            fi
            rm -f "$tmp"
          }

          download_single_file() {
            local slug="$1" file_name="$2" title="$3" page_url="$4" direct_url="$5" license="$6" summary="$7"
            local dir="$ROOT/$slug"
            rm -rf "$dir" && mkdir -p "$dir"
            if curl --retry 3 --retry-delay 2 -fL "$direct_url" -o "$dir/$file_name"; then
              write_source_md "$dir" "$title" "$page_url" "$direct_url" "$license" "$summary"
              ensure_license_note "$dir" "$license"
            else
              echo "$slug | $direct_url" >> "$FAILS"
              rm -rf "$dir"
            fi
          }

          download_zip_pack "kenney_ui_pack" "Kenney UI Pack" "https://opengameart.org/content/ui-pack" "https://opengameart.org/sites/default/files/kenney_ui-pack.zip" "CC0" "General-purpose menu buttons, sliders, panels, fonts and UI sounds."
          download_zip_pack "kenney_ui_pack_adventure" "Kenney UI Pack Adventure" "https://opengameart.org/content/ui-pack-adventure" "https://opengameart.org/sites/default/files/kenney_ui-pack-adventure.zip" "CC0" "Adventure/fantasy buttons, panels and UI pieces for menus and map overlays."
          download_zip_pack "kenney_game_icons" "Kenney Game Icons" "https://opengameart.org/content/game-icons" "https://opengameart.org/sites/default/files/Kenney_gameIcons.zip" "CC0" "Settings, map, quest, save/load, inventory, alerts and HUD button icons."
          download_zip_pack "kenney_board_game_icons" "Kenney Board Game Icons" "https://opengameart.org/content/board-game-icons" "https://opengameart.org/sites/default/files/kenney_board-game-icons.zip" "CC0" "Resource/action icons for map markers, inventory, crafting and systemic UI."
          download_zip_pack "kenney_input_prompts" "Kenney Input Prompts" "https://opengameart.org/content/input-prompts" "https://opengameart.org/sites/default/files/kenney_input-prompts_1.zip" "CC0" "Keyboard, mouse, controller and generic control glyphs."
          download_zip_pack "kenney_cursor_pack" "Kenney Cursor Pack" "https://opengameart.org/content/cursor-pack-1" "https://opengameart.org/sites/default/files/kenney_cursor-pack.zip" "CC0" "180+ bitmap/vector cursors including pointer, hand and sword variants."
          download_zip_pack "simple_button_pack" "Simple Button Pack" "https://opengameart.org/content/simple-button-pack" "https://opengameart.org/sites/default/files/sbs_-_simple_button_pack_2.zip" "CC0" "Generic buttons and tabs with normal/pressed states."
          download_zip_pack "rpg_inventory" "RPG Inventory" "https://opengameart.org/content/inventory" "https://opengameart.org/sites/default/files/Inventory_0.zip" "CC0" "Inventory UI with icons and dark/copper borders."
          download_zip_pack "rpg_inventory_icons" "2D RPG Item Icons" "https://opengameart.org/content/2d-rpg-item-icons" "https://opengameart.org/sites/default/files/rpg_inventory.zip" "CC0" "Armor, swords, potions and crafting material icons."
          download_zip_pack "rpg_ui_icons" "RPG UI Icons" "https://opengameart.org/content/rpg-ui-icons" "https://opengameart.org/sites/default/files/RPG_Icons_Pack_OwlishMedia.zip" "CC0" "16x16 and 32x32 status, magic, weapon, armor, item and medicine icons."
          download_zip_pack "map_editor_ui_icons" "UI Icons 01" "https://opengameart.org/content/ui-icons-01" "https://opengameart.org/sites/default/files/UI-Icons01.zip" "CC0" "Small RPG map-editor icons useful for map markers and compact UI labels."
          download_single_file "map_marker_active" "map-marker-23x31-active.svg" "Map Location Marker Active" "https://opengameart.org/content/map-location-marker" "https://opengameart.org/sites/default/files/map-marker-23x31-active.svg" "CC0" "Active/highlighted location marker for world map points of interest."
          download_single_file "map_marker_normal" "map-marker-23x31.svg" "Map Location Marker" "https://opengameart.org/content/map-location-marker" "https://opengameart.org/sites/default/files/map-marker-23x31_0.svg" "CC0" "Normal location marker for world map points of interest."
          download_single_file "parchment_map_texture" "Parchment.jpg" "Parchement Textures" "https://opengameart.org/content/parchement-textures" "https://opengameart.org/sites/default/files/Parchment.jpg" "CC0" "Parchment/paper background for world map, journal and decorative panels."

          printf '%s\n' \
            '# UI staging' \
            '' \
            'Source-only UI assets for menus, maps, HUDs, inventory and decorative interface work.' \
            '' \
            '- kenney_ui_pack: broad default UI system.' \
            '- kenney_ui_pack_adventure: fantasy/adventure UI system.' \
            '- kenney_game_icons / kenney_board_game_icons: map, inventory, settings and systemic icons.' \
            '- kenney_input_prompts: keyboard/mouse/controller glyphs.' \
            '- kenney_cursor_pack: cursor and pointer variants.' \
            '- simple_button_pack: fallback button/tab states.' \
            '- rpg_inventory / rpg_inventory_icons: inventory, loot and crafting UI.' \
            '- rpg_ui_icons / map_editor_ui_icons: status, magic, map and compact systemic icons.' \
            '- map_marker_active / map_marker_normal: vector world-map POI markers.' \
            '- parchment_map_texture: map/journal background.' \
            '' \
            'Main integration chat should review style fit and copy only selected assets into production UI folders.' \
            > "$ROOT/UI_STAGING_README.md"

      - name: Commit staged UI assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/staging/ui)" ]; then
            echo "No staged UI changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/staging/ui
          git commit -m "assets(staging): add CC0 UI button menu map icon packs"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Failed to push staged UI assets after retries" >&2
          exit 1
